name: Farm responsive browser QA
on:
  push:
    branches: [fix/farm-mobile-overlap-rabbit]
    paths: [.github/workflows/farm-responsive-qa.yml]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Check iPhone landscape, tablet, desktop and phone portrait
        run: |
          mkdir -p qa
          python3 -m http.server 8877 >/tmp/farm-responsive-http.log 2>&1 &
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
            const devices=[
              {name:'iphone-landscape',width:844,height:390,mobile:true,dpr:2},
              {name:'iphone-large-landscape',width:932,height:430,mobile:true,dpr:2},
              {name:'ipad-landscape',width:1024,height:768,mobile:true,dpr:2},
              {name:'desktop',width:1536,height:960,mobile:false,dpr:1},
              {name:'phone-portrait',width:390,height:844,mobile:true,dpr:2}
            ];
            let failed=false;
            for(const d of devices){
              const ctx=await browser.newContext({
                viewport:{width:d.width,height:d.height},isMobile:d.mobile,
                deviceScaleFactor:d.dpr,hasTouch:d.mobile
              });
              const page=await ctx.newPage(),errors=[];
              page.on('pageerror',e=>errors.push(e.message));
              await page.goto('http://127.0.0.1:8877/minigames/math-tycoon-v3.html',{waitUntil:'domcontentloaded'});
              await page.waitForFunction(()=>document.querySelectorAll('.customer-actor').length===3,{timeout:15000});
              await page.waitForTimeout(750);
              const x=await page.evaluate(()=>{
                const box=q=>{const e=document.querySelector(q);const r=e?.getBoundingClientRect();return r?{x:r.x,y:r.y,r:r.right,b:r.bottom,w:r.width,h:r.height}:null};
                const overlap=(a,b)=>{
                  if(!a||!b)return null;
                  return Math.max(0,Math.min(a.r,b.r)-Math.max(a.x,b.x))*Math.max(0,Math.min(a.b,b.b)-Math.max(a.y,b.y));
                };
                const g=box('.garden-wrap'),c=box('.customer-zone'),f=box('.helper'),p=box('.pack-station'),w=box('.warehouse');
                return {viewport:[innerWidth,innerHeight],garden:g,customers:c,farmer:f,packing:p,warehouse:w,
                  intersections:{gardenGuests:overlap(g,c),farmerGuests:overlap(f,c),farmerPacking:overlap(f,p),packingWarehouse:overlap(p,w)},
                  armsFallback:document.querySelector('#visitor')?.getAttribute('src'),
                  gardenSlots:document.querySelectorAll('.plot').length,
                  characterCount:document.querySelectorAll('.customer-actor > img').length,
                  scrollHeight:document.documentElement.scrollHeight,
                  dock:box('.action-dock')
                };
              });
              await page.screenshot({path:'qa/farm-'+d.name+'.png',fullPage:true});
              let compact=d.width<1100||d.height<730;
              let collisions=compact?Object.entries(x.intersections).filter(([,v])=>v!==null&&v>40):[];
              const okay=!errors.length&&x.gardenSlots===6&&x.characterCount===3&&
                x.armsFallback.includes('stickers/rabbit.png')&&!collisions.length&&x.dock.h>=50;
              console.log('FARM_RESPONSIVE_QA',JSON.stringify({name:d.name,okay,collisions,errors,layout:x}));
              if(!okay)failed=true;
              await ctx.close();
            }
            await browser.close();
            if(failed)process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: farm-responsive-screens
          path: qa/farm-*.png
