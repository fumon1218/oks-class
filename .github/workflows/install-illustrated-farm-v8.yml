name: Install illustrated farm v8
on:
  push:
    branches: [main]
    paths:
      - 'art/farm/install/farm_v8_install.zip'
permissions:
  contents: write
  pages: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify and install original illustrated game
        run: python3 scripts/install_farm_v8.py
      - name: Verify JavaScript syntax and existing mini-games
        run: |
          node --check minigames/farm-v8/game.js
          node scripts/smoke-test.mjs
      - name: Commit verified game and all original sprites to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: install full-scene illustrated farm v8 and activate maths classroom'
          git push origin HEAD:main
      - name: Request Pages rebuild after Actions commit
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.repos.requestPagesBuild({owner: context.repo.owner, repo: context.repo.repo});
              core.info('Requested a Pages rebuild for the newly installed original artwork.');
            } catch (e) {
              core.warning('Please check GitHub Pages deployment after install: '+e.message);
            }
