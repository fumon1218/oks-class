<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>옥쌤의 마을 통합 퀘스트</title>
<style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(#c9eaff,#fcecdf);color:#344c55;font-family:system-ui,"Noto Sans KR",sans-serif}button,a{font:inherit}a{text-decoration:none;color:inherit}
button:focus-visible,a:focus-visible{outline:4px solid #d49b22;outline-offset:3px}main{max-width:930px;width:94vw;margin:20px auto 55px}
.top{display:flex;flex-wrap:wrap;gap:9px}.top a{background:white;padding:12px 17px;border-radius:23px;font-weight:850}
h1{text-align:center;font-size:clamp(25px,4vw,36px);margin:16px 0;color:#26766b}.lead{text-align:center;color:#51706f;font-weight:750}
.banner{background:linear-gradient(135deg,#f8ffdb,#e2f8f0);border:4px solid white;border-radius:25px;padding:18px;margin:13px 0;box-shadow:0 10px 23px #286f7233}
.tabs{display:flex;flex-wrap:wrap;gap:10px;margin:13px 0}.tabs button{flex:1;border:3px solid white;border-radius:17px;min-height:68px;padding:12px;background:white;font-weight:900;color:#2d6659}.tabs button[aria-pressed=true]{background:#e4f9dc;border-color:#4eaf84}
.task{background:white;border:3px solid #dfefe7;display:flex;align-items:center;gap:13px;margin:10px 0;padding:13px;border-radius:19px;box-shadow:0 4px 14px #337a6740}
.task .emoji{font-size:42px;flex:0 0 51px;text-align:center}.task .body{flex:1;min-width:0}.task h3{margin:0 0 4px;font-size:19px}.task p{margin:3px 0;color:#5c736c;font-size:14px}
.task a{background:#328f71;color:white;border-radius:14px;font-weight:800;text-align:center;padding:12px 15px;min-height:50px;display:flex;align-items:center;justify-content:center}
.task.done{border-color:#61b38c}.task .state{color:#207752;font-weight:900;font-size:13px}
.progress{border:3px solid #cbe9db;background:#ecf8ed;border-radius:999px;overflow:hidden;height:20px;margin:9px 0}.fill{height:100%;background:#52b789;width:0;transition:width .3s}
.note{font-size:13px;color:#60766d;line-height:1.6}
@media(max-width:520px){.task{flex-wrap:wrap}.task a{width:100%}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main><div class="top"><a href="../index.html">🏡 마을</a><a href="../minigames/index.html">🎮 교과 게임</a><a href="../curriculum/teacher-guide.html">⚙️ 교사 설정</a></div>
<h1>🗺️ 오늘의 마을 대모험</h1><p class="lead">교실에서 배운 내용을 마을 생활과 연결해 보아요!</p>
<div class="tabs"><button type="button" id="spring" aria-pressed="true">🌸 봄맞이 마을 축제</button><button type="button" id="cafe" aria-pressed="false">☕ 동물 친구 카페의 하루</button></div>
<div class="banner"><h2 id="title" style="margin:0 0 7px">축제를 준비해요!</h2><p id="subtitle"></p><div class="progress"><div id="fill" class="fill"></div></div><strong id="progressText">0 / 5 퀘스트</strong></div>
<div id="tasks"></div>
<div class="banner"><h2>📘 선생님께</h2><p class="note">아래 완료 표시는 게임을 시도하여 기기에 기록된 활동의 유무만 나타냅니다. 정확한 교육과정 성취 여부, 지원 수준, 실제 생활 속 적용은 관찰해 별도 평가해 주세요. 이 화면은 학생 식별정보를 수집하거나 서버로 전송하지 않습니다.</p><button type="button" id="refresh" style="background:#328f71;border:none;color:white;padding:12px 18px;min-height:50px;border-radius:15px;font-weight:850">🔄 진행 상황 새로고침</button></div></main>
<script>
(function(){
"use strict";
var $=id=>document.getElementById(id),type=new URLSearchParams(location.search).get('quest')==='cafe'?'cafe':'spring';
var tasks={
 spring:[
 {emoji:'📚',subject:'국어',title:'봄 소식 듣고 이야기하기',desc:'생활 낱말과 안내문을 알아보아요.',game:'korean-09',link:'../minigames/index.html?subject=korean&game=9'},
 {emoji:'🔢',subject:'수학',title:'축제 꽃과 장식의 수량 세기',desc:'필요한 수만큼 물건을 모아요.',game:'math-01',link:'../play/?id=02-01-01-01'},
 {emoji:'🎨',subject:'미술',title:'봄꽃 장식 만들기',desc:'좋아하는 색으로 표현해요.',game:'art-01',link:'../minigames/art-tycoon.html'},
 {emoji:'🔬',subject:'과학',title:'씨앗이 자라는 순서 살피기',desc:'식물이 성장하는 과정을 살펴요.',game:'science-02',link:'../minigames/index.html?subject=science&game=2'},
 {emoji:'🌎',subject:'사회',title:'친구와 함께 축제 준비하기',desc:'도움이 필요한 친구를 존중해요.',game:'social-09',link:'../minigames/index.html?subject=social&game=9'}
 ],
 cafe:[
 {emoji:'📚',subject:'국어',title:'손님을 반갑게 맞이하기',desc:'상황에 맞는 인사말을 골라요.',game:'korean-02',link:'../minigames/index.html?subject=korean&game=2'},
 {emoji:'🔢',subject:'수학',title:'주문 금액 계산하기',desc:'생활 속 간단한 물건 값 계산을 해요.',game:'math-07',link:'../minigames/index.html?subject=math&game=7'},
 {emoji:'🌎',subject:'사회',title:'동네 가게의 역할 알아보기',desc:'지역사회에서 가게의 역할을 배워요.',game:'social-05',link:'../minigames/index.html?subject=social&game=5'},
 {emoji:'☕',subject:'진로와 직업',title:'동물 친구 카페에서 일하기',desc:'손님 인사·주문·준비·서빙·계산을 해요.',game:'cafe',link:'../career/barista.html'}
 ]};
function records(k,fallback){try{return JSON.parse(localStorage.getItem(k)||fallback)}catch(e){return JSON.parse(fallback)}}
function completed(task){
 if(task.game==='cafe')return records('oks-career-cafe-v1','[]').some(x=>x.completed);
 return Boolean(records('oks_five_subjects_v1','{}')[task.game]);
}
function render(){
 $('spring').setAttribute('aria-pressed',String(type==='spring')),$('cafe').setAttribute('aria-pressed',String(type==='cafe'));
 $('title').textContent=type==='spring'?'🌸 우리 마을 봄 축제 준비하기':'☕ 카페에서 하루 일하기';
 $('subtitle').textContent=type==='spring'?'다섯 교과에서 필요한 일을 해 보며 함께 축제를 준비해요.':'국어·수학·사회에서 익힌 내용을 동물 친구 카페에서 연결해요.';
 var list=tasks[type],done=list.filter(completed).length;
 $('progressText').textContent=done+' / '+list.length+'개 활동 시도 기록';
 $('fill').style.width=(100*done/list.length)+'%';$('tasks').innerHTML='';
 list.forEach(function(t){var article=document.createElement('article');article.className='task'+(completed(t)?' done':'');
 var icon=document.createElement('div');icon.className='emoji';icon.textContent=t.emoji;
 var b=document.createElement('div');b.className='body';
 var tag=document.createElement('strong');tag.className='state';tag.textContent=t.subject+(completed(t)?' · ✓ 활동 기록 있음':' · 모험 기다리는 중');
 var h=document.createElement('h3');h.textContent=t.title;
 var p=document.createElement('p');p.textContent=t.desc;b.append(tag,h,p);
 var a=document.createElement('a');a.href=t.link;a.textContent=completed(t)?'다시 해보기':'도전하기 →';article.append(icon,b,a);$('tasks').appendChild(article)})
}
$('spring').onclick=function(){type='spring';render()};$('cafe').onclick=function(){type='cafe';render()};
$('refresh').onclick=render;window.addEventListener('pageshow',render);render();
})();
</script></body></html>
