<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#2b3f5c">
<title>3D 체스 · 놀이별</title><link rel="icon" href="../../icons/ok-face-192.png"><link rel="apple-touch-icon" href="../../icons/ok-face-180.png">
<link rel="stylesheet" href="../../core/oks-core.css"><link rel="stylesheet" href="chess.css"></head>
<body class="oks chess-page">
<canvas id="gl" aria-label="3D 체스판"></canvas>
<header class="ch-top">
  <a class="ch-btn" id="back" href="../">← 놀이별</a>
  <div class="ch-title"><span id="modeLabel">전략놀이</span><b>3D 체스</b></div>
  <div class="ch-tools">
    <button class="ch-btn" id="btnHelp" type="button" aria-label="놀이 방법">❓</button>
    <button class="ch-btn" id="btnVoice" type="button" aria-label="안내 음성 켜기·끄기">🔊</button>
    <button class="ch-btn" id="btnMenu" type="button" aria-label="새 놀이 고르기">☰ 새로</button>
  </div>
</header>
<div class="ch-msg" id="msg" role="status" aria-live="polite"><span id="msgText">말을 꺼내는 중이에요…</span></div>
<div class="ch-captured" id="capW" aria-label="잡힌 흰 말"></div><div class="ch-captured b" id="capB" aria-label="잡힌 검은 말"></div>
<footer class="ch-bottom">
  <button class="ch-btn big" id="btnUndo" type="button">↩ 한 수 물리기</button>
  <button class="ch-btn big" id="btnHint" type="button">💡 힌트</button>
  <button class="ch-btn big" id="btnView" type="button">🔄 시점 바꾸기</button>
  <button class="ch-btn big" id="btnLock" type="button" aria-pressed="false">🔓 화면 돌리기</button>
  <button class="ch-btn big" id="btnAssist" type="button" aria-pressed="true">✅ 갈 수 있는 칸 보기</button>
</footer>
<div class="ch-loading" id="loading"><div><div class="ch-spin"></div><p>3D 체스판을 펼치는 중…</p></div></div>
<div class="ch-overlay" id="menu" hidden></div>
<div class="ch-overlay" id="promo" hidden><div class="ch-card"><h2>어떤 말로 바꿀까요?</h2><div class="ch-promo" id="promoBtns"></div></div></div>
<dialog id="helpDialog" class="ch-dialog"><h2>이렇게 놀아요</h2>
<ol><li><b>말을 눌러요.</b> 갈 수 있는 칸이 초록 점으로 보여요. 빨간 동그라미는 상대 말을 잡는 칸이에요.</li><li><b>가고 싶은 칸을 눌러요.</b> 말이 가볍게 걸어가요.</li><li>상대 <b>킹</b>이 도망갈 곳이 없으면 이겨요. 이걸 <b>체크메이트</b>라고 해요.</li><li>화면을 손가락으로 쓸면 판을 돌려 볼 수 있어요. 어려우면 <b>화면 돌리기</b> 버튼으로 고정해요.</li></ol>
<form method="dialog"><button class="ch-btn big">알겠어요</button></form></dialog>
<script src="../../core/oks-core.js"></script><script src="../../core/oks-eco.js"></script><script src="engine.js"></script>
<script type="module" src="chess.js"></script>
<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('../../sw.js').catch(function(){});</script>
</body></html>
