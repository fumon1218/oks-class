<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#1f4a2c">
<title>3D 오셀로 · 놀이별</title><link rel="icon" href="../../icons/ok-face-192.png"><link rel="apple-touch-icon" href="../../icons/ok-face-180.png">
<link rel="stylesheet" href="../../core/oks-core.css"><link rel="stylesheet" href="../chess/chess.css"><link rel="stylesheet" href="othello.css"></head>
<body class="oks chess-page othello-page">
<canvas id="gl" aria-label="3D 오셀로판"></canvas>
<header class="ch-top">
  <a class="ch-btn" id="back" href="../">← 놀이별</a>
  <div class="ch-title"><span id="modeLabel">전략놀이</span><b>3D 오셀로</b></div>
  <div class="ch-tools">
    <button class="ch-btn" id="btnHelp" type="button" aria-label="놀이 방법">❓</button>
    <button class="ch-btn" id="btnVoice" type="button" aria-label="안내 음성 켜기·끄기">🔊</button>
    <button class="ch-btn" id="btnMenu" type="button" aria-label="새 놀이 고르기">☰ 새로</button>
  </div>
</header>
<div class="ch-msg" id="msg" role="status" aria-live="polite"><span id="msgText">오셀로판을 펼치는 중이에요…</span></div>
<div class="ot-score" id="score" aria-live="polite"><span class="b" id="scB">⚫ 2</span><span class="w" id="scW">⚪ 2</span></div>
<footer class="ch-bottom">
  <button class="ch-btn big" id="btnUndo" type="button">↩ 한 수 물리기</button>
  <button class="ch-btn big" id="btnHint" type="button">💡 힌트</button>
  <button class="ch-btn big" id="btnView" type="button">🔄 시점 바꾸기</button>
  <button class="ch-btn big" id="btnLock" type="button" aria-pressed="false">🔓 화면 돌리기</button>
  <button class="ch-btn big" id="btnAssist" type="button" aria-pressed="true">✅ 둘 수 있는 곳 보기</button>
</footer>
<div class="ch-loading" id="loading"><div><div class="ch-spin"></div><p>3D 오셀로판을 펼치는 중…</p></div></div>
<div class="ch-overlay" id="menu" hidden></div>
<dialog id="helpDialog" class="ch-dialog"><h2>이렇게 놀아요</h2>
<ol><li><b>초록 점을 눌러요.</b> 내 돌로 상대 돌을 <b>양쪽에서 끼울 수 있는 곳</b>에만 놓을 수 있어요.</li><li>끼인 상대 돌은 모두 <b>내 색으로 뒤집혀요.</b> 가로·세로·대각선 모두 돼요.</li><li>둘 곳이 없으면 자동으로 차례가 넘어가요.</li><li>판이 가득 차면 <b>돌이 더 많은 쪽</b>이 이겨요.</li><li><b>구석 4곳</b>은 절대 뒤집히지 않는 보물 자리예요! 구석 바로 옆 칸은 조심해요.</li></ol>
<form method="dialog"><button class="ch-btn big">알겠어요</button></form></dialog>
<script src="../../core/oks-core.js"></script><script src="../../core/oks-eco.js"></script><script src="engine.js"></script>
<script type="module" src="othello.js"></script>
<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('../../sw.js').catch(function(){});</script>
</body></html>
