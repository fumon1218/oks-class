<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>소리 별 - 글자 받기</title><style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(#b9e9ff,#e4ffe5);color:#244766;font-family:system-ui,"Noto Sans KR",sans-serif}main{max-width:1020px;margin:auto;padding:14px}h1{text-align:center;color:#25748e}button,a,select{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,select:focus-visible{outline:4px solid #eeb64b;outline-offset:3px}a{text-decoration:none;color:#20575d}
.top,.control,.settings{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.top{justify-content:space-between}.pill,button,select{border:2px solid #b6ded4;border-radius:16px;background:white;padding:11px 15px;font-weight:800;min-height:48px;color:#265b59}
.primary{background:#2f9d77;color:white;border-color:#2f9d77}.panel{border-radius:23px;background:#ffffffed;padding:16px;margin-top:13px;box-shadow:0 8px 25px #155b7530}.hud{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}.hud div{background:white;border:2px solid #fff;padding:11px;border-radius:15px;font-weight:900;box-shadow:0 4px 12px #276e8730}
.field{position:relative;width:100%;height:clamp(360px,48vw,500px);margin-top:13px;border:6px solid white;border-radius:25px;overflow:hidden;touch-action:none;background:linear-gradient(#8bd7fa,#e6fbff 72%,#87cfa0 73%,#65b680);user-select:none;box-shadow:0 12px 22px #16588b4a}
.cloud{position:absolute;top:15%;left:12%;width:150px;height:45px;border-radius:50%;background:#fff9;box-shadow:330px 55px 2px #fff7}
.drop{position:absolute;top:0;left:0;width:65px;height:65px;border:4px solid white;border-radius:50%;background:radial-gradient(circle at 25% 20%,#fff,#d9bdff 73%,#a08bdd);display:grid;place-items:center;font-size:39px;font-weight:900;color:#403586;box-shadow:0 7px 10px #2c537b60;pointer-events:none;will-change:transform}.drop.glow{box-shadow:0 0 0 6px #ffd777b0,0 7px 10px #2c537b60}
.basket{position:absolute;bottom:9%;left:50%;width:110px;height:86px;transform:translateX(-50%);z-index:3;display:flex;align-items:flex-end;justify-content:center;pointer-events:none}.basket img{width:110px;height:80px;object-fit:contain;filter:drop-shadow(0 6px 4px #34643a60)}.target{position:absolute;top:-15px;left:50%;transform:translateX(-50%);background:white;border:3px solid #37a578;border-radius:25px;padding:1px 14px;font-size:26px;font-weight:900}
.flash{position:absolute;top:12%;left:50%;transform:translateX(-50%);background:#fff4d2;border:3px solid #ffd265;border-radius:28px;padding:12px;font-weight:950;font-size:27px;z-index:5;display:none}.flash.on{display:block}
.tap{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:10px;margin:15px 0}.tap button{font-size:35px;min-height:90px;background:linear-gradient(#fff,#e2fbf0)}
#msg{font-weight:800;min-height:30px}label{font-weight:700}small{line-height:1.55;color:#627783}#tap[hidden]{display:none}
@media(max-width:520px){.field{height:390px}.hud{font-size:14px}.top{font-size:13px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main><div class="top"><a class="pill" href="index.html">← 국어 도서관</a><a class="pill" href="../index.html">🏡 학교 마을</a><a class="pill" href="../curriculum/teacher-guide.html">⚙️ 교사 설정</a></div>
<h1>🌟 소리 별 · 글자 받기</h1><div class="hud"><div id="mission">📋 목표 글자를 찾아요</div><div id="score">⭐ 0</div><div id="progress">🎯 0 / 5</div></div>
<div class="field" id="field" aria-label="글자 받기 게임. 바구니를 터치나 방향키로 움직입니다."><div class="cloud"></div><div class="flash" id="flash">⭐ GOOD!</div><div class="basket" id="basket"><img src="../art/stickers/basket.png" alt=""><span class="target" id="target">ㄱ</span></div></div>
<section class="panel"><div class="settings"><label>학습 유형 <select id="letters"><option value="consonant">자음</option><option value="vowel">모음</option></select></label>
<label>활동 지원 <select id="mode"><option value="explore">🌱 탐색: 카드 탭</option><option value="guided">🍀 선택: 천천히 받기</option><option value="independent">🌳 도전: 글자 받기</option></select></label><label><input id="glow" type="checkbox" checked> 정답 반짝임</label></div>
<h2 id="instruction">목표 글자를 바구니로 받아요!</h2><div id="msg" role="status" aria-live="polite">시작을 눌러요!</div><div id="tap" class="tap" hidden></div>
<div class="control"><button id="start" class="primary">▶ 시작</button><button id="pause" disabled>Ⅱ 일시정지</button><button id="hear">🔊 듣기</button><button id="help">💡 도움말</button><button id="reset">↻ 처음부터</button></div>
<p><small>시간 제한이나 생명 감소가 없습니다. 글자를 놓쳐도 다시 나타나요. 탐색 모드에서는 움직이지 않는 큰 글자를 선택할 수 있습니다. 게임 별과 교사의 성취 평가는 별개입니다.</small></p></section></main>
<script>
(function(){
"use strict";
var C=['ㄱ','ㄴ','ㄷ','ㄹ','ㅁ','ㅂ','ㅅ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'],V=['ㅏ','ㅑ','ㅓ','ㅕ','ㅗ','ㅛ','ㅜ','ㅠ','ㅡ','ㅣ'];
var names={'ㄱ':'기역','ㄴ':'니은','ㄷ':'디귿','ㄹ':'리을','ㅁ':'미음','ㅂ':'비읍','ㅅ':'시옷','ㅇ':'이응','ㅈ':'지읒','ㅊ':'치읓','ㅋ':'키읔','ㅌ':'티읕','ㅍ':'피읖','ㅎ':'히읗','ㅏ':'아','ㅑ':'야','ㅓ':'어','ㅕ':'여','ㅗ':'오','ㅛ':'요','ㅜ':'우','ㅠ':'유','ㅡ':'으','ㅣ':'이'};
var el=function(x){return document.getElementById(x)},field=el('field'),basket=el('basket');
var mode='guided',kind='consonant',list=[],idx=0,score=0,wrong=0,helps=0,started=false,paused=true,finished=false,spawnElapsed=0,last=0,raf=0,basketX=.5,glow=true,drops=[],nextId=1;
try{var p=JSON.parse(localStorage.getItem('oks_iep_config_v1')||'{}');if(['explore','guided','independent'].includes(p.mode))mode=p.mode}catch(e){}
el('mode').value=mode;
function shuffled(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function speak(s){if(!('speechSynthesis' in window))return;try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(s);u.lang='ko-KR';u.rate=.8;speechSynthesis.speak(u)}catch(e){}}
function sayTarget(){if(list[idx])speak((names[list[idx]]||list[idx])+' 글자를 찾아보세요.')}
function msg(s){el('msg').textContent=s}
function hud(){var ch=list[idx];el('mission').textContent=ch?'📋 '+names[ch]+' ('+ch+') 받기':'🌟 미션 완료';el('target').textContent=ch||'⭐';el('score').textContent='⭐ '+score;el('progress').textContent='🎯 '+idx+' / '+list.length;el('instruction').textContent=ch?ch+' 글자를 찾아보세요!':'소리 별 여행을 마쳤어요!'}
function clearDrops(){drops.forEach(function(d){d.node.remove()});drops=[];spawnElapsed=0}
function reset(){cancelAnimationFrame(raf);clearDrops();started=false;paused=true;finished=false;last=0;idx=0;score=0;wrong=0;helps=0;nextId=1;kind=el('letters').value;mode=el('mode').value;glow=el('glow').checked;list=shuffled(kind==='vowel'?V:C).slice(0,mode==='explore'?3:mode==='guided'?5:7);basketX=.5;basket.style.left='50%';el('tap').hidden=true;el('start').disabled=false;el('start').textContent='▶ 시작';el('pause').disabled=true;el('pause').textContent='Ⅱ 일시정지';hud();msg('시작을 눌러요!')}
function spawn(force){if(drops.length>=10)return;var t=list[idx],arr=kind==='vowel'?V:C,c=force||Math.random()<.46?t:arr[Math.floor(Math.random()*arr.length)];var node=document.createElement('div');node.className='drop'+(glow&&c===t?' glow':'');node.textContent=c;node.setAttribute('aria-hidden','true');field.appendChild(node);drops.push({id:nextId++,node:node,c:c,x:25+Math.random()*Math.max(1,field.clientWidth-90),y:-74,speed:mode==='independent'?117:66})}
function flash(s){el('flash').textContent=s;el('flash').classList.add('on');setTimeout(function(){el('flash').classList.remove('on')},650)}
function complete(){finished=true;paused=true;started=false;cancelAnimationFrame(raf);clearDrops();el('start').disabled=true;el('pause').disabled=true;el('tap').hidden=true;hud();flash('🌟 CLEAR!');msg('게임을 완성했어요!');speak('모험을 완성했어요! 잘했어요!');try{var k='oks_literacy_catch_v1',r=JSON.parse(localStorage.getItem(k)||'[]');if(!Array.isArray(r))r=[];r.unshift({at:new Date().toISOString(),mode:mode,type:kind,score:score,wrong:wrong,helps:helps,completed:true});localStorage.setItem(k,JSON.stringify(r.slice(0,30)))}catch(e){}}
function correct(){score+=10;idx++;clearDrops();flash('⭐ GOOD!');if(idx>=list.length){complete();return}hud();msg('좋아요! 다음 글자를 찾아요.');sayTarget();if(mode==='explore')renderTap();else spawn(true)}
function renderTap(){clearDrops();var t=list[idx],opts=shuffled([t].concat(shuffled((kind==='vowel'?V:C).filter(function(x){return x!==t})).slice(0,2)));el('tap').innerHTML='';opts.forEach(function(c){var b=document.createElement('button');b.type='button';b.textContent=c;b.setAttribute('aria-label',names[c]);b.onclick=function(){if(c===t)correct();else{wrong++;msg('다시 들어보고 찾아보아요.')}};el('tap').appendChild(b)});el('tap').hidden=false}
function frame(now){if(!started||paused||finished)return;var dt=last?Math.min(.05,(now-last)/1000):0;last=now;spawnElapsed+=dt;var width=field.clientWidth,height=field.clientHeight;if(spawnElapsed>(mode==='independent'?1.12:1.9)){spawnElapsed=0;spawn(false)}
 for(var i=drops.length-1;i>=0;i--){var d=drops[i];d.y+=dt*d.speed;d.node.style.transform='translate('+d.x+'px,'+d.y+'px)';if(d.y>height-140&&d.y<height-80&&d.x+31>basketX*width-(mode==='guided'?80:60)&&d.x+31<basketX*width+(mode==='guided'?80:60)){drops.splice(i,1);d.node.remove();if(d.c===list[idx]){correct();break}else{wrong++;msg('다른 글자예요. 목표 글자를 기다려요.')}}else if(d.y>height){drops.splice(i,1);d.node.remove()}}
 raf=requestAnimationFrame(frame)}
function start(){if(finished)reset();if(!started){reset();started=true}else if(!paused)return;paused=false;last=0;el('pause').disabled=false;el('start').disabled=true;hud();sayTarget();if(mode==='explore')renderTap();else{if(!drops.length)spawn(true);raf=requestAnimationFrame(frame)}msg('목표 글자를 찾아요!')}
function pause(){if(!started||finished)return;paused=!paused;el('pause').textContent=paused?'▶ 계속':'Ⅱ 일시정지';if(paused){cancelAnimationFrame(raf);el('start').disabled=false;msg('쉬었다 해도 괜찮아요.')}else{last=0;el('start').disabled=true;if(mode!=='explore')raf=requestAnimationFrame(frame)}}
function move(e){if(!started||paused||mode==='explore')return;var r=field.getBoundingClientRect();basketX=Math.min(.91,Math.max(.09,(e.clientX-r.left)/r.width));basket.style.left=basketX*100+'%'}
field.addEventListener('pointerdown',function(e){move(e);if(e.pointerType==='touch')e.preventDefault()});field.addEventListener('pointermove',function(e){if(e.buttons===1||e.pointerType==='touch')move(e)});
window.addEventListener('keydown',function(e){if(!started||paused||mode==='explore'||(e.key!=='ArrowLeft'&&e.key!=='ArrowRight'))return;e.preventDefault();basketX=Math.min(.91,Math.max(.09,basketX+(e.key==='ArrowLeft'?-.08:.08)));basket.style.left=basketX*100+'%'});
el('start').onclick=start;el('pause').onclick=pause;el('reset').onclick=reset;el('hear').onclick=sayTarget;el('help').onclick=function(){helps++;glow=true;msg('빛나는 글자를 찾아보아요!');sayTarget();drops.forEach(function(d){if(d.c===list[idx])d.node.classList.add('glow')})};
el('mode').onchange=reset;el('letters').onchange=reset;el('glow').onchange=function(){glow=this.checked;drops.forEach(function(d){d.node.classList.toggle('glow',glow&&d.c===list[idx])})};
document.addEventListener('visibilitychange',function(){if(document.hidden&&started&&!paused)pause()});reset();
})();
</script></body></html>
