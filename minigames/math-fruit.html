<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>수학 과일·채소 배달 대작전 | 옥쌤의 즐거운 교실</title><meta name="theme-color" content="#42a783"><style>
*{box-sizing:border-box}body{margin:0;background:#d8f6e8;color:#355043;font-family:system-ui,"Noto Sans KR",sans-serif}
button,a,select{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,select:focus-visible{outline:4px solid #f7b733;outline-offset:4px}a{text-decoration:none;color:inherit}
header{height:auto;padding:8px 14px;display:flex;align-items:center;gap:8px;justify-content:space-between;background:#ffffffe9;box-shadow:0 4px 16px #385d5038;position:relative;z-index:5}
header a,header button{min-height:48px;padding:10px 14px;border:2px solid #c9e8dc;background:#fff;border-radius:24px;font-weight:900}
header .name{font-weight:950;font-size:clamp(15px,2vw,22px);color:#34795d}
.game{position:relative;min-height:calc(100dvh - 68px);padding:14px;background:linear-gradient(#abe4eb30,#deefd462),url("https://fumon1218.github.io/jungle-jump/assets/wj/farm/bg_farm.jpg") center/cover no-repeat}
.game:before{content:"";position:absolute;inset:0;background:linear-gradient(#e5fcfa48,transparent 35%,#fff2c142);pointer-events:none}
.topline{position:relative;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:0 auto 8px;max-width:1320px}
.hud{border:3px solid #fff5de;border-radius:20px;background:#fffdf5ed;color:#78603e;padding:9px 13px;box-shadow:0 5px 15px #50684960;font-weight:950;font-size:clamp(14px,2vw,22px)}
.hud strong{color:#278d68}.ticks{display:flex;gap:4px;align-items:center}
.ticks span{height:11px;flex:1;min-width:6px;background:#e0e7d3;border-radius:99px}.ticks .done{background:#45b884}.ticks .active{background:#ffcf4e}
.scene{position:relative;max-width:1320px;margin:0 auto;min-height:clamp(390px,55dvh,640px);border:5px solid #ffffffce;border-radius:30px;box-shadow:0 16px 33px #32675176;background:linear-gradient(135deg,#d8edec27,#e2f9db25);overflow:hidden;padding:14px;display:grid;grid-template-columns:minmax(105px,22%) minmax(0,1fr) minmax(130px,25%);gap:12px;align-items:center}
.friend{text-align:center;align-self:end;position:relative;z-index:2}.friend img{height:clamp(115px,21vw,280px);width:100%;object-fit:contain;filter:drop-shadow(0 12px 9px #39563c88);animation:hello 3s ease-in-out infinite}
.bubble{padding:12px 10px;border-radius:23px;background:#fffefa;border:4px solid #e6cf80;font-weight:950;line-height:1.35;font-size:clamp(14px,1.9vw,22px);box-shadow:0 6px 12px #36534253}
.stage{min-height:320px;align-self:stretch;display:flex;flex-direction:column;align-items:center;justify-content:space-around;gap:8px;padding:8px}
.mission{border:4px solid white;border-radius:25px;background:#fffef4f2;padding:13px 15px;font-size:clamp(17px,2.1vw,28px);line-height:1.35;font-weight:950;text-align:center;box-shadow:0 7px 15px #466b4b3d;width:100%}
.workbench{min-height:215px;width:100%;background:linear-gradient(180deg,#ffebb7fa,#ecc283f5);border:9px solid #d5a66b;border-bottom:22px solid #996a37;border-radius:25px;box-shadow:inset 0 5px 0 #fff5cf,0 15px 20px #53463165;display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:10px;padding:10px;position:relative}
.workbench .empty{font-weight:900;font-size:17px;color:#6c552d}
.fruit{width:clamp(60px,9vw,112px);height:clamp(60px,9vw,112px);object-fit:contain;filter:drop-shadow(0 7px 5px #734c3459);animation:arrive .3s ease-out}
.targets{display:flex;flex-direction:column;gap:9px;z-index:2}
.target{border:5px solid #fff9e2;border-radius:23px;background:#f4dfabed;box-shadow:0 10px 18px #4c573a72;min-height:105px;padding:9px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px;font-weight:950;font-size:clamp(13px,2vw,19px);color:#6d522e}
.target img{height:65px;max-width:105px;object-fit:contain;filter:drop-shadow(0 3px 3px #644b3470)}
.target.selected{outline:5px solid #72cf95}.target.good{background:#c4ffc9}
.label{border-radius:50px;background:#fffef0f1;padding:5px 13px;font-weight:950;font-size:clamp(13px,1.7vw,19px)}
.controls{max-width:1320px;margin:10px auto 0;padding:11px;background:#fffbeded;border:4px solid #fffff8;border-radius:24px;box-shadow:0 10px 22px #245c4d45;position:relative}
.status{border:3px solid #f4ce8d;background:#fff9e7;border-radius:15px;text-align:center;font-weight:900;color:#684a2d;padding:8px;min-height:43px}
.deck{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin:10px 0}
.item{width:clamp(93px,13vw,148px);min-height:112px;border:4px solid #fef9ec;border-radius:23px;background:linear-gradient(#fffdfa,#f2dcb3);box-shadow:0 6px 10px #6b4b3360;display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:14px;font-weight:950;color:#79512b;padding:6px;touch-action:none}
.item img{height:clamp(63px,9vw,97px);width:110px;max-width:100%;object-fit:contain;pointer-events:none;filter:drop-shadow(0 4px 3px #7252387f)}
.item.selected{border-color:#52b991;transform:translateY(-5px);box-shadow:0 7px 16px #40997892}
.item:disabled{opacity:.5}.toolrow{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
.toolrow button,.toolrow select{min-height:48px;border:3px solid #b3d9c6;background:#fff;border-radius:15px;padding:8px 13px;font-weight:850;color:#32664f}.toolrow button.go{background:#42a782;color:white;border-color:#399878}
.end{position:absolute;inset:0;z-index:7;display:flex;justify-content:center;align-items:center;background:#213a27ab;padding:15px}
.endcard{background:#fff9e9;border:7px solid #ffe0a0;border-radius:30px;max-width:500px;text-align:center;padding:24px;box-shadow:0 19px 35px #20332b8b}
.endcard h2{font-size:33px;color:#a96933}.endcard button{min-height:56px;padding:13px 23px;font-weight:950;border-radius:16px;color:#fff;background:#3da77a;border:0}
[hidden]{display:none!important}@keyframes arrive{from{transform:translateY(-16px) scale(.8);opacity:.2}to{transform:translateY(0) scale(1);opacity:1}}@keyframes hello{50%{transform:translateY(-6px)}}
@media(max-width:750px){.scene{grid-template-columns:100px minmax(0,1fr);padding:8px;gap:4px}.friend{grid-column:1;grid-row:1}.stage{grid-column:2;grid-row:1}.targets{grid-column:1/-1;grid-row:2;flex-direction:row}.target{min-height:88px;flex:1}.target img{height:48px}.scene{min-height:460px}.friend img{height:110px}.bubble{font-size:12px;padding:6px}.workbench{min-height:160px}.fruit{width:56px;height:56px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<header><a href="../index.html">🏡 마을</a><span class="name">🧺 수학 · 과일·채소 배달 대작전</span><a href="index.html?subject=math">🎮 수학 교실</a></header>
<main class="game"><div class="topline"><span class="hud" id="missionHud">🎯 미션 1/12</span><span class="hud">⭐ <strong id="score">0</strong></span><span class="hud" id="modeHud">🍀 선택·조작</span></div>
<div class="scene"><div class="friend"><div id="bubble" class="bubble">도와줄래?</div><img src="../art/stickers/rabbit.png" alt="배달을 부탁하는 토끼 친구"></div>
<div class="stage"><div class="mission" id="mission" aria-live="polite">오늘의 배달 미션을 준비해요.</div><div class="workbench" id="workbench" aria-label="선택한 물건이 놓이는 작업대"></div><div class="label" id="workLabel">바구니 0개</div></div><div class="targets" id="targets" aria-label="분류하거나 나누는 바구니"></div></div>
<div class="controls"><div id="status" class="status" role="status" aria-live="polite">시작 버튼을 누르면 배달이 시작돼요!</div><div class="deck" id="deck" aria-label="움직일 수 있는 재료"></div><div class="toolrow"><label for="support">활동 지원 </label><select id="support"><option value="explore">🌱 탐색(터치 자동 이동)</option><option value="guided">🍀 선택·조작</option><option value="independent">🌳 문제 해결</option></select><button id="speak" type="button">🔊 다시 듣기</button><button id="hint" type="button">💡 힌트</button><button id="restart" type="button">↻ 다시하기</button><button id="next" type="button" class="go" disabled>다음 미션 ➜</button></div>
<p style="font-size:12px;color:#667369;text-align:center">과일·채소를 터치하고 바구니를 선택하거나 직접 끌어 놓아 보세요. 탐색 모드에서는 한 번 터치하면 자동으로 옮겨집니다. 제한 시간이나 생명 감소는 없습니다.</p></div>
<div class="end" id="end" hidden><div class="endcard"><h2>🏅 배달 대성공!</h2><p id="endReport"></p><button id="again">12개 미션 다시 시작</button> <a href="index.html?subject=math">수학 교실로</a></div></div>
</main><script>
(function(){
'use strict';
const $=id=>document.getElementById(id),IMG={strawberry:'../art/stickers/strawberry.png',tomato:'../art/stickers/tomato.png',carrot:'../art/stickers/carrot.png',lettuce:'../art/stickers/lettuce.png',basket:'../art/stickers/basket.png'};
const names={strawberry:'딸기',tomato:'토마토',carrot:'당근',lettuce:'상추'};
const MISSIONS=[
 {kind:'collect',type:'strawberry',n:2,distractors:['carrot'],title:'딸기 두 개 배달'},
 {kind:'collect',type:'tomato',n:3,distractors:['lettuce'],title:'토마토 세 개 배달'},
 {kind:'collect',type:'carrot',n:4,distractors:['tomato','lettuce'],title:'당근 네 개 배달'},
 {kind:'collect',type:'strawberry',n:5,distractors:['carrot','tomato'],title:'딸기 다섯 개 배달'},
 {kind:'sort',types:['strawberry','carrot'],sequence:['strawberry','carrot','strawberry','carrot'],title:'딸기와 당근 분류'},
 {kind:'sort',types:['tomato','lettuce'],sequence:['lettuce','tomato','tomato','lettuce'],title:'토마토와 상추 분류'},
 {kind:'sort',types:['strawberry','tomato'],sequence:['tomato','strawberry','strawberry','tomato','strawberry','tomato'],title:'과일 여섯 개 분류'},
 {kind:'sort',types:['carrot','lettuce'],sequence:['lettuce','carrot','lettuce','carrot','carrot','lettuce'],title:'채소 여섯 개 분류'},
 {kind:'share',type:'tomato',count:4,baskets:2,title:'토마토 공평하게 나누기'},
 {kind:'share',type:'strawberry',count:6,baskets:3,title:'딸기 세 바구니에 나누기'},
 {kind:'share',type:'carrot',count:6,baskets:2,title:'당근 공평하게 나누기'},
 {kind:'share',type:'strawberry',count:9,baskets:3,title:'딸기 아홉 개 나누기'}
];
let mode='guided',stage=0,score=0,wrong=0,hints=0,selected=null,placed=[],binCounts=[],done=false,voice=true,pointerMoved=false,dragging=null;
try{const preset=JSON.parse(localStorage.getItem('oks_iep_config_v1')||'{}');if(['explore','guided','independent'].includes(preset.mode))mode=preset.mode;}catch(e){}
$('support').value=mode;
function say(s){if(!voice||!('speechSynthesis'in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(s);u.lang='ko-KR';u.rate=.84;speechSynthesis.speak(u);}catch(e){}}
function text(s){$('status').textContent=s;}
function im(type,cls='fruit'){const image=document.createElement('img');image.src=IMG[type];image.alt=names[type]||'바구니';image.className=cls;return image;}
function configureMission(){const m=MISSIONS[stage];if(m.kind==='collect')return names[m.type]+' '+m.n+'개를 바구니에 담아 보세요.';if(m.kind==='sort')return names[m.types[0]]+'와 '+names[m.types[1]]+'를 알맞은 바구니에 분류해 보세요.';return names[m.type]+' '+m.count+'개를 '+m.baskets+'개의 바구니에 똑같이 나누어 보세요.';}
function updateHud(){$('missionHud').textContent='🎯 미션 '+(stage+1)+'/12 · '+MISSIONS[stage].title;$('score').textContent=score;$('modeHud').textContent=mode==='explore'?'🌱 탐색':mode==='guided'?'🍀 선택·조작':'🌳 문제 해결';}
function createButton(type,label,fn){const b=document.createElement('button');b.className='item';b.type='button';b.append(im(type));const x=document.createElement('span');x.textContent=label;b.append(x);b.onclick=fn;return b;}
function basketButton(label,i){const b=document.createElement('button');b.type='button';b.className='target';b.dataset.bin=String(i);b.append(im('basket'));const x=document.createElement('span');x.textContent=label;b.append(x);b.addEventListener('click',()=>drop(i));b.addEventListener('dragover',e=>e.preventDefault());b.addEventListener('drop',e=>{e.preventDefault();drop(i)});return b;}
function makeDeck(list){const deck=$('deck');deck.replaceChildren();list.forEach((type,i)=>{const b=createButton(type,names[type],()=>choose(type,i));b.dataset.index=String(i);b.draggable=true;b.addEventListener('dragstart',e=>{selected={type,index:i};e.dataTransfer.setData('text/plain',type)});deck.append(b)});}
function render(){
 const m=MISSIONS[stage];done=false;selected=null;placed=[];wrong=0;hints=0;binCounts=Array(m.kind==='share'?m.baskets:m.kind==='sort'?2:1).fill(0);
 $('next').disabled=true;$('next').textContent=stage===11?'🏆 전체 마치기':'다음 미션 ➜';
 $('bubble').textContent=stage<4?'재료를 세어 줘!':stage<8?'분류를 도와줘!':'같이 나눠 보자!';
 $('mission').textContent=configureMission();$('workbench').replaceChildren();$('targets').replaceChildren();
 if(m.kind==='collect'){$('targets').append(basketButton('0 / '+m.n+'개',0));$('workLabel').textContent='배달 준비: 0 / '+m.n+'개';}
 if(m.kind==='sort'){m.types.forEach((type,i)=>$('targets').append(basketButton(names[type]+' 0개',i)));$('workLabel').textContent='0 / '+m.sequence.length+'개 분류';}
 if(m.kind==='share'){for(let i=0;i<m.baskets;i++)$('targets').append(basketButton((i+1)+'번: 0개',i));$('workLabel').textContent='나눌 재료: '+m.count+'개';}
 let seq=m.kind==='sort'?m.sequence.slice():m.kind==='share'?Array(m.count).fill(m.type):Array(m.n).fill(m.type);
 if(m.kind==='collect'&&mode!=='explore')seq=seq.concat(m.distractors.slice(0,mode==='guided'?1:2));
 makeDeck(seq);if(mode==='explore'&&m.kind==='sort')text('재료를 누르면 알맞은 바구니로 자동 이동해요.');else text('재료를 터치한 뒤 바구니를 골라요. 끌어 놓아도 됩니다.');
 updateHud();say(configureMission());
}
function targetFor(type){const m=MISSIONS[stage];return m.kind==='sort'?m.types.indexOf(type):0;}
function choose(type,index){if(done)return;const m=MISSIONS[stage];if(m.kind==='collect'&&type!==m.type){wrong++;text('주문서와 같은 재료를 찾아봐요.');return;}
 selected={type,index};$('deck').querySelectorAll('.item').forEach(b=>b.classList.toggle('selected',Number(b.dataset.index)===index));
 if(mode==='explore'){const i=m.kind==='share'?binCounts.indexOf(Math.min(...binCounts)):targetFor(type);drop(i);return;}
 text(names[type]+' 선택! 이제 바구니를 눌러 보세요.');
}
function drop(i){
 if(done||!selected)return;const m=MISSIONS[stage],type=selected.type;
 if(m.kind==='sort'&&m.types[i]!==type){wrong++;text('이 재료에 맞는 바구니를 찾아봐요.');return;}
 if(m.kind==='share'&&binCounts[i]>=m.count/m.baskets){wrong++;text('이 바구니에는 이미 충분히 담았어요. 다른 바구니를 골라요.');return;}
 const image=im(type);$('workbench').append(image);binCounts[i]++;placed.push(type);
 const btn=$('deck').querySelector('[data-index="'+selected.index+'"]');if(btn)btn.disabled=true;selected=null;
 const targets=$('targets').querySelectorAll('.target');targets.forEach((t,j)=>{const label=t.lastElementChild;if(m.kind==='sort')label.textContent=names[m.types[j]]+' '+binCounts[j]+'개';else if(m.kind==='share')label.textContent=(j+1)+'번: '+binCounts[j]+'개';else label.textContent=binCounts[j]+' / '+m.n+'개';});
 $('workLabel').textContent=m.kind==='collect'?'배달 준비: '+placed.length+' / '+m.n+'개':m.kind==='sort'?placed.length+' / '+m.sequence.length+'개 분류':'나눌 재료: '+(m.count-placed.length)+'개';
 let target=m.kind==='collect'?m.n:m.kind==='sort'?m.sequence.length:m.count;
 if(placed.length===target){done=true;score+=10;$('next').disabled=false;text('⭐ 성공! '+MISSIONS[stage].title+' 완료! 다음으로 이동해요.');say('잘했어요! 배달 성공!');targets.forEach(t=>t.classList.add('good'));storeProgress();}
 else{text('좋아요! '+(target-placed.length)+'개 더 남았어요.');}
}
function storeProgress(){
 try{const key='oks_math_fruit_quest_v1',old=JSON.parse(localStorage.getItem(key)||'{}');old.stages=Array.isArray(old.stages)?old.stages:[];if(!old.stages.includes(stage))old.stages.push(stage);old.updatedAt=new Date().toISOString();old.support=mode;old.lastScore=score;localStorage.setItem(key,JSON.stringify(old));if(stage===11){const k='oks_five_subjects_v1',s=JSON.parse(localStorage.getItem(k)||'{}');s['math-01']={completedAt:new Date().toISOString(),task:'과일·채소 배달 12개 단계',supportMode:mode,mistakes:wrong,helps:hints};localStorage.setItem(k,JSON.stringify(s));}}catch(e){}
}
$('next').onclick=()=>{if(!done)return;if(stage===11){$('end').hidden=false;$('endReport').textContent='직접 12개의 수량·분류·공평하게 나누기 미션을 완수했어요!';return;}stage++;render();};
$('support').onchange=function(){mode=this.value;render()};
$('speak').onclick=()=>say(configureMission());
$('hint').onclick=()=>{hints++;const m=MISSIONS[stage];const s=m.kind==='collect'?'부탁한 재료와 같은 그림을 찾아요.':m.kind==='sort'?'재료 이름과 바구니 이름을 연결해요.':'각 바구니에 하나씩 번갈아 담아 보아요.';text(s);say(s)};
$('restart').onclick=render;
$('again').onclick=()=>{stage=0;score=0;$('end').hidden=true;render()};
document.addEventListener('pointerup',e=>{if(!selected||!dragging)return;const t=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-bin]');if(t)drop(Number(t.dataset.bin));dragging=null});
$('deck').addEventListener('pointerdown',e=>{const item=e.target.closest('.item');if(item)dragging=item});
render();
})();
</script></body></html>
