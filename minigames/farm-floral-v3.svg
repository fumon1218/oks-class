<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 880" preserveAspectRatio="xMidYMid slice" aria-label="따뜻한 온실 장식">
<defs>
 <linearGradient id="branch" x2="0.6" y2="1"><stop stop-color="#a77b46"/><stop offset="1" stop-color="#5b3e27"/></linearGradient>
 <radialGradient id="leaf" cx=".26" cy=".25" r=".92"><stop stop-color="#e5f6a0"/><stop offset=".38" stop-color="#81c766"/><stop offset="1" stop-color="#2d7741"/></radialGradient>
 <radialGradient id="rose" cx=".28" cy=".24" r=".85"><stop stop-color="#fffbe1"/><stop offset=".55" stop-color="#f2b3cf"/><stop offset="1" stop-color="#dc729a"/></radialGradient>
 <radialGradient id="gold" cx=".25" cy=".24" r=".85"><stop stop-color="#fffbe7"/><stop offset=".52" stop-color="#ffe18c"/><stop offset="1" stop-color="#eaa44e"/></radialGradient>
 <linearGradient id="wood" x2="0" y2="1"><stop stop-color="#ecc18a"/><stop offset=".48" stop-color="#ab7445"/><stop offset="1" stop-color="#6b412a"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#fff8c4" stop-opacity=".95"/><stop offset="1" stop-color="#fff0cb" stop-opacity="0"/></radialGradient>
 <symbol id="fol" overflow="visible"><ellipse rx="17" ry="31" fill="url(#leaf)" transform="rotate(-27)"/><ellipse rx="17" ry="31" fill="url(#leaf)" transform="rotate(29) translate(16,-4)"/><ellipse rx="15" ry="27" fill="url(#leaf)" transform="rotate(3) translate(0,-9)"/></symbol>
 <symbol id="flower" overflow="visible"><circle cx="-12" r="13" fill="url(#rose)"/><circle cx="11" r="14" fill="url(#rose)"/><circle cy="-12" r="14" fill="url(#rose)"/><circle cy="11" r="14" fill="url(#rose)"/><circle r="9" fill="url(#gold)"/></symbol>
 <symbol id="daisy" overflow="visible"><g fill="#fffdf2"><ellipse cy="-15" rx="5" ry="13"/><ellipse cy="15" rx="5" ry="13"/><ellipse cx="-15" rx="13" ry="5"/><ellipse cx="15" rx="13" ry="5"/><ellipse transform="rotate(45)" cy="-15" rx="5" ry="13"/><ellipse transform="rotate(45)" cy="15" rx="5" ry="13"/><ellipse transform="rotate(-45)" cy="-15" rx="5" ry="13"/><ellipse transform="rotate(-45)" cy="15" rx="5" ry="13"/></g><circle r="8" fill="#f9bd4b"/></symbol>
 <filter id="blur"><feGaussianBlur stdDeviation="11"/></filter>
 <filter id="shadow"><feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#42562e" flood-opacity=".37"/></filter>
</defs>
<!-- Sunlight and wooden greenhouse details -->
<ellipse cx="380" cy="125" rx="280" ry="190" fill="url(#glow)" opacity=".8"/>
<ellipse cx="1240" cy="105" rx="300" ry="250" fill="url(#glow)" opacity=".7"/>
<g opacity=".88" filter="url(#shadow)">
 <rect x="0" y="0" width="1536" height="21" fill="url(#wood)"/>
 <path d="M0 145 Q260 18 520 100 Q800 -16 1100 105 Q1350 28 1536 124" stroke="url(#wood)" stroke-width="22" fill="none"/>
 <path d="M0 173 Q290 35 540 122 Q780 29 1112 134 Q1300 60 1536 142" stroke="#f7d3a1" stroke-width="6" fill="none"/>
</g>
<!-- leafy garlands with flowers at top, dense but peripheral -->
<g transform="translate(80 43)" filter="url(#shadow)">
 <path d="M-150 -45 C200 40 390 0 630 -25" stroke="#4e733b" stroke-width="12" fill="none"/>
 <use href="#fol" x="5" y="18" transform="rotate(-37 5 18)"/><use href="#fol" x="95" y="48"/><use href="#fol" x="178" y="36" transform="rotate(56 178 36)"/><use href="#fol" x="255" y="38"/><use href="#fol" x="339" y="33" transform="rotate(20 339 33)"/><use href="#fol" x="444" y="19"/><use href="#fol" x="526" y="4"/>
 <use href="#flower" x="60" y="45"/><use href="#flower" x="206" y="42" transform="scale(.85)"/><use href="#daisy" x="360" y="54"/><use href="#flower" x="505" y="24"/>
</g>
<g transform="translate(1020 25)" filter="url(#shadow)">
 <path d="M-85 10 Q200 67 610 -43" stroke="#547d40" stroke-width="12" fill="none"/>
 <use href="#fol" x="6" y="34"/><use href="#fol" x="100" y="51"/><use href="#fol" x="198" y="49"/><use href="#fol" x="297" y="23"/><use href="#fol" x="390" y="4"/>
 <use href="#daisy" x="80" y="60"/><use href="#flower" x="224" y="49"/><use href="#daisy" x="342" y="22"/>
</g>
<!-- wooden potting shelves on perimeter; central field kept clear -->
<g transform="translate(5 260)" filter="url(#shadow)">
 <rect x="0" y="75" width="110" height="19" rx="8" fill="url(#wood)"/>
 <path d="M18 75 L9 -10 L87 -10 L75 75Z" fill="#bc8253" stroke="#80552f" stroke-width="5"/>
 <g transform="translate(45 -14)"><use href="#fol" x="-20" y="-27"/><use href="#fol" x="22" y="-30" transform="scale(.8)"/><use href="#daisy" x="-18" y="-52" transform="scale(.6)"/><use href="#flower" x="16" y="-53" transform="scale(.65)"/></g>
</g>
<g transform="translate(1460 270)" filter="url(#shadow)">
 <rect x="0" y="80" width="110" height="19" rx="8" fill="url(#wood)"/>
 <path d="M14 80 L5 -5 L85 -5 L72 80Z" fill="#c18a56" stroke="#80552f" stroke-width="5"/>
 <g transform="translate(42 -18)"><use href="#fol" x="-20" y="-27"/><use href="#fol" x="22" y="-30" transform="scale(.8)"/><use href="#flower" x="-18" y="-52" transform="scale(.65)"/><use href="#daisy" x="20" y="-57" transform="scale(.6)"/></g>
</g>
<!-- edge beds: more flowers, garden greenery framing the gameplay -->
<g filter="url(#shadow)" opacity=".94">
 <path d="M0 592 Q95 515 202 570 L163 675 L0 710Z" fill="#559b46"/>
 <path d="M1536 550 Q1440 505 1340 585 L1400 696 L1536 706Z" fill="#4c9951"/>
 <g transform="translate(20 610)"><use href="#fol" x="-15" y="-21" transform="scale(2)"/><use href="#fol" x="52" y="-20" transform="scale(1.5)"/><use href="#flower" x="13" y="-45"/><use href="#daisy" x="66" y="-6"/><use href="#flower" x="104" y="-40"/></g>
 <g transform="translate(1421 611)"><use href="#fol" x="-16" y="-25" transform="scale(1.8)"/><use href="#fol" x="70" y="-24" transform="scale(2)"/><use href="#flower" x="13" y="-47"/><use href="#daisy" x="66" y="-6"/><use href="#flower" x="102" y="-41"/></g>
</g>
<!-- warm visible tabletop and flowers at foreground corners -->
<path d="M0 808 Q790 761 1536 808 L1536 880 L0 880Z" fill="url(#wood)" stroke="#d6a56d" stroke-width="12"/>
<path d="M0 824 Q790 782 1536 824" stroke="#ffcf91" stroke-width="8" fill="none" opacity=".85"/>
<g transform="translate(85 790)"><use href="#flower" x="-25" y="-8" transform="scale(1.2)"/><use href="#daisy" x="35" y="-31"/><use href="#fol" x="0" y="-20"/></g>
<g transform="translate(1380 805)"><use href="#flower" x="-23" y="-11"/><use href="#daisy" x="38" y="-33"/><use href="#fol" x="0" y="-18"/></g>
</svg>