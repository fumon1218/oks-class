<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover">
<title>옥쌤의 즐거운 교실 · ok's class</title>
<meta name="description" content="특수교육대상학생을 위한 미술 학습 앱 - 색깔·모양·크기를 연결하기, 칠하기, 모자이크로 배워요.">
<meta name="theme-color" content="#FF6F59">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ok's class">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&display=swap">
<style>
html,body{margin:0;padding:0;height:100%;}
body{
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root{
  --bg:#F5F7FA;
  --surface:#FFFFFF;
  --surface-2:#EEF2F7;
  --ink:#2B2E4A;
  --ink-soft:#5B5F82;
  --accent:#FF6F59;
  --accent-ink:#FFFFFF;
  --accent-2:#3AAFA9;
  --accent-2-ink:#FFFFFF;
  --line:#E3E8EF;
  --ok:#2ecc71;
  --shadow:0 10px 24px rgba(43,46,74,.10);
  --radius-lg:28px;
  --radius-md:20px;
  --radius-sm:14px;
  --surface-glass:rgba(255,255,255,.86);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1B1D2A;
    --surface:#242739;
    --surface-2:#2C2F45;
    --ink:#EDEFF7;
    --ink-soft:#B7BAD6;
    --accent:#FF8A75;
    --accent-ink:#1B1D2A;
    --accent-2:#5FD1CA;
    --accent-2-ink:#0E2C2A;
    --line:#383B54;
    --ok:#4ade80;
    --shadow:0 10px 24px rgba(0,0,0,.35);
    --surface-glass:rgba(27,29,42,.82);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1B1D2A;
  --surface:#242739;
  --surface-2:#2C2F45;
  --ink:#EDEFF7;
  --ink-soft:#B7BAD6;
  --accent:#FF8A75;
  --accent-ink:#1B1D2A;
  --accent-2:#5FD1CA;
  --accent-2-ink:#0E2C2A;
  --line:#383B54;
  --ok:#4ade80;
  --shadow:0 10px 24px rgba(0,0,0,.35);
  --surface-glass:rgba(27,29,42,.82);
  color-scheme:dark;
}

*{box-sizing:border-box;}
body{background:var(--bg);color:var(--ink);}
body{
  background-size:cover;
  background-position:center 30%;
  background-repeat:no-repeat;
  background-attachment:fixed;
  transition:background-image .25s ease;
}
#app{
  font-family:'Gowun Dodum','Noto Sans KR',system-ui,sans-serif;
  max-width:760px;
  margin:0 auto;
  padding-inline:16px;
  padding-block:12px 40px;
  min-height:100%;
}
body.is-world #app{max-width:none;padding-inline:0;}
body.is-world .hero-title{padding-inline:16px;}
.scene-panel{
  background:var(--surface-glass);
  backdrop-filter:blur(6px) saturate(1.1);
  -webkit-backdrop-filter:blur(6px) saturate(1.1);
  border-radius:var(--radius-lg);
  padding:6px 10px 18px;
  box-shadow:var(--shadow);
}
h1,h2,h3{font-family:'Gaegu','Gowun Dodum',sans-serif;text-wrap:balance;margin:0;}
#app svg{max-width:100%;height:auto;display:block;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent-2);outline-offset:3px;}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important;}}

/* ---------- top bars (지도 HUD와 같은 유리 pill 스타일로 통일) ---------- */
.glass-pill{
  background:rgba(255,255,255,.94);
  border-radius:999px;
  box-shadow:0 4px 12px rgba(43,46,74,.2);
}
.brandbar{
  display:flex;align-items:center;gap:10px;
  padding-block:6px;
}
.brand{
  display:flex;align-items:center;gap:8px;
  font-size:17px;font-weight:800;color:var(--ink);
  background:rgba(255,255,255,.94);
  border-radius:999px;
  padding:6px 16px 6px 6px;
  box-shadow:0 4px 12px rgba(43,46,74,.2);
}
.brand:active{transform:scale(.97);}
.brand svg{width:28px;height:28px;flex:none;}
.spacer{flex:1;}
.gear{
  display:flex;align-items:center;gap:6px;
  font-size:13.5px;font-weight:800;color:var(--ink);
  background:rgba(255,255,255,.94);border:none;
  border-radius:999px;padding:9px 15px;
  box-shadow:0 4px 12px rgba(43,46,74,.2);
}
.gear svg{width:18px;height:18px;color:var(--ink-soft);}

.subheader{
  display:flex;align-items:center;gap:10px;
  margin-top:6px;margin-bottom:16px;
  min-height:44px;
}
.back{
  display:flex;align-items:center;gap:4px;
  font-size:14.5px;font-weight:800;color:var(--ink);
  background:rgba(255,255,255,.94);border:none;
  border-radius:999px;padding:9px 15px 9px 11px;flex:none;
  box-shadow:0 4px 12px rgba(43,46,74,.2);
}
.back svg{width:18px;height:18px;flex:none;color:var(--ink-soft);}
.subheader h2{
  font-size:18px;flex:none;margin:0 auto;color:var(--ink);
  background:rgba(255,255,255,.94);
  padding:9px 20px;border-radius:999px;
  box-shadow:0 4px 12px rgba(43,46,74,.2);
}
.dots{
  display:flex;gap:6px;flex:none;align-items:center;
  background:rgba(255,255,255,.9);padding:0 12px;height:38px;
  border-radius:999px;box-shadow:0 4px 12px rgba(43,46,74,.16);
}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line);}
.dot.done{background:var(--ok);}
.dot.current{background:var(--accent);transform:scale(1.3);}

/* ---------- home ---------- */
.hero{
  text-align:center;padding:18px 8px 6px;
}
.hero h1{font-size:34px;color:var(--accent);}
.hero p{margin:6px 0 0;color:var(--ink-soft);font-size:17px;}

.grid-cards{
  display:flex;flex-direction:column;gap:14px;margin-top:18px;
}
.subject-card{
  background:rgba(255,255,255,.94);border-radius:24px;
  box-shadow:0 6px 16px rgba(43,46,74,.18);padding:14px 16px 14px 14px;
  display:flex;flex-direction:row;align-items:center;gap:16px;
  text-align:left;position:relative;overflow:hidden;
  border:2px solid transparent;
  transition:transform .15s ease;
}
.subject-card:active{transform:scale(.97);}
.subject-card::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:7px;
  background:var(--card-accent,var(--accent-2));
}
.subject-card .icon-wrap{
  width:76px;height:76px;border-radius:50%;flex:none;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 0 5px var(--card-glow,rgba(58,175,169,.2)),
    0 4px 10px rgba(43,46,74,.16), inset 0 2px 5px rgba(255,255,255,.7);
}
.subject-card .icon-wrap svg{width:48px;height:48px;}
.subject-card .icon-wrap img{width:60px;height:60px;object-fit:contain;}
.subject-card .card-txt{flex:1;min-width:0;}
.subject-card .card-txt span{font-size:19px;font-weight:800;display:block;}
.subject-card .card-txt small{color:var(--ink-soft);font-size:13.5px;display:block;margin-top:2px;}
.subject-card .card-badge{
  flex:none;display:flex;flex-direction:column;align-items:center;gap:3px;
}
.subject-card .card-badge .badge-pct{
  width:40px;height:40px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:800;color:var(--ink);
  background:var(--surface-2);
  box-shadow:0 2px 6px rgba(43,46,74,.14);
}
.subject-card .card-badge.done .badge-pct{background:var(--ok);color:#fff;}
.subject-card .card-arrow{flex:none;color:var(--ink-soft);opacity:.55;}
.subject-card .card-arrow svg{width:16px;height:16px;}
.subject-card.soon{opacity:.55;}
.subject-card.soon .icon-wrap{background:var(--surface-2) !important;}
.mini-stars-row{display:flex;gap:2px;}
.mini-stars-row svg{width:12px;height:12px;}
.mini-stars{margin-top:-4px;}

/* ---------- mascot ---------- */
.mascot-row{
  display:flex;align-items:flex-end;gap:12px;
  margin:10px 0 4px;
}
.mascot-avatar{width:88px;height:104px;flex:none;display:flex;align-items:flex-end;justify-content:center;}
.mascot-avatar svg{width:100%;height:100%;}
.mascot-avatar img{width:100%;height:100%;object-fit:contain;object-position:bottom;filter:drop-shadow(0 6px 8px rgba(43,46,74,.18));}
.pose-cheer{animation:mascot-bounce 1.1s ease infinite;}
@keyframes mascot-bounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
.speech-bubble{
  position:relative;
  background:rgba(255,255,255,.94);border:none;
  border-radius:16px;padding:10px 14px;
  font-size:15px;font-weight:700;color:var(--ink);
  box-shadow:0 6px 16px rgba(43,46,74,.18);
  margin-bottom:10px;
}
.speech-bubble::after{
  content:'';position:absolute;left:-6px;bottom:14px;
  width:14px;height:14px;background:rgba(255,255,255,.94);
  transform:rotate(45deg);
}
.celebrate-card .mascot-row{justify-content:center;margin-top:0;}
.celebrate-card .mascot-avatar{width:110px;height:130px;}

/* ---------- world hero (마을 그림, 정글 점프 로비 느낌의 HUD) ---------- */
.hero-title{padding-top:14px;padding-bottom:2px;text-align:center;max-width:1000px;margin-inline:auto;}
.hero-title h1{font-size:26px;color:var(--accent);}
.hero-title p{margin:4px 0 0;color:var(--ink-soft);font-size:15px;}

.world-hero{
  position:relative;
  margin:10px auto 0;
  width:100%;
  max-width:1000px;
  aspect-ratio:1000/666;
  overflow:hidden;
  background-size:cover;
  background-position:center;
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.4);
}
@media (min-width:761px){ .world-hero{border-radius:26px;} }

.hud-row{position:absolute;left:0;right:0;display:flex;z-index:5;padding:10px 12px;pointer-events:none;}
.hud-row>*{pointer-events:auto;}
.hud-top{top:0;justify-content:space-between;align-items:flex-start;gap:6px;flex-wrap:wrap;}
.hud-profile{
  display:flex;align-items:center;gap:8px;
  background:rgba(255,255,255,.92);border-radius:999px;
  padding:5px 14px 5px 5px;box-shadow:0 4px 12px rgba(0,0,0,.25);
}
.hud-avatar{
  width:32px;height:32px;border-radius:50%;
  background:linear-gradient(160deg,#FFD8CC,#FFB199);
  display:flex;align-items:center;justify-content:center;font-size:18px;flex:none;
}
.hud-profile-text{display:flex;flex-direction:column;gap:2px;min-width:84px;}
.hud-profile-name{font-size:11.5px;font-weight:700;color:#2B2E4A;}
.hud-bar{width:84px;height:6px;border-radius:999px;background:#E3E8EF;overflow:hidden;}
.hud-bar-fill{height:100%;background:linear-gradient(90deg,#7EE070,#3AAFA9);border-radius:999px;}
.hud-stats{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
.hud-pill{
  background:rgba(255,255,255,.92);border-radius:999px;
  padding:6px 12px;font-size:12.5px;font-weight:800;color:#2B2E4A;
  box-shadow:0 4px 12px rgba(0,0,0,.25);white-space:nowrap;
}

.season-pill{
  display:flex;align-items:center;gap:6px;
  background:rgba(255,255,255,.94);border:none;
  border-radius:999px;padding:6px 13px;
  font-size:12px;font-weight:700;color:var(--ink);
  box-shadow:0 4px 12px rgba(0,0,0,.22);
  white-space:nowrap;
  order:2;margin:0 auto;
}
.season-pill svg{width:14px;height:14px;color:var(--ink-soft);flex:none;}
.season-pill:active svg{transform:rotate(50deg);}
.hud-profile{order:1;}
.hud-stats{order:3;}

.map-spot{
  position:absolute;transform:translate(-50%,-50%);
  display:flex;flex-direction:column;align-items:center;gap:2px;
  width:16%;z-index:3;
  padding:0;
}
.map-spot-label{
  font-size:11px;font-weight:700;color:var(--ink);
  background:var(--surface);padding:2px 7px;border-radius:999px;
  box-shadow:var(--shadow);white-space:nowrap;
  transform:translateY(2.4em);
}
.map-spot.active::before{
  content:'';position:absolute;left:50%;top:50%;
  width:64%;aspect-ratio:1/1;
  transform:translate(-50%,-50%);
  border-radius:50%;
  box-shadow:0 0 0 3px rgba(255,255,255,.9), 0 0 0 6px rgba(255,111,89,.55);
  animation:spot-pulse 1.8s ease-in-out infinite;
  pointer-events:none;
}
@keyframes spot-pulse{0%,100%{opacity:.55;transform:translate(-50%,-50%) scale(.94);}50%{opacity:1;transform:translate(-50%,-50%) scale(1.05);}}
.map-spot.soon .map-spot-label{color:var(--ink-soft);}
.map-spot.label-above .map-spot-label{transform:translateY(-3.1em);}
.map-spot.label-above .spot-lock{top:auto;bottom:8%;}
.spot-lock{
  position:absolute;left:50%;top:8%;transform:translate(-50%,-50%);
  font-size:14px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35));
}

.map-avatar{
  position:absolute;z-index:4;height:15%;
  transform:translate(-50%,-88%);
  transition:left .65s cubic-bezier(.4,0,.2,1), top .65s cubic-bezier(.4,0,.2,1);
  pointer-events:none;
}
.map-avatar.dragging{transition:none;}
.map-avatar img{
  height:100%;width:auto;display:block;
  filter:drop-shadow(0 5px 5px rgba(0,0,0,.32));
}
.map-avatar.walking img{animation:avatar-bob .28s ease-in-out infinite;}
@keyframes avatar-bob{0%,100%{margin-top:0;}50%{margin-top:-5px;}}

.joy-zone{position:absolute;inset:0;z-index:2;touch-action:none;}
.joystick{
  position:absolute;width:92px;height:92px;margin:-46px 0 0 -46px;
  border-radius:50%;background:rgba(255,255,255,.22);
  border:3px solid rgba(255,255,255,.6);
  z-index:8;opacity:0;pointer-events:none;transition:opacity .12s;
}
.joystick.on{opacity:1;}
.joy-knob{
  position:absolute;left:50%;top:50%;width:40px;height:40px;
  margin:-20px 0 0 -20px;border-radius:50%;
  background:rgba(255,255,255,.9);box-shadow:0 3px 8px rgba(0,0,0,.3);
}

.hud-mascot{position:absolute;left:10px;bottom:10px;z-index:5;max-width:62%;pointer-events:none;}
.hud-mascot-inner{margin:0;}
.hud-mascot-inner .speech-bubble{font-size:12.5px;padding:8px 12px;}
.hud-mascot-inner .mascot-avatar{width:56px;height:66px;}

.hud-quest{
  position:absolute;right:8px;bottom:8px;z-index:5;
  background:rgba(255,255,255,.95);border-radius:14px;
  padding:6px 10px;box-shadow:0 6px 16px rgba(0,0,0,.22);
  min-width:132px;pointer-events:none;
}
.hud-quest-head{font-size:10.5px;font-weight:800;color:var(--ink);margin-bottom:2px;}
.hud-quest-row{display:flex;align-items:center;gap:4px;font-size:10.5px;color:var(--ink-soft);padding:1px 0;}
.hud-quest-row.done{color:var(--ink);}
.hud-quest-name{flex:1;}
.hud-quest-count{font-weight:700;}

.hud-navbar{
  display:flex;justify-content:center;gap:16px;
  padding:14px 16px 6px;
  max-width:1000px;margin-inline:auto;
}
.navcircle{
  display:flex;flex-direction:column;align-items:center;gap:2px;
  font-size:11px;font-weight:700;color:var(--ink-soft);
}
.navcircle span{
  width:52px;height:52px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:22px;background:var(--surface);box-shadow:var(--shadow);
  border:3px solid transparent;
}
.navcircle.active span{border-color:var(--accent);}
.navcircle.active{color:var(--ink);}

/* ---------- level path ---------- */
.path-board{padding:24px 18px 30px;}
.path-track{display:flex;flex-direction:column;align-items:center;}
.path-node-wrap{display:flex;flex-direction:column;align-items:center;gap:6px;}
.path-node-wrap.shift{transform:translateX(-54px);}
.path-connector{width:4px;height:34px;background:repeating-linear-gradient(var(--line) 0 6px, transparent 6px 12px);}
.path-node{
  width:88px;height:88px;border-radius:50%;
  background:rgba(255,255,255,.94);box-shadow:0 6px 16px rgba(43,46,74,.18);
  border:4px solid var(--accent-2);
  display:flex;align-items:center;justify-content:center;padding:16px;
}
.path-node.locked{border-color:var(--line);opacity:.6;}
.path-node img.stk{width:100%;height:100%;object-fit:contain;}
.path-node-label{
  font-size:14px;font-weight:800;color:var(--ink);
  background:rgba(255,255,255,.94);padding:4px 12px;border-radius:999px;
  box-shadow:0 4px 10px rgba(43,46,74,.16);
}
.path-node-stars{
  display:flex;gap:2px;
  background:rgba(255,255,255,.9);padding:3px 8px;border-radius:999px;
  box-shadow:0 3px 8px rgba(43,46,74,.14);
}
.star-mini svg{width:16px;height:16px;}

/* ---------- method menu (legacy, unused styles kept harmless) ---------- */
.method-list{display:flex;flex-direction:column;gap:14px;margin-top:8px;}
.method-card{
  background:var(--surface);border-radius:var(--radius-md);
  box-shadow:var(--shadow);padding:18px;
  display:flex;align-items:center;gap:16px;text-align:left;
  width:100%;
}
.method-card .icon-wrap{
  width:64px;height:64px;border-radius:18px;flex:none;
  display:flex;align-items:center;justify-content:center;background:var(--surface-2);
}
.method-card .icon-wrap svg{width:38px;height:38px;}
.method-card .txt strong{display:block;font-size:19px;}
.method-card .txt span{display:block;color:var(--ink-soft);font-size:14.5px;margin-top:3px;}

/* ---------- activity shell ---------- */
.instruction{
  background:rgba(255,255,255,.94);border-radius:var(--radius-md);
  box-shadow:0 6px 16px rgba(43,46,74,.18);
  padding:16px 18px;
  display:flex;align-items:center;gap:12px;
  margin-bottom:16px;
}
.instruction p{font-size:19px;font-weight:700;flex:1;}
.replay-btn{
  flex:none;width:44px;height:44px;border-radius:50%;
  background:var(--accent-2);color:var(--accent-2-ink);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 10px rgba(43,46,74,.2);
}
.replay-btn svg{width:22px;height:22px;}
.help-btn{
  flex:none;height:44px;padding:0 10px 0 8px;border-radius:999px;
  background:#FFF4D6;color:#8A6200;display:flex;align-items:center;gap:3px;
  box-shadow:0 4px 10px rgba(43,46,74,.14);
}
.help-btn span{font-size:20px;line-height:1;}
.help-btn small{font-size:13px;font-weight:800;}
/* 오늘의 수업 */
.lesson-banner{
  width:100%;display:flex;align-items:center;gap:12px;margin-bottom:14px;
  background:linear-gradient(135deg,#FFF1C9,#FFE0D6);border-radius:20px;padding:14px 16px;
  box-shadow:0 6px 16px rgba(43,46,74,.16);text-align:left;
}
.lb-ico{font-size:32px;line-height:1;}
.lb-txt{flex:1;display:flex;flex-direction:column;}
.lb-txt b{font-size:19px;}
.lb-txt small{font-size:13px;color:var(--ink-soft);font-weight:600;}
.unit-head{background:rgba(255,255,255,.94);border-radius:18px;padding:14px 18px;margin-bottom:12px;
  box-shadow:0 6px 16px rgba(43,46,74,.14);display:flex;flex-direction:column;}
.unit-head b{font-size:19px;} .unit-head small{font-size:13px;color:var(--ink-soft);font-weight:600;}
.lesson-list{display:flex;flex-direction:column;gap:10px;}
.lesson-card{
  display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.95);border-radius:18px;
  padding:12px 14px;box-shadow:0 4px 12px rgba(43,46,74,.14);text-align:left;
}
.lesson-card.done{background:rgba(240,251,245,.96);}
.ll-no{flex:none;width:54px;height:54px;border-radius:16px;background:var(--accent);color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:22px;font-weight:900;line-height:1;}
.ll-no small{font-size:11px;font-weight:700;margin-top:2px;}
.lesson-card.done .ll-no{background:var(--ok);}

function hexToRgba(hex,alpha){
  const h=hex.replace('#','');

  return `rgba(${r},${g},${b},${alpha})`;

function loadGallery(){
  try{ return JSON.parse(localStorage.getItem('oks-class-gallery-v1')||'[]'); }catch(e){ return []; }
}
function saveGallery(list){ try{ localStorage.setItem('oks-class-gallery-v1', JSON.stringify(list)); }catch(e){} }
function addToGallery(dataUrl,theme){
  const list=loadGallery();
  list.unshift({id:'art'+Date.now()+Math.floor(Math.random()*1000), dataUrl, theme:theme||'내 작품', liked:false, createdAt:Date.now()});
  if(list.length>24) list.length=24; // 저장 공간을 고려해 최근 24개까지만 보관
  saveGallery(list);
}
function toggleGalleryLike(id){
  const list=loadGallery();
  const item=list.find(i=>i.id===id);
  if(item){ item.liked=!item.liked; saveGallery(list); }
}

/* ---------- progress (stars + unlocks) ---------- */
function defaultProgress(){
  const p={};
  SUBJECT_ORDER.forEach(subj=>{
    p[subj]={};
    methodOrderFor(subj).forEach((m,i)=>{ p[subj][m]={stars:0, unlocked:i===0}; });
  });
  return p;
}
let progress=defaultProgress();
try{
  const saved=JSON.parse(localStorage.getItem('oks-class-progress-v1')||'null');
  if(saved){
    SUBJECT_ORDER.forEach(subj=>{
      methodOrderFor(subj).forEach((m,i)=>{
        if(saved[subj] && saved[subj][m]){
          progress[subj][m].stars=saved[subj][m].stars||0;
          progress[subj][m].unlocked = i===0 ? true : !!saved[subj][m].unlocked;
        }
      });
    });
  }
  /* 활동 순서가 바뀌거나 새 활동이 끼어들어도, 이미 별을 받은 활동의 다음 단계는 열어 둔다 */
  SUBJECT_ORDER.forEach(subj=>{
    const order=methodOrderFor(subj);
    order.forEach((m,i)=>{
      if(progress[subj][m].stars>0 && order[i+1]) progress[subj][order[i+1]].unlocked=true;
    });
  });
}catch(e){}
function saveProgress(){try{localStorage.setItem('oks-class-progress-v1',JSON.stringify(progress));}catch(e){}}
function starsFor(subject,method){ return (progress[subject] && progress[subject][method]) ? progress[subject][method].stars : 0; }
function isUnlocked(subject,method){ return (progress[subject] && progress[subject][method]) ? progress[subject][method].unlocked : false; }
function totalStarsEarned(){
  let n=0;
  SUBJECT_ORDER.forEach(s=>methodOrderFor(s).forEach(m=>n+=starsFor(s,m)));
  return n;
}
function totalStarsPossible(){ return SUBJECT_ORDER.reduce((sum,s)=>sum+methodOrderFor(s).length*3,0); }
function completedActivityCount(){
  let n=0;
  SUBJECT_ORDER.forEach(s=>methodOrderFor(s).forEach(m=>{ if(starsFor(s,m)>0) n++; }));
  return n;
}
function totalActivityCount(){ return SUBJECT_ORDER.reduce((sum,s)=>sum+methodOrderFor(s).length,0); }
function explorerLevel(){ return 1+Math.floor(totalStarsEarned()/6); } // 별 6개마다 레벨업
function recordResult(subject,method,stars){
  const order=methodOrderFor(subject);
  const idx=order.indexOf(method);
  progress[subject][method].stars=Math.max(progress[subject][method].stars, stars);
  const next=order[idx+1];
  if(next && stars>=1) progress[subject][next].unlocked=true;
  saveProgress();
}

/* ---------- audio ---------- */
let actx=null;
function getCtx(){
  if(!actx){
    try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){actx=null;}
  }
  return actx;
}
function tone(freq,start,dur,type,gainPeak){
  const ctx=getCtx(); if(!ctx) return;
  const osc=ctx.createOscillator();
  const gain=ctx.createGain();
  osc.type=type||'sine';
  osc.frequency.value=freq;
  const t0=ctx.currentTime+start;
  gain.gain.setValueAtTime(0,t0);
  gain.gain.linearRampToValueAtTime(gainPeak||0.18,t0+0.02);
  gain.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  osc.connect(gain).connect(ctx.destination);
  osc.start(t0);osc.stop(t0+dur+0.05);
}
function playSuccess(){
  if(!settings.sound) return;
  tone(523.25,0,0.22,'sine');
  tone(659.25,0.12,0.22,'sine');
  tone(783.99,0.24,0.32,'sine');
}
function playRetry(){
  if(!settings.sound) return;

}
function playBigWin(){
  if(!settings.sound) return;
  [523.25,587.33,659.25,783.99,880].forEach((f,i)=>tone(f,i*0.11,0.28,'sine'));
}

/* ---------- speech ---------- */
function speak(text){
  if(!settings.voice) return;
  try{
    if(!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='ko-KR';
    u.rate=0.92;
    u.pitch=1.05;
    const voices=window.speechSynthesis.getVoices();
    const kv=voices.find(v=>v.lang&&v.lang.startsWith('ko'));
    if(kv) u.voice=kv;
    window.speechSynthesis.speak(u);
  }catch(e){}
}

  const seasons=Object.keys(ART.worldSeasons);
  let saved=null;
  try{ saved=JSON.parse(localStorage.getItem('oks_world_season')||'null'); }catch(e){}
  if(saved && saved.day===todayKey() && seasons.includes(saved.season)) return saved.season;
  const pool=seasons.filter(s=>!saved || s!==saved.season);
  const season=pool[Math.floor(Math.random()*pool.length)];

  return season;

  saveWorldSeason(season);
  return season;
}

function scheduleTiles(L,cur){
  const tiles=L.steps.map(([s,m],i)=>{
    const st = cur==null ? '' : i<cur ? 'done' : i===cur ? 'now' : '';
    return `<div class="sch-tile ${st}"><span class="sch-no">${i<(cur??-1)?'✓':i+1}</span><span class="sch-icon">${methodIcon(m)}</span><span class="sch-label">${stepLabel(s,m)}</span></div>`;
  });
  tiles.push(`<div class="sch-tile end"><span class="sch-no">★</span><span class="sch-icon sch-flag">🏁</span><span class="sch-label">정리</span></div>`);
  return tiles.join('<span class="sch-arrow">›</span>');
}

function startLesson(id,fresh){
  if(fresh || !lessonCtx || lessonCtx.id!==id || lessonCtx.step>=lessonById(id).steps.length){
    lessonCtx={id, step:0, results:[], feeling:null, startedAt:Date.now()};
  }
  startLessonStep(true);
}
function startLessonStep(first){
  const L=lessonById(lessonCtx.id);
  const [subj,m]=L.steps[lessonCtx.step];
  route.view='activity'; route.room='arts'; route.subject=subj; route.method=m; route.lesson=L.id;
  runtime=null;
  render();
  setTimeout(()=>{
    if(route.view!=='activity') return;
    speak((first?'':`다음은 ${stepLabel(subj,m)}! `)+activityInstructionText());
  },300);
}
function lessonAdvance(stars){
  const L=lessonById(lessonCtx.id);
  const [subj,m]=L.steps[lessonCtx.step];
  lessonCtx.results[lessonCtx.step]={subject:subj, method:m, stars};
  lessonCtx.step++;
  runtime=null;
  if(lessonCtx.step>=L.steps.length){
    route.view='lessonOutro'; route.lesson=L.id;
    render();
    speak('오늘 수업을 모두 마쳤어요! 오늘 수업은 어땠나요?');
  } else startLessonStep(false);
}
function saveLessonFeeling(key){
  const L=lessonById(lessonCtx.id);
  const first=!lessonCtx.feeling;
  lessonCtx.feeling=key;
  try{
    const log=loadLessonLog();
    const entry={id:L.id, no:L.no, at:Date.now(), level:settings.level, feeling:key,
      results:lessonCtx.results, min:Math.round((Date.now()-lessonCtx.startedAt)/60000)};
    if(!first && log.length && log[log.length-1].id===L.id && log[log.length-1].startedAt===lessonCtx.startedAt) log[log.length-1]=entry;
    else log.push(entry);
    entry.startedAt=lessonCtx.startedAt;
    while(log.length>200) log.shift();
    localStorage.setItem('oks-lesson-log',JSON.stringify(log));
  }catch(e){}
}
function copyText(text){
  const done=()=>{ const t=document.createElement('div'); t.className='toast'; t.textContent='복사했어요'; document.body.appendChild(t); setTimeout(()=>t.remove(),1600); };
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(done,()=>fallback()); }
  else fallback();
  function fallback(){
    const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); done(); }catch(e){}
    ta.remove();
  }
}

  if(runtime && runtime.subject===route.subject && runtime.method===route.method) return;

/* ---------- 난이도 (성취기준 재구성) ----------
   같은 활동을 쉬움·보통·어려움으로 바꿔 준다. 원래 설정은 그대로 두고 라운드 복사본만 고친다. */
function buildRounds(cfg,level){
  let rounds=cfg.rounds.map(rc=>({...rc}));
  const creative=CANVAS_TYPES.includes(cfg.type) && cfg.type!=='traceDraw';
  if(level==='easy' && !creative && rounds.length>2) rounds=rounds.slice(0,2);
  return rounds.map(rc=>levelRound(cfg.type,rc,level));
}
function levelRound(type,rc,level){
  if(type==='match'){
    if(level==='easy'){
      const pairs=rc.pairs.slice(0,3), ids=pairs.map(p=>p.matchId);
      return {...rc, pairs, targets:rc.targets.filter(t=>ids.includes(t.matchId)), order:'aligned'};
    }
    return {...rc, order: level==='hard' ? 'shuffleBoth' : 'shuffleRight'};
  }
  if(type==='hiddenFind'){
    if(level==='easy') return {...rc, count:1, distract:rc.distract.slice(0,2)};
    if(level==='hard') return {...rc, distract:[...rc.distract, ...rc.distract].slice(0,6), small:true};
    return rc;
  }
  if(type==='pickOne'){
    const others=Object.keys(PICK_CHOICES).filter(k=>k!==rc.answer);
    if(level==='easy') return {...rc, options:[rc.answer, rc.options.find(k=>k!==rc.answer)||others[0]].sort((a,b)=>Object.keys(PICK_CHOICES).indexOf(a)-Object.keys(PICK_CHOICES).indexOf(b))};
    if(level==='hard') return {...rc, options:Object.keys(PICK_CHOICES)};
    return rc;
  }
  if(type==='traceDraw'){
    const t={easy:{tol:48,pass:80,road:66}, normal:{tol:34,pass:90,road:48}, hard:{tol:24,pass:95,road:36}}[level];
    return {...rc, ...t};
  }
  if(type==='paintTarget' && level==='easy'){
    // 가장 크거나 가장 작은 것만 남겨 두 개 중에 고르기
    const n=rc.options.length;
    const keep=[0,n-1];
    return {...rc, options:keep.map(i=>rc.options[i]), correctIndex:keep.indexOf(rc.correctIndex)};
  }
  if(type==='mosaicOrder' && level==='easy' && rc.sizes.length>3){
    const z=rc.sizes;
    return {...rc, sizes:[z[0], z[Math.floor(z.length/2)], z[z.length-1]]};
  }
  return rc;
}

function initRoundState(){
  const cfg=runtime.cfg;
  const rc=currentRoundCfg();
  if(cfg.type==='match'){
    const shuffle=a=>{ const b=a.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; };
    let left=(rc.pairs||[]).map(p=>({...p}));
    let right=(rc.targets||[]).map(t=>({...t}));
    if(rc.order==='aligned'){
      // 쉬움: 짝이 서로 마주 보도록 같은 순서로 놓는다 (오류 없는 학습)
      right=left.map(l=>right.find(r=>r.matchId===l.matchId)).filter(Boolean);
    } else {
      if(rc.order==='shuffleBoth') left=shuffle(left);
      // 짝이 우연히 같은 줄에만 놓이지 않도록 한 번은 섞는다
      let tries=0;
      do { right=shuffle(right); tries++; }
      while(tries<8 && right.length>2 && right.every((r,i)=>left[i] && r.matchId===left[i].matchId));
    }
    runtime.roundState={left,right,selected:null,matchedCount:0,total:left.length};
  } else if(cfg.type==='paintFree'){
    runtime.roundState={filled:{}, total:rc.regions.length, currentColor:COLORS[0].hex};
  } else if(cfg.type==='mosaicColor'){
    runtime.roundState={fills:{}, selectedCell:null, currentColor:rc.palette[0]};
  } else if(cfg.type==='mosaicSingle'){
    runtime.roundState={fills:{}};
  } else if(cfg.type==='paintTarget'){
    runtime.roundState={done:false};
  } else if(cfg.type==='mosaicOrder'){
    const sizes=rc.sizes.slice();
    const shuffled=sizes.map((sz,i)=>({id:'b'+i,size:sz})).sort(()=>Math.random()-0.5);
    runtime.roundState={slots:sizes.map((sz,i)=>({id:'slot'+i,size:sz,filled:false})), blocks:shuffled, selectedBlock:null};
  } else if(CANVAS_TYPES.includes(cfg.type)){
    canvasRoundSrcs(rc).forEach(src=>loadImg(src).catch(()=>{}));
    runtime.roundState={brushColor:rc.color||COLORS[0].hex, brushSize:'m', tool:'brush', stamp:rc.stamp||'star',
      sticker:rc.stickers?rc.stickers[0]:null,
      mood:null, imageData:null, baseImage:null, undoStack:[], guidePts:null, hits:null, done:false};
  } else if(cfg.type==='pickOne'){
    runtime.roundState={picked:null, wrong:null};
  } else if(cfg.type==='hiddenFind'){
    const cells=[];
    // 동물 그림은 하늘에 뜨지 않게 땅 쪽(아래 2/3)에만 둔다
    if(rc.img) [42,63,84].forEach(y=>[11,30,50,70,89].forEach(x=>cells.push([x,y])));
    else [20,50,80].forEach(y=>[13,37,63,87].forEach(x=>cells.push([x,y])));
    cells.sort(()=>Math.random()-0.5);
    const kinds=[...Array(rc.count).fill(rc.target), ...rc.distract].sort(()=>Math.random()-0.5);
    const jitter=n=>Math.round((Math.random()*2-1)*n);
    const items=kinds.map((kind,i)=>({
      id:'h'+i, kind,
      x:cells[i][0]+jitter(rc.img?3:5), y:cells[i][1]+jitter(rc.img?4:6),
      color:COLORS[Math.floor(Math.random()*COLORS.length)].hex,
      rot:rc.img ? jitter(8) : jitter(25), found:false
    }));
    runtime.roundState={items, foundCount:0, total:rc.count};
  } else if(cfg.type==='gallery'){
    runtime.roundState={items:loadGallery()};
  }
}

function drawStamp(ctx,kind,x,y,size,color,rot){
  ctx.save();

  if(kind==='circle'){ ctx.beginPath(); ctx.arc(50,50,44,0,Math.PI*2); ctx.fill(); }
  else if(kind==='flower'){

    ctx.beginPath(); ctx.arc(50,50,15,0,Math.PI*2); ctx.fill();

  } else if(preset==='butterfly'){

/* 선 따라 그리기 — 안내선을 촘촘한 점으로 만들어, 학생 선이 몇 %를 지나갔는지 계산한다 */
function traceGuidePoints(kind){
  const pts=[];
  if(kind==='line'){ for(let x=90;x<=510;x+=10) pts.push([x,240]); }
  else if(kind==='wave'){ for(let x=80;x<=520;x+=8) pts.push([x,240+Math.sin((x-80)/440*Math.PI*3)*85]); }
  else if(kind==='circle'){ for(let a=0;a<=360;a+=5){ const r=a*Math.PI/180-Math.PI/2; pts.push([300+Math.cos(r)*160,240+Math.sin(r)*160]); } }
  else if(kind==='triangle'){
    const v=[[300,72],[490,400],[110,400],[300,72]];
    for(let i=0;i<3;i++){
      const [x1,y1]=v[i],[x2,y2]=v[i+1];
      const n=Math.ceil(Math.hypot(x2-x1,y2-y1)/10);
      for(let k=0;k<n;k++) pts.push([x1+(x2-x1)*k/n, y1+(y2-y1)*k/n]);
    }
    pts.push([300,72]);
  }
  return pts;
}
function drawTraceGuide(ctx,pts,road){
  const path=()=>{ ctx.beginPath(); pts.forEach(([x,y],i)=> i?ctx.lineTo(x,y):ctx.moveTo(x,y)); };
  ctx.save(); ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.strokeStyle='#E8ECF4'; ctx.lineWidth=road||48; path(); ctx.stroke();
  ctx.strokeStyle='#A9B0CE'; ctx.lineWidth=6; ctx.setLineDash([2,14]); path(); ctx.stroke(); ctx.setLineDash([]);
  const [sx,sy]=pts[0], [ex,ey]=pts[pts.length-1];
  if(Math.hypot(ex-sx,ey-sy)>20){
    ctx.fillStyle='#F5B301'; ctx.fill(new Path2D(`M${starPoly(ex,ey,22,10).split(' ').join(' L')} Z`));
  }
  ctx.fillStyle='#3CB88F'; ctx.beginPath(); ctx.arc(sx,sy,17,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(sx,sy,6,0,Math.PI*2); ctx.fill();
  ctx.restore();
}
function tracePct(rs){
  if(!rs.hits||!rs.hits.length) return 0;
  return Math.round(rs.hits.filter(Boolean).length/rs.hits.length*100);
}

function walkAvatarTo(targetEl, callback){
  const avatar=document.getElementById('map-avatar');
  const stage=document.getElementById('world-hero');
  if(!avatar || !stage){ callback(); return; }
  const stageRect=stage.getBoundingClientRect();
  const targetRect=targetEl.getBoundingClientRect();
  const leftPct=((targetRect.left+targetRect.width/2)-stageRect.left)/stageRect.width*100;
  const topPct=((targetRect.top+targetRect.height*0.85)-stageRect.top)/stageRect.height*100;
  if(leftPct+0.5 < avatarPos.left) avatarFacing=-1;
  else if(leftPct-0.5 > avatarPos.left) avatarFacing=1;
  avatarPos.left=leftPct; avatarPos.top=topPct;
  avatar.style.left=leftPct+'%';
  avatar.style.top=topPct+'%';
  avatar.querySelector('img').style.transform=`scaleX(${avatarFacing})`;
  avatar.classList.add('walking');
  setTimeout(()=>{
    avatar.classList.remove('walking');
    callback();
  }, 650);
}

/* ---- 조이스틱: 평소엔 숨어 있다가 지도(빈 곳)를 누르면 그 자리에 나타나 캐릭터를 자유롭게 움직임 ---- */
let joyId=null, joyOrigin=null, joyVec={x:0,y:0}, joyRAF=null;
const JOY_R=46, JOY_BOUNDS={left:4,right:96,top:14,bottom:92};
function wireJoystick(){
  if(joyRAF){ cancelAnimationFrame(joyRAF); joyRAF=null; }
  joyId=null; joyOrigin=null; joyVec={x:0,y:0};
  const zone=document.getElementById('joyZone');
  const stick=document.getElementById('joystick');
  const knob=document.getElementById('joyKnob');
  const avatar=document.getElementById('map-avatar');
  const stage=document.getElementById('world-hero');
  if(!zone || !stick || !knob || !avatar || !stage) return;

  function placeStick(clientX, clientY){
    const r=stage.getBoundingClientRect();
    const x=Math.min(Math.max(clientX, r.left+JOY_R+2), r.right-JOY_R-2);
    const y=Math.min(Math.max(clientY, r.top+JOY_R+2), r.bottom-JOY_R-2);
    stick.style.left=(x-r.left)+'px';
    stick.style.top=(y-r.top)+'px';
    joyOrigin={x, y};
  }
  function updateKnob(dx,dy){ knob.style.transform=`translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`; }
  function stepMove(){
    if(joyId===null) return;
    if(Math.hypot(joyVec.x, joyVec.y) > 0.06){
      const speed=0.55; // % of stage per frame
      avatarPos.left=Math.min(JOY_BOUNDS.right, Math.max(JOY_BOUNDS.left, avatarPos.left+joyVec.x*speed));
      avatarPos.top=Math.min(JOY_BOUNDS.bottom, Math.max(JOY_BOUNDS.top, avatarPos.top+joyVec.y*speed));
      avatar.style.left=avatarPos.left+'%';
      avatar.style.top=avatarPos.top+'%';
      if(joyVec.x>0.12) avatarFacing=1; else if(joyVec.x<-0.12) avatarFacing=-1;
      avatar.querySelector('img').style.transform=`scaleX(${avatarFacing})`;
    }
    joyRAF=requestAnimationFrame(stepMove);
  }
  zone.addEventListener('pointerdown', e=>{
    if(joyId!==null) return;
    joyId=e.pointerId;
    try{ zone.setPointerCapture(e.pointerId); }catch(err){}
    placeStick(e.clientX, e.clientY);
    updateKnob(0,0);
    stick.classList.add('on');
    avatar.classList.add('dragging','walking');
    joyVec={x:0,y:0};
    joyRAF=requestAnimationFrame(stepMove);
  });
  zone.addEventListener('pointermove', e=>{
    if(e.pointerId!==joyId || !joyOrigin) return;
    let dx=e.clientX-joyOrigin.x, dy=e.clientY-joyOrigin.y;
    const d=Math.hypot(dx,dy);
    if(d>JOY_R){ dx*=JOY_R/d; dy*=JOY_R/d; }
    updateKnob(dx,dy);
    const dead=JOY_R*0.18;
    joyVec.x=Math.abs(dx)>dead ? dx/JOY_R : 0;
    joyVec.y=Math.abs(dy)>dead ? dy/JOY_R : 0;
  });
  const endJoy=e=>{
    if(e.pointerId!==joyId) return;
    joyId=null; joyOrigin=null; joyVec={x:0,y:0};
    if(joyRAF){ cancelAnimationFrame(joyRAF); joyRAF=null; }
    stick.classList.remove('on');
    updateKnob(0,0);
    avatar.classList.remove('dragging','walking');
  };
  ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>zone.addEventListener(ev, endJoy));
}

function wireActivity(){
  const cfg=runtime.cfg;
  if(cfg.type==='match') wireMatch();
  else if(cfg.type==='paintFree') wirePaintFree();
  else if(cfg.type==='mosaicColor') wireMosaicColor();
  else if(cfg.type==='mosaicSingle') wireMosaicSingle();
  else if(cfg.type==='paintTarget') wirePaintTarget();
  else if(cfg.type==='mosaicOrder') wireMosaicOrder();
  else if(CANVAS_TYPES.includes(cfg.type)) wireCanvasArt();
  else if(cfg.type==='hiddenFind') wireHiddenFind();
  else if(cfg.type==='pickOne') wirePickOne();
  else if(cfg.type==='gallery') wireGallery();
}

/* ---- match wiring ---- */
function wireMatch(){
  document.querySelectorAll('.match-item[data-side]').forEach(el=>{
    el.addEventListener('click',()=>{
      const side=el.getAttribute('data-side');
      const id=el.getAttribute('data-id');
      const rs=runtime.roundState;
      if(!rs.selected){ rs.selected={side,id}; render(); return; }
      if(rs.selected.side===side){ rs.selected={side,id}; render(); return; }
      const leftItem = side==='left'? findBy(rs.left,id) : findBy(rs.left,rs.selected.id);
      const rightItem = side==='right'? findBy(rs.right,id) : findBy(rs.right,rs.selected.id);
      if(leftItem && rightItem && leftItem.matchId===rightItem.matchId){
        rs._matched=rs._matched||{};
        rs._matched['left:'+leftItem.id]=true;
        rs._matched['right:'+rightItem.id]=true;
        rs.matchedCount++;
        rs.selected=null;
        playSuccess();
        speak(randomPraise());
        render();
        if(rs.matchedCount>=rs.total){ setTimeout(finishRound,500); }
      } else {
        retryFeedback('다시 해볼까요?');
        rs.shakeIds=[ (side==='left'?id:rs.selected.id), (side==='right'?id:rs.selected.id) ];
        rs.selected=null;
        render();
        document.querySelectorAll('.match-item').forEach(elm=>{
          const eid=elm.getAttribute('data-id');
          if(rs.shakeIds.includes(eid)) elm.classList.add('shake');
        });
        setTimeout(()=>{ rs.shakeIds=null; },500);
      }
    });
  });
  drawMatchLines();
}
function findBy(arr,id){return arr.find(x=>x.id===id);}
function drawMatchLines(){
  const svg=document.getElementById('matchLines');
  const cols=document.querySelector('.match-cols');
  if(!svg||!cols||!runtime||!runtime.roundState) return;
  const colsRect=cols.getBoundingClientRect();
  svg.setAttribute('width',colsRect.width);
  svg.setAttribute('height',colsRect.height);
  svg.innerHTML='';
  const rs=runtime.roundState;
  const matched=rs._matched||{};
  Object.keys(matched).filter(k=>k.startsWith('left:')).forEach(k=>{
    const leftId=k.slice(5);
    const leftItem=findBy(rs.left,leftId);
    if(!leftItem) return;
    const rightItem=rs.right.find(r=>r.matchId===leftItem.matchId);
    if(!rightItem) return;
    const leftEl=cols.querySelector(`.match-item[data-side="left"][data-id="${cssEscape(leftId)}"]`);
    const rightEl=cols.querySelector(`.match-item[data-side="right"][data-id="${cssEscape(rightItem.id)}"]`);
    if(!leftEl||!rightEl) return;
    const lr=leftEl.getBoundingClientRect(), rr=rightEl.getBoundingClientRect();
    const x1=lr.right-colsRect.left, y1=lr.top+lr.height/2-colsRect.top;
    const x2=rr.left-colsRect.left, y2=rr.top+rr.height/2-colsRect.top;
    const midX=(x1+x2)/2;
    const path=document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d',`M ${x1} ${y1} C ${midX} ${y1}, ${midX} ${y2}, ${x2} ${y2}`);
    path.setAttribute('class','match-line-path');
    svg.appendChild(path);
    const len=path.getTotalLength();
    path.style.strokeDasharray=len;
    path.style.strokeDashoffset=len;
    path.getBoundingClientRect();
    requestAnimationFrame(()=>{
      path.style.transition='stroke-dashoffset .5s ease';
      path.style.strokeDashoffset='0';
    });
    [[x1,y1],[x2,y2]].forEach(([cx,cy])=>{
      const dot=document.createElementNS('http://www.w3.org/2000/svg','circle');
      dot.setAttribute('cx',cx); dot.setAttribute('cy',cy); dot.setAttribute('r',6);
      dot.setAttribute('class','match-line-dot');
      svg.appendChild(dot);
    });
  });
}
function cssEscape(s){ return String(s).replace(/([^a-zA-Z0-9_-])/g,'\\$1'); }

/* ---- canvas art wiring (그리기 놀이) ----
   주의: 팔레트/도구 버튼을 누를 때 화면 전체를 다시 그리는 render()를 호출하면
   <canvas>가 새로 생성되어 그림이 지워지므로, 여기서는 상태만 바꾸고 DOM은 직접 갱신한다.
   (render()가 다른 이유로 호출돼도 rs.imageData로 그림을 되살린다) */
function playPop(){ if(settings.sound) tone(700+Math.random()*200,0,0.09,'triangle',0.12); }
function distToSeg(px,py,x1,y1,x2,y2){
  const dx=x2-x1, dy=y2-y1, len2=dx*dx+dy*dy;
  let t=len2 ? ((px-x1)*dx+(py-y1)*dy)/len2 : 0;
  t=Math.max(0,Math.min(1,t));
  return Math.hypot(px-(x1+t*dx), py-(y1+t*dy));
}
function wireCanvasArt(){
  const t=runtime.cfg.type, rs=runtime.roundState, rc=currentRoundCfg();

  if(t==='moodDraw' && !rs.mood){
    document.querySelectorAll('.mood-btn[data-mood]').forEach(b=>{
      b.addEventListener('click',()=>{
        const m=MOODS.find(x=>x.key===b.getAttribute('data-mood'));
        rs.mood=m.key; rs.brushColor=m.color;
        playSuccess();
        render();
        speak(activityInstructionText());
      });
    });
    return;
  }

  const canvas=document.getElementById('drawCanvas');
  if(!canvas) return;
  const ctx=canvas.getContext('2d');
  const W=canvas.width;

  // 배경·스티커 그림이 아직 안 불러와졌으면 잠깐 기다렸다가 다시 그린다
  const pending=canvasRoundSrcs(rc).filter(src=>!_imgReady[src]);
  if(pending.length){
    ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,W,canvas.height);
    ctx.fillStyle='#A9B0CE'; ctx.font='bold 28px sans-serif'; ctx.textAlign='center';
    ctx.fillText('그림을 불러오는 중…',W/2,canvas.height/2);
    Promise.all(pending.map(src=>loadImg(src))).then(()=>{
      if(runtime && runtime.roundState===rs) render();
    }).catch(()=>{});
    return;
  }

  if(!rs.baseImage){
    ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,W,canvas.height);
    if(rc.bg) drawCover(ctx,_imgReady[sceneSrc(rc.bg)],W,canvas.height);
    if(rc.preset) drawPreset(ctx,rc.preset);
    if(t==='traceDraw'){
      rs.guidePts=traceGuidePoints(rc.guide);
      rs.hits=new Array(rs.guidePts.length).fill(false);
      drawTraceGuide(ctx,rs.guidePts,rc.road);
    }
    rs.baseImage=ctx.getImageData(0,0,W,canvas.height);
  }
  ctx.putImageData(rs.imageData||rs.baseImage,0,0);

  let drawing=false, lastX=0, lastY=0, lastStampX=-999, lastStampY=-999;
  const pos=e=>{
    const r=canvas.getBoundingClientRect();
    return {x:(e.clientX-r.left)*(W/r.width), y:(e.clientY-r.top)*(canvas.height/r.height)};
  };
  const pushUndo=()=>{
    rs.undoStack.push(ctx.getImageData(0,0,W,canvas.height));
    if(rs.undoStack.length>15) rs.undoStack.shift();
  };
  const strokeLine=(x1,y1,x2,y2)=>{ ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); };
  const markTrace=(x1,y1,x2,y2)=>{
    rs.guidePts.forEach(([gx,gy],i)=>{ if(!rs.hits[i] && distToSeg(gx,gy,x1,y1,x2,y2)<(rc.tol||34)) rs.hits[i]=true; });
    const fill=document.getElementById('traceFill');
    if(fill) fill.style.width=tracePct(rs)+'%';
  };
  const drawSegment=(x1,y1,x2,y2)=>{
    ctx.lineJoin='round'; ctx.lineCap='round';
    if(t==='traceDraw'){ ctx.strokeStyle=rs.brushColor; ctx.lineWidth=18; }
    else if(rs.tool==='eraser'){ ctx.strokeStyle='#ffffff'; ctx.lineWidth=36; }
    else { ctx.strokeStyle=rs.brushColor; ctx.lineWidth = rs.brushSize==='l'?26 : rs.brushSize==='s'?8 : 16; }
    strokeLine(x1,y1,x2,y2);
    if(t==='decalDraw') strokeLine(W-x1,y1,W-x2,y2); // 반대쪽에 거울처럼
    if(t==='traceDraw') markTrace(x1,y1,x2,y2);
  };
  const stampAt=(x,y)=>{
    drawStamp(ctx, rs.stamp, x, y, STAMP_SIZE[rs.brushSize], rs.brushColor, (Math.random()-0.5)*0.9);
    lastStampX=x; lastStampY=y;
    playPop();
  };

  const placeSticker=(x,y)=>{
    const img=_imgReady[stickerSrc(rs.sticker)];
    if(!img) return;
    const sc=STICKER_SIZE[rs.brushSize]/Math.max(img.naturalWidth,img.naturalHeight);
    const w=img.naturalWidth*sc, h=img.naturalHeight*sc;
    ctx.save();
    ctx.shadowColor='rgba(0,0,0,.28)'; ctx.shadowBlur=10; ctx.shadowOffsetY=5;
    ctx.drawImage(img,x-w/2,y-h/2,w,h);
    ctx.restore();
    playPop();
  };

  canvas.addEventListener('pointerdown', e=>{
    if(rs.done) return;
    if(t==='stickerDraw'){
      pushUndo();
      const p=pos(e);
      placeSticker(p.x,p.y);
      rs.imageData=ctx.getImageData(0,0,W,canvas.height);
      return;
    }
    canvas.setPointerCapture(e.pointerId);
    pushUndo();
    drawing=true;
    const p=pos(e); lastX=p.x; lastY=p.y;
    if(t==='stampDraw') stampAt(p.x,p.y);
    else drawSegment(p.x,p.y,p.x+0.1,p.y+0.1); // 톡 찍어도 점이 보이도록
  });
  canvas.addEventListener('pointermove', e=>{
    if(!drawing) return;
    const p=pos(e);
    if(t==='stampDraw'){
      // 누른 채 움직이면 도장 크기만큼 떨어질 때마다 이어서 찍힌다
      if(Math.hypot(p.x-lastStampX,p.y-lastStampY) > STAMP_SIZE[rs.brushSize]*0.85) stampAt(p.x,p.y);
      return;
    }
    drawSegment(lastX,lastY,p.x,p.y);
    lastX=p.x; lastY=p.y;
  });
  ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>canvas.addEventListener(ev, ()=>{
    if(!drawing) return;
    drawing=false;
    rs.imageData=ctx.getImageData(0,0,W,canvas.height);
    if(t==='traceDraw' && !rs.done && tracePct(rs)>=(rc.pass||90)){
      rs.done=true;
      playSuccess();
      speak('끝까지 잘 따라 그렸어요! '+randomPraise());
      setTimeout(finishRound,700);
    }
  }));

  const resetToBase=()=>{
    ctx.putImageData(rs.baseImage,0,0);
    rs.imageData=null;
  };
  const traceReset=document.querySelector('[data-action="trace-reset"]');
  if(traceReset) traceReset.addEventListener('click',()=>{
    if(rs.done) return;
    resetToBase();
    rs.hits=new Array(rs.guidePts.length).fill(false);
    const fill=document.getElementById('traceFill'); if(fill) fill.style.width='0%';
  });

  document.querySelectorAll('.draw-swatches .swatch').forEach(sw=>{
    sw.addEventListener('click',()=>{
      rs.brushColor=sw.getAttribute('data-color');
      rs.tool='brush';
      document.querySelectorAll('.draw-swatches .swatch').forEach(s2=>s2.classList.remove('active'));
      sw.classList.add('active');
      const eb=document.querySelector('.tool-btn[data-tool="eraser"]'); if(eb) eb.classList.remove('active');
      const sp=document.getElementById('stampPicker'); if(sp) sp.style.color=rs.brushColor;
    });
  });
  document.querySelectorAll('.sticker-btn[data-sticker]').forEach(b=>{
    b.addEventListener('click',()=>{
      rs.sticker=b.getAttribute('data-sticker');
      document.querySelectorAll('.sticker-btn').forEach(b2=>b2.classList.remove('active'));
      b.classList.add('active');
      const w=STICKER_WORD[rs.sticker]; if(w) speak(w);
    });
  });
  document.querySelectorAll('.stamp-btn[data-stamp]').forEach(b=>{
    b.addEventListener('click',()=>{
      rs.stamp=b.getAttribute('data-stamp');
      document.querySelectorAll('.stamp-btn').forEach(b2=>b2.classList.remove('active'));
      b.classList.add('active');
    });
  });
  document.querySelectorAll('.brush-size-btn[data-size]').forEach(b=>{
    b.addEventListener('click',()=>{
      rs.brushSize=b.getAttribute('data-size');
      document.querySelectorAll('.brush-size-btn[data-size]').forEach(b2=>b2.classList.remove('active'));
      b.classList.add('active');
    });
  });
  const eraserBtn=document.querySelector('.tool-btn[data-tool="eraser"]');
  if(eraserBtn) eraserBtn.addEventListener('click',()=>{
    rs.tool = rs.tool==='eraser' ? 'brush' : 'eraser';
    eraserBtn.classList.toggle('active', rs.tool==='eraser');
  });
  const undoBtn=document.querySelector('[data-action="draw-undo"]');
  if(undoBtn) undoBtn.addEventListener('click',()=>{
    if(rs.undoStack.length){
      const prev=rs.undoStack.pop();
      ctx.putImageData(prev,0,0);
      rs.imageData=prev;
    }
  });
  const clearBtn=document.querySelector('[data-action="draw-clear"]');
  if(clearBtn) clearBtn.addEventListener('click',()=>{
    pushUndo();
    resetToBase();
  });
  const finishBtn=document.querySelector('[data-action="draw-finish"]');
  if(finishBtn) finishBtn.addEventListener('click',()=>{
    if(rs.done) return;
    rs.done=true;
    let theme=rc.theme;
    if(t==='moodDraw'){ const m=MOODS.find(x=>x.key===rs.mood); theme='기분 색칠 · '+(m?m.label:''); }
    addToGallery(canvas.toDataURL('image/png'), theme);
    playSuccess();
    speak(randomPraise());
    setTimeout(finishRound,400);
  });
}

/* ---- pick one wiring ---- */
function wirePickOne(){
  const rs=runtime.roundState, rc=currentRoundCfg();
  document.querySelectorAll('.pick-btn[data-pick]').forEach(b=>{
    b.addEventListener('click',()=>{
      if(rs.picked) return;
      const k=b.getAttribute('data-pick');
      if(k===rc.answer){
        rs.picked=k; rs.wrong=null;
        playSuccess();
        render();
        speak(`맞아요, ${withIeyo(PICK_CHOICES[k].label)}! ${rc.reason}`);
        setTimeout(finishRound,2200);
      } else {
        rs.wrong=k;
        retryFeedback('그림을 다시 살펴볼까요?');
        render();
      }
    });
  });
}

/* ---- hidden find wiring (탐험 놀이: 숨은 모양 찾기) ---- */
function wireHiddenFind(){
  const rs=runtime.roundState, rc=currentRoundCfg();
  const want=hiddenWord(rc.target,rc);
  document.querySelectorAll('.hidden-item[data-id]').forEach(el=>{
    el.addEventListener('click',()=>{
      const it=rs.items.find(i=>i.id===el.getAttribute('data-id'));
      if(!it || it.found || rs.foundCount>=rs.total) return;
      if(it.kind===rc.target){
        it.found=true;
        rs.foundCount++;
        playSuccess();
        render();
        if(rs.foundCount>=rs.total){
          speak(`${want} ${rs.total}${rc.img?'마리':'개'}를 모두 찾았어요! `+randomPraise());
          setTimeout(finishRound,700);
        } else {
          speak(`${withEulReul(want)} 찾았어요!`);
        }
      } else {
        retryFeedback(`그건 ${withIeyo(hiddenWord(it.kind,rc))}. ${withEulReul(want)} 찾아봐요`);
        el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake');
      }
    });
  });
}

/* ---- gallery wiring (감상관: 작품 전시관) ---- */
function wireGallery(){
  // 감상관은 정답이 없어 둘러보는 것 자체가 성취 — 처음 들어오면 바로 별을 채운다.
  if(runtime && !runtime._galleryDone){
    runtime._galleryDone=true;
    recordResult(runtime.subject, runtime.method, 3);
  }
  const doneBtn=document.querySelector('[data-action="gallery-done"]');
  if(doneBtn) doneBtn.addEventListener('click',()=>{ playBigWin(); lessonAdvance(3); });
  document.querySelectorAll('[data-action="gallery-like"]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const id=btn.getAttribute('data-id');
      toggleGalleryLike(id);
      playSuccess();
      runtime.roundState.items=loadGallery();
      render();
    });
  });
}

/* ---- paint free wiring ---- */
function wirePaintFree(){
  const stage=document.getElementById('paint-stage');
  document.querySelectorAll('.swatch').forEach(sw=>{
    sw.addEventListener('click',()=>{
      runtime.roundState.currentColor=sw.getAttribute('data-color');
      render();
    });
  });
  if(!stage) return;
  stage.querySelectorAll('.region').forEach(region=>{
    region.addEventListener('click',()=>{
      const rs=runtime.roundState;
      const key=region.getAttribute('data-region');
      region.style.fill=rs.currentColor;
      if(!rs.filled[key]){ rs.filled[key]=rs.currentColor; }
      const doneCount=Object.keys(rs.filled).length;
      if(doneCount>=rs.total){
        playSuccess();
        const rc=currentRoundCfg();
        speak(rc.name+' 색칠을 다 했어요! '+randomPraise());
        setTimeout(finishRound,600);
      } else {
        speak('잘 칠했어요');
      }
    });
  });
}

/* ---- mosaic color wiring ---- */
function wireMosaicColor(){
  document.querySelectorAll('.swatch').forEach(sw=>{
    sw.addEventListener('click',()=>{
      runtime.roundState.currentColor=sw.getAttribute('data-color');
      render();
    });
  });
  document.querySelectorAll('.cell[data-cell]').forEach(cell=>{
    cell.addEventListener('click',()=>{
      const rs=runtime.roundState, rc=currentRoundCfg();
      const key=cell.getAttribute('data-cell');
      const [r,c]=key.split('_').map(Number);
      const target=rc.grid[r][c];
      if(rs.fills[key]) return;
      if(target===rs.currentColor){
        rs.fills[key]=rs.currentColor;
        playSuccess();
        const totalTarget=rc.grid.flat().length;
        const filledCount=Object.keys(rs.fills).length;
        render();
        if(filledCount>=totalTarget){
          speak(rc.name+' 완성! '+randomPraise());
          setTimeout(finishRound,600);
        }
      } else {
        retryFeedback('다른 색을 골라볼까요?');
        cell.classList.add('wrong');
        setTimeout(()=>cell.classList.remove('wrong'),400);
      }
    });
  });
}

/* ---- mosaic single wiring ---- */
function wireMosaicSingle(){
  document.querySelectorAll('.cell[data-cell]').forEach(cell=>{
    cell.addEventListener('click',()=>{
      const rs=runtime.roundState, rc=currentRoundCfg();
      const key=cell.getAttribute('data-cell');
      const isTarget=cell.getAttribute('data-target')==='1';
      if(rs.fills[key]) return;
      if(isTarget){
        rs.fills[key]=true;
        playSuccess();
        const totalTarget=rc.grid.flat().filter(v=>v===1).length;
        const filledCount=Object.keys(rs.fills).length;
        render();
        if(filledCount>=totalTarget){
          speak(rc.name+' 모양 완성! '+randomPraise());
          setTimeout(finishRound,600);
        }
      } else {
        retryFeedback('다시 눌러볼까요?');
        cell.classList.add('wrong');
        setTimeout(()=>cell.classList.remove('wrong'),400);
      }
    });
  });
}

/* ---- paint target (size) wiring ---- */
function wirePaintTarget(){
  document.querySelectorAll('.size-card[data-idx]').forEach(card=>{
    card.addEventListener('click',()=>{
      const rc=currentRoundCfg(); const rs=runtime.roundState;
      const idx=Number(card.getAttribute('data-idx'));
      if(rs.done) return;
      if(idx===rc.correctIndex){
        rs.filledIndex=idx; rs.done=true;
        playSuccess(); speak(randomPraise());
        render();
        setTimeout(finishRound,600);
      } else {
        retryFeedback('다시 골라볼까요?');
        rs.shakeIndex=idx; render();
        setTimeout(()=>{ rs.shakeIndex=null; render(); },400);
      }
    });
  });
}

/* ---- mosaic order wiring ---- */
function wireMosaicOrder(){
  document.querySelectorAll('.block[data-block]').forEach(b=>{
    b.addEventListener('click',()=>{
      const rs=runtime.roundState;
      const id=b.getAttribute('data-block');
      const block=rs.blocks.find(x=>x.id===id);
      if(block.placed) return;
      rs.selectedBlock=id;
      render();
    });
  });
  document.querySelectorAll('.slot[data-slot]').forEach(s=>{
    s.addEventListener('click',()=>{
      const rs=runtime.roundState;
      if(!rs.selectedBlock) return;
      const slotId=s.getAttribute('data-slot');
      const slot=rs.slots.find(x=>x.id===slotId);
      const block=rs.blocks.find(x=>x.id===rs.selectedBlock);
      if(slot.filled){ return; }
      if(block.size===slot.size){
        slot.filled=true; block.placed=true; rs.selectedBlock=null;
        playSuccess(); speak(randomPraise());
        render();
        if(rs.slots.every(x=>x.filled)){
          speak('순서대로 완성했어요! '+randomPraise());
          setTimeout(finishRound,600);
        }
      } else {
        retryFeedback('다른 크기를 놓아볼까요?');
        rs.selectedBlock=null;
        rs.shakeSlot=slotId;
        render();
        setTimeout(()=>{ rs.shakeSlot=null; render(); },400);
      }
    });
  });
}

/* ================= 촉진 체계 (최소 → 최대 촉진) =================
   1) 활동을 처음 열면 손가락 시범을 한 번 보여 준다 (모델링)
   2) 반응이 없으면: 약 9초 뒤 정답이 반짝이고 지시를 다시 읽어 준다 (시각 촉진)
   3) 그래도 없으면: 약 8초 뒤 손가락이 정답을 짚어 준다 (몸짓 촉진)
   4) "도와줘" 버튼을 누르면 바로 3)단계를 보여 준다
   도움을 받은 횟수는 기록만 하고 별 개수에는 반영하지 않는다(도움 요청을 벌주지 않기 위해). */
const HINT_IDLE=[9000,8000];
let hintTimer=null, hintLevel=0;
function clearHintVisuals(){
  document.querySelectorAll('.hint-glow').forEach(e=>e.classList.remove('hint-glow'));
  document.querySelectorAll('.hint-hand').forEach(e=>e.remove());
}
function stopHints(){ clearTimeout(hintTimer); hintTimer=null; clearHintVisuals(); }
function hintsAllowed(){ return route.view==='activity' && runtime && !runtime.celebrate && !settingsOpen; }
function armHints(){
  stopHints();
  if(!hintsAllowed()) return;
  hintLevel=0;
  const tick=()=>{
    if(!hintsAllowed()) return;
    hintLevel++;
    showHint(Math.min(hintLevel,2),{auto:true});
    if(hintLevel<3) hintTimer=setTimeout(tick,HINT_IDLE[1]+(hintLevel>=2?4000:0)); // 손가락은 한 번 더 보여 주고 멈춘다
  };
  hintTimer=setTimeout(tick,HINT_IDLE[0]);
}
function qs(sel){ return document.querySelector(sel); }
/* 지금 해야 할 정답 동작이 무엇인지 활동 유형별로 찾는다 */
function hintTarget(){
  if(!runtime) return null;
  const t=runtime.cfg.type, rs=runtime.roundState, rc=currentRoundCfg();
  if(!rs) return null;
  if(t==='match'){
    const item=(side,id)=>qs(`.match-item[data-side="${side}"][data-id="${cssEscape(id)}"]`);
    if(rs.selected){
      const sel = rs.selected.side==='left' ? findBy(rs.left,rs.selected.id) : findBy(rs.right,rs.selected.id);
      const otherSide = rs.selected.side==='left' ? 'right' : 'left';
      const partner=(otherSide==='right'?rs.right:rs.left).find(x=>x.matchId===sel.matchId && !isMatched(otherSide,x.id));
      if(partner) return {kind:'tap', els:[item(otherSide,partner.id)], say:'짝을 찾아 눌러요'};
    }
    const l=rs.left.find(x=>!isMatched('left',x.id));
    if(!l) return null;
    const r=rs.right.find(x=>x.matchId===l.matchId);
    return {kind:'tap', els:[item('left',l.id), item('right',r.id)], say:'이것과 이것을 이어요'};
  }
  if(t==='paintFree'){
    const key=rc.regions.find(k=>!rs.filled[k]);
    return key ? {kind:'tap', els:[qs(`#paint-stage .region[data-region="${key}"]`)], say:'여기를 눌러 칠해요'} : null;
  }
  if(t==='mosaicColor'){
    for(let r=0;r<rc.grid.length;r++) for(let c=0;c<rc.cols;c++){
      const key=r+'_'+c;
      if(rs.fills[key]) continue;
      const want=rc.grid[r][c];
      if(rs.currentColor!==want) return {kind:'tap', els:[qs(`.swatch[data-color="${want}"]`)], say:'이 색을 골라요'};
      return {kind:'tap', els:[qs(`.cell[data-cell="${key}"]`)], say:'여기를 눌러요'};
    }
    return null;
  }
  if(t==='mosaicSingle'){
    for(let r=0;r<rc.grid.length;r++) for(let c=0;c<rc.cols;c++){
      const key=r+'_'+c;
      if(rc.grid[r][c]===1 && !rs.fills[key]) return {kind:'tap', els:[qs(`.cell[data-cell="${key}"]`)], say:'점선 칸을 눌러요'};
    }
    return null;
  }
  if(t==='paintTarget') return {kind:'tap', els:[qs(`.size-card[data-idx="${rc.correctIndex}"]`)], say:'이것을 눌러요'};
  if(t==='mosaicOrder'){
    const slot=rs.slots.find(x=>!x.filled);
    if(!slot) return null;
    const sel=rs.selectedBlock && rs.blocks.find(b=>b.id===rs.selectedBlock);
    if(sel){
      const fit=rs.slots.find(x=>!x.filled && x.size===sel.size);
      if(fit) return {kind:'tap', els:[qs(`.slot[data-slot="${fit.id}"]`)], say:'여기에 놓아요'};
    }
    const block=rs.blocks.find(b=>!b.placed && b.size===slot.size);
    return {kind:'tap', els:[qs(`.block[data-block="${block.id}"]`), qs(`.slot[data-slot="${slot.id}"]`)], say:'이것을 골라 여기에 놓아요'};
  }
  if(t==='hiddenFind'){
    const it=rs.items.find(i=>i.kind===rc.target && !i.found);
    return it ? {kind:'tap', els:[qs(`.hidden-item[data-id="${it.id}"]`)], say:'여기 있어요!'} : null;
  }
  if(t==='pickOne') return rs.picked ? null : {kind:'tap', els:[qs(`.pick-btn[data-pick="${rc.answer}"]`)], say:'그림을 잘 보고 골라요'};
  if(t==='moodDraw' && !rs.mood) return {kind:'glow', els:[...document.querySelectorAll('.mood-btn')], say:'내 기분과 닮은 얼굴을 눌러요'};
  if(t==='traceDraw'){
    const canvas=qs('#drawCanvas'); if(!canvas||!rs.guidePts) return null;
    const r=canvas.getBoundingClientRect(), k=r.width/canvas.width;
    const step=Math.max(1,Math.floor(rs.guidePts.length/24));
    const path=rs.guidePts.filter((_,i)=>i%step===0).map(([x,y])=>({x:r.left+x*k, y:r.top+y*k}));
    return {kind:'trace', els:[qs('.canvas-wrap')], path, say:'초록 점부터 따라 그어요'};
  }
  if(CANVAS_TYPES.includes(t)){
    const wrap=qs('.canvas-wrap'); if(!wrap) return null;
    if(!rs.imageData) return {kind: t==='stickerDraw'||t==='stampDraw' ? 'tap' : 'draw', els:[wrap],
      say: t==='stickerDraw' ? '스티커를 골라 그림을 콕 눌러요' : t==='stampDraw' ? '그림을 콕 눌러 도장을 찍어요' : '손가락으로 그려 보아요'};
    return {kind:'tap', els:[qs('[data-action="draw-finish"]')], say:'다 했으면 완성했어요를 눌러요'};
  }
  return null;
}
function centerOf(el){ const r=el.getBoundingClientRect(); return {x:r.left+r.width/2, y:r.top+r.height/2}; }
function makeHand(){
  const h=document.createElement('div');
  h.className='hint-hand'; h.textContent='👆'; h.setAttribute('aria-hidden','true');
  document.body.appendChild(h);
  return h;
}
const HAND_TIP={x:20,y:4}; // 손가락 끝이 가리키는 지점 보정
function handFrames(points,pressAt){
  const tf=(p,sc)=>`translate(${p.x-HAND_TIP.x}px,${p.y-HAND_TIP.y}px) scale(${sc})`;
  const frames=[], n=points.length;
  points.forEach((p,i)=>{
    const off=0.12+0.78*(i/(Math.max(1,n-1)));
    frames.push({transform:tf(p,1), opacity:1, offset:Math.min(off,0.9)});
    if(pressAt && pressAt.includes(i)){
      frames.push({transform:tf(p,0.82), opacity:1, offset:Math.min(off+0.05,0.94)});
      frames.push({transform:tf(p,1), opacity:1, offset:Math.min(off+0.09,0.96)});
    }
  });
  const start={x:points[0].x+60, y:points[0].y+110};
  frames.unshift({transform:tf(start,1), opacity:0, offset:0});
  frames.push({transform:tf(points[n-1],1), opacity:0, offset:1});
  // offset은 오름차순이어야 한다
  let last=-1; frames.forEach(f=>{ if(f.offset<=last) f.offset=Math.min(1,last+0.001); last=f.offset; });
  return frames;
}
function playHand(points,pressAt,duration){
  const hand=makeHand();
  const anim=hand.animate(handFrames(points,pressAt),{duration,easing:'ease-in-out'});
  anim.onfinish=()=>hand.remove();
  anim.oncancel=()=>hand.remove();
}
function showHint(level,opts){
  opts=opts||{};
  const h=hintTarget();
  if(!h || !h.els.length || h.els.some(e=>!e)) return;
  clearHintVisuals();
  if(!opts.demo) runtime.hints=(runtime.hints||0)+1;
  h.els.forEach(e=>e.classList.add('hint-glow'));
  const first=h.els[0].getBoundingClientRect();
  if(first.bottom>window.innerHeight || first.top<0) h.els[0].scrollIntoView({block:'center',behavior:'smooth'});
  if(level===1 && opts.auto){ speak(activityInstructionText()); return; }
  const go=()=>{
    if(h.kind==='trace'){
      const path=hintTarget().path; // 스크롤 뒤 좌표 다시 계산
      playHand(path,null,2800);
    } else if(h.kind==='draw'){
      const r=h.els[0].getBoundingClientRect();
      const pts=[0,1,2,3,4].map(i=>({x:r.left+r.width*(0.25+i*0.12), y:r.top+r.height*(i%2?0.35:0.6)}));
      playHand(pts,null,2400);
    } else if(h.kind==='tap'){
      const pts=h.els.map(centerOf);
      playHand(pts,pts.map((_,i)=>i),pts.length>1?2600:1700);
    }
    if(!opts.demo) speak(h.say);
    else setTimeout(()=>{ if(hintLevel===0) clearHintVisuals(); },3000); // 시범이 끝나면 정답 표시는 거둔다
  };
  setTimeout(go,(first.bottom>window.innerHeight||first.top<0)?350:0);
}
/* 처음 여는 활동이면 시범을 한 번 보여 준다 */
function demoKey(){ return runtime.subject+'.'+runtime.method; }
function maybeDemo(){
  if(!runtime || runtime.roundIndex!==0 || runtime._demoDone) return;
  runtime._demoDone=true;
  let seen={};
  try{ seen=JSON.parse(localStorage.getItem('oks-demo-seen')||'{}'); }catch(e){}
  if(seen[demoKey()]) return;
  seen[demoKey()]=true;
  try{ localStorage.setItem('oks-demo-seen',JSON.stringify(seen)); }catch(e){}
  setTimeout(()=>{ if(hintsAllowed()) showHint(2,{demo:true}); },1100);
}
/* 활동 기록 (과정 중심 평가 자료) */
function logActivity(stars){
  try{
    const log=JSON.parse(localStorage.getItem('oks-activity-log')||'[]');
    log.push({subject:runtime.subject, method:runtime.method, level:runtime.level, stars,
      mistakes:runtime.mistakes||0, hints:runtime.hints||0,
      sec:Math.round((Date.now()-runtime.startedAt)/1000), at:Date.now(),
      lesson: lessonCtx ? lessonCtx.id : null});
    while(log.length>400) log.shift();
    localStorage.setItem('oks-activity-log',JSON.stringify(log));
  }catch(e){}
}

/* ================= round / activity completion ================= */
function starsFromMistakes(mistakes){
  if(mistakes<=0) return 3;
  if(mistakes<=2) return 2;
  return 1;
}
function finishRound(){
  if(runtime.celebrate) return;
  playBigWin();
  const isFinal = runtime.roundIndex >= totalRounds()-1;
  let earnedStars=null;
  if(isFinal){
    earnedStars=starsFromMistakes(runtime.mistakes||0);
    recordResult(runtime.subject, runtime.method, earnedStars);
    logActivity(earnedStars);
  }
  runtime.celebrate={ kind: isFinal ? 'final' : 'round', stars: earnedStars };
  render();
}
function renderCelebrateOverlay(state){
  const overlay=document.createElement('div');
  overlay.className='celebrate-overlay';
  const isFinal=state.kind==='final';
  const lessonMode=inLesson();
  const lessonLast=lessonMode && lessonCtx.step>=lessonById(lessonCtx.id).steps.length-1;
  const starsHtml = isFinal
    ? Array.from({length:3}).map((_,i)=>bigStarIcon(i<state.stars?'#F5B301':'#E3E8EF')).join('')
    : `${bigStarIcon('#F5B301')}${bigStarIcon('#FF6F59')}${bigStarIcon('#3AAFA9')}`;
  overlay.innerHTML=`
    <div class="celebrate-card">
      ${mascotBlock('cheer','')}
      <div class="stars-row">${starsHtml}</div>
      <h2>${isFinal?'다 완성했어요!':'참 잘했어요!'}</h2>
      <p>${isFinal?(lessonMode?(lessonLast?'이제 오늘 수업을 정리해요.':'다음 활동으로 가 볼까요?'):'모든 단계를 끝냈어요. 정말 대단해요!'):'다음으로 넘어가볼까요?'}</p>
      <button class="big-btn" data-action="celebrate-next">${isFinal?(lessonMode?(lessonLast?'수업 정리하기':'다음 활동으로'):'경로로 돌아가기'):'다음으로'}</button>
      ${isFinal?`<button class="big-btn secondary" data-action="celebrate-again">${lessonMode?'한 번 더 하기':'처음부터 다시하기'}</button>`:''}
    </div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('[data-action="celebrate-next"]').addEventListener('click',()=>{
    document.body.removeChild(overlay);
    runtime.celebrate=null;
    if(isFinal){
      if(lessonMode){ lessonAdvance(state.stars); return; }
      route.view='path'; route.method=null; runtime=null;
      render();
    } else {
      runtime.roundIndex++;
      initRoundState();
      render();
      speakInstructionSoon();
    }
  });
  const againBtn=overlay.querySelector('[data-action="celebrate-again"]');
  if(againBtn){
    againBtn.addEventListener('click',()=>{
      document.body.removeChild(overlay);
      runtime.celebrate=null;
      runtime.roundIndex=0;
      runtime.mistakes=0;
      initRoundState();
      render();
      speakInstructionSoon();
    });
  }
}

/* ================= settings modal ================= */
function renderSettingsModal(){
  const overlay=document.createElement('div');
  overlay.className='modal-overlay';
  overlay.innerHTML=`
    <div class="modal-card">
      <h3>설정</h3>
      <div class="setting-row">
        <span>음성 안내</span>
        <button class="switch ${settings.voice?'on':''}" data-toggle="voice"><span class="knob"></span></button>
      </div>
      <div class="setting-row">
        <span>효과음</span>
        <button class="switch ${settings.sound?'on':''}" data-toggle="sound"><span class="knob"></span></button>
      </div>
      <div class="setting-block">
        <span class="setting-title">활동 난이도 <small>(선생님)</small></span>
        <div class="seg" role="radiogroup">
          ${Object.entries(LEVELS).map(([k,v])=>`<button class="seg-btn ${settings.level===k?'on':''}" data-level="${k}" role="radio" aria-checked="${settings.level===k}">${v.label}</button>`).join('')}
        </div>
        <p class="setting-desc" id="levelDesc">${LEVELS[settings.level].desc}</p>
      </div>
      <div class="close-row">
        <button class="big-btn" data-action="close-settings">닫기</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click',(e)=>{ if(e.target===overlay){ closeSettings(overlay); } });
  overlay.querySelectorAll('[data-toggle]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const key=btn.getAttribute('data-toggle');
      settings[key]=!settings[key];
      saveSettings();
      btn.classList.toggle('on',settings[key]);
    });
  });
  overlay.querySelectorAll('[data-level]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      settings.level=btn.getAttribute('data-level');
      saveSettings();
      overlay.querySelectorAll('[data-level]').forEach(b=>{ b.classList.toggle('on',b===btn); b.setAttribute('aria-checked',b===btn); });
      overlay.querySelector('#levelDesc').textContent=LEVELS[settings.level].desc;
      // 진행 중인 활동은 처음부터 새 난이도로 다시 시작한다
      if(runtime && route.view==='activity'){ runtime=null; }
    });
  });
  overlay.querySelector('[data-action="close-settings"]').addEventListener('click',()=>closeSettings(overlay));
  function closeSettings(ov){
    document.body.removeChild(ov);
    settingsOpen=false;
    if(route.view==='activity' && !runtime) render(); else armHints();
  }
}

/* ================= boot ================= */
// 학생이 화면을 만지면 촉진 타이머를 처음부터 다시 잰다
document.addEventListener('pointerdown',()=>{ if(route.view==='activity') armHints(); },true);
if('speechSynthesis' in window){
  window.speechSynthesis.onvoiceschanged=()=>{};
}
render();

})();
