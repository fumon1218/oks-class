<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>학습지 · 옥쌤의 즐거운 교실</title>
<link rel="icon" href="../icons/ok-face-192.png">
<link rel="apple-touch-icon" href="../icons/ok-face-180.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Jua&family=Nanum+Gothic:wght@400;700&display=swap');
@page{size:A4;margin:10mm;}
:root{--ink:#2d2a26;--line:#3d3a35;--soft:#8a8174;--accent:#e0612f;}
*{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
body{margin:0;background:#e9e4da;font-family:'Jua','Nanum Gothic',sans-serif;color:var(--ink);}
/* 화면 위 도구 줄 (인쇄할 때는 안 나와요) */
.bar{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:10px;background:#fffdf6;box-shadow:0 2px 10px rgba(0,0,0,.12);}
.bar select,.bar button,.bar a,.bar label{font:inherit;font-size:16px;border:2px solid #dccdb2;border-radius:12px;background:#fff;padding:6px 12px;color:var(--ink);text-decoration:none;cursor:pointer;}
.bar .print{background:#3fb05a;border-color:#3fb05a;color:#fff;}
.bar label{display:flex;gap:6px;align-items:center;}
.pages{display:flex;flex-direction:column;align-items:center;gap:18px;padding:18px 8px 40px;}
.page{width:210mm;min-height:297mm;background:#fff;padding:10mm 11mm;box-shadow:0 4px 18px rgba(0,0,0,.18);position:relative;display:flex;flex-direction:column;}
@media print{
  body{background:#fff;} .bar{display:none;} .pages{padding:0;gap:0;}
  .page{width:auto;min-height:auto;height:277mm;box-shadow:none;padding:0;page-break-after:always;break-after:page;}
  .page:last-child{page-break-after:auto;break-after:auto;}
}
/* 머리 */
.head{display:flex;align-items:stretch;gap:8px;border-bottom:3px solid var(--line);padding-bottom:6px;}
.head .tt{flex:1;}
.head .sub{font-size:14px;color:var(--soft);}
.head h1{margin:2px 0 0;font-size:28px;font-weight:400;line-height:1.15;}
.head .goal{font-size:15px;margin-top:3px;}
.head .lv{font-size:13px;color:var(--accent);margin-top:2px;}
.score{width:34mm;border:2.5px solid var(--line);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.score b{font-weight:400;font-size:14px;}
.score span{font-size:24px;margin-top:6px;}
.info{display:grid;grid-template-columns:1.1fr 1.1fr 1fr 2.4fr 1.6fr;border:2px solid var(--line);border-radius:8px;margin:8px 0 6px;overflow:hidden;}
.info div{display:flex;align-items:center;gap:4px;padding:6px 8px;font-size:15px;border-right:1.5px solid var(--line);white-space:nowrap;}
.info div:last-child{border-right:none;}
.info i{flex:1;font-style:normal;}
/* 문제 */
.q{margin-top:16px;break-inside:avoid;page-break-inside:avoid;}
.qh{display:flex;align-items:baseline;gap:8px;font-size:22px;}
.qh .no{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;background:var(--ink);color:#fff;font-size:16px;flex:none;}
.qh .pt{margin-left:auto;font-size:13px;color:var(--soft);white-space:nowrap;}
.qb{margin:10px 0 0 40px;}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;}
.card{border:1.5px solid #cfc6b5;border-radius:10px;padding:6px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;}
.pics{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;align-items:center;}
.pics img{width:42px;height:42px;object-fit:contain;}
.big .pics img{width:52px;height:52px;}
.choices{display:flex;gap:10px;justify-content:center;}
.choices span{width:40px;height:40px;border:1.5px solid #bbb;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;}
.box{display:inline-flex;align-items:center;justify-content:center;width:54px;height:54px;border:2px solid var(--line);border-radius:8px;font-size:36px;vertical-align:middle;}
.box.trace{color:#c9c2b6;font-family:'Jua';border-style:dashed;}
.ans .box.blank::after,.ans .fillans::after{content:attr(data-a);color:#e53935;}
.ans .box.trace{color:#e53935;border-color:#e53935;}
.ans .circ{outline:3px solid #e53935;outline-offset:2px;border-radius:12px;}
.ans .ansline{display:block!important;}
.ansline{display:none;color:#e53935;font-size:15px;margin-top:4px;}
.dots{display:flex;gap:6px;flex-wrap:wrap;}
.dots i{width:40px;height:40px;border:2px dashed #b9b0a0;border-radius:50%;display:inline-block;}
.match{display:grid;grid-template-columns:auto 130px auto;align-items:center;row-gap:14px;max-width:150mm;}
.match .l,.match .r{display:flex;align-items:center;gap:8px;}
.match .r{justify-content:flex-start;}
.match .dot{width:12px;height:12px;border-radius:50%;background:var(--ink);flex:none;}
.match .l{justify-content:flex-end;}
.numbig{font-size:36px;width:46px;text-align:center;}
.bond{display:inline-flex;flex-direction:column;align-items:center;margin-right:30px;}
.bond .c{width:58px;height:58px;border:2.5px solid var(--line);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;background:#fff;}
.bond .two{display:flex;gap:30px;}
.bond svg{width:120px;height:34px;display:block;}
.shape-svg{width:48px;height:48px;}
.pattern{display:flex;gap:6px;align-items:center;}
.pattern .cell{width:52px;height:52px;display:flex;align-items:center;justify-content:center;}
.pattern .cell.empty{border:2px dashed var(--line);border-radius:8px;font-size:22px;color:#bbb;}
.cmp{display:flex;gap:28px;align-items:flex-end;}
.cmp .card{min-width:90px;}
.seesaw{width:260px;height:110px;}
.tbl{border-collapse:collapse;font-size:20px;}
.tbl td,.tbl th{border:1.5px solid var(--line);padding:4px 12px;text-align:center;font-weight:400;}
.tbl th{background:#f5efe3;}
.inner{display:flex;flex-direction:column;flex:1;min-height:100%;transform-origin:top left;}
.inner.measure{min-height:0;flex:none;height:auto;} .inner.measure .foot{margin-top:12px;}
.page{overflow:hidden;}
.foot{margin-top:auto;padding-top:8px;border-top:2px dashed #cfc6b5;display:flex;gap:10px;align-items:center;font-size:13px;}
.foot .chk{display:flex;gap:6px;flex-wrap:wrap;flex:1;}
.foot .chk span{border:1.5px solid #bbb;border-radius:6px;padding:2px 6px;}
.maker{display:flex;align-self:flex-end;flex:none;}
.maker span{display:inline-flex;align-items:center;gap:5px;padding:2px 9px 2px 2px;border-radius:999px;border:1px solid #e3c27a;font-size:11px;color:#8a7350;letter-spacing:.02em;}
.maker img{width:7mm;height:7mm;border-radius:50%;}
.foot .stamp{width:24mm;height:24mm;border:2px dashed #cfc6b5;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#c9c2b6;font-size:13px;flex:none;}
.anslabel{position:absolute;right:11mm;top:4mm;color:#e53935;font-size:16px;}
@media print{.anslabel{top:-4mm;right:0;}}
</style>
</head>
<body>
<div class="bar">
  <select id="lesson"></select>
  <select id="level"><option value="1">1수준 · 느끼기</option><option value="2">2수준 · 고르기</option><option value="3">3수준 · 해 보기</option><option value="4">4수준 · 혼자서</option><option value="5">5수준 · 생활로</option></select>
  <button id="again" type="button">🔄 다른 문제로</button>
  <label><input type="checkbox" id="withAns"> 정답지 같이</label>
  <button class="print" id="print" type="button">🖨️ 인쇄 / PDF로 저장</button>
  <a id="back" href="../learn/">⬅ 돌아가기</a>
</div>
<div class="pages" id="pages"></div>
<script src="../curriculum/lessons.js"></script>
<script src="../curriculum/english-basic.js"></script>
<script src="../play/content.js"></script>
<script src="../play/content2.js"></script>
<script src="../play/content-extra.js"></script>
<script src="../play/english-basic-content.js"></script>
<script src="../play/custom.js"></script>
<script src="generic.js"></script>
<script src="../games/tycoon/town.js"></script><script src="../games/tycoon/town2.js"></script>
<script>
(function () {
  'use strict';
  var A = '../art/', G = '../games/';

  var id = Q.get('id') && LESSONS.some(function (l) { return l.id === Q.get('id'); }) ? Q.get('id') : LESSONS[0].id;

  /* 그림 */

    ['배', G + 'balloons/img/f_pear.webp'], ['복숭아', G + 'balloons/img/f_peach.webp'], ['레몬', G + 'balloons/img/f_lemon.webp'], ['키위', G + 'balloons/img/f_kiwi.webp'],
    ['딸기', G + 'farm/assets/harvest_strawberry.webp'], ['토마토', G + 'farm/assets/harvest_tomato.webp'], ['당근', G + 'farm/assets/harvest_carrot.webp'], ['상추', G + 'farm/assets/harvest_lettuce.webp']];
  var AN = ['토끼:rabbit', '고양이:cat', '강아지:dog', '곰:bear', '판다:panda', '여우:fox', '코끼리:elephant', '펭귄:penguin', '개구리:frog', '원숭이:monkey']
    .map(function (s) { var p = s.split(':'); return [p[0], A + 'jj/animals/' + p[1] + '.webp']; });
  var COL = { 빨강: '#e53935', 파랑: '#1e88e5', 노랑: '#fdd835', 초록: '#43a047' };
  function img(p, sz) { return '<img src="' + p[1] + '" alt="' + p[0] + '"' + (sz ? ' style="width:' + sz + 'px;height:' + sz + 'px"' : '') + '>'; }
  function many(p, n, sz) { if (!sz && n > 6) sz = 34; var s = ''; for (var i = 0; i < n; i++) s += img(p, sz); return '<div class="pics">' + s + '</div>'; }

  }
  var SHN = { circle: '동그라미(○)', tri: '세모(△)', square: '네모(□)' };

  function choices(list, ans) { return '<div class="choices">' + list.map(function (v) { return '<span class="' + (v === ans ? 'circ' : '') + '">' + v + '</span>'; }).join('') + '</div>'; }
  var trace = level <= 2;   /* 1·2수준은 점선 숫자를 따라 써요 */
  var nMax = [3, 5, 5, 9, 10][level - 1];

  /* ---------- 차시별 문제 ---------- */

        return b + TW.LABELS.map(function (l) { return '<span style="position:absolute;left:' + (l[1] / TW.W * 100) + '%;top:' + (l[2] / TW.H * 100) + '%;transform:translate(-50%,-50%);background:#fff;border:2px solid #3d3a35;border-radius:10px;padding:0 6px;font-size:14px;white-space:nowrap">' + l[0] + '</span>'; }).join('') + '</div>';

      qs.push({ t: '지도를 보고 배달 주소의 집을 찾아 빈칸을 채우세요.', b: mapHtml(level <= 2 ? 660 : 600) + '<table class="tbl" style="margin-top:8px"><tr><th>손님</th><th>배달 주소</th><th>찾아 쓰기</th></tr>' + rows + '</table>' });
      var tgt = H[hs[k1]];
      qs.push({ t: '위 지도에 출발(' + (TW.id === 2 ? '버스 정류장' : '햇살 농장') + ')부터 ' + (level <= 2 ? tgt.color + ' 지붕 집(' + tgt.no + '번지)' : tgt.no + '번지') + '까지 가는 길을 색연필로 그리세요.', b: (level >= 4 ? '<div style="font-size:18px">어느 쪽으로 갔는지 차례대로 쓰세요. (위·아래·왼쪽·오른쪽)<br>______________________________________</div>' : '<div style="font-size:16px;color:#8a8174">길을 따라 선을 이어 그려요.</div>') + '<div class="ansline">답: 길을 따라 ' + tgt.no + '번지 집 앞까지 이어지면 정답</div>' });
      if (level >= 2) {

          return '<div class="row" style="margin-bottom:8px"><span style="font-size:19px;min-width:270px">(' + '가나다'[i] + ') ' + h.near + '에 있는 ' + h.color + ' 지붕 집</span>' + opts.map(function (v) { return '<span class="card' + (v === h.no ? ' circ' : '') + '" style="font-size:20px;padding:4px 14px">' + v + '번지</span>'; }).join('') + '</div>'; }).join('') });

    '02-01-01-01': function () {

      /* 2. 가르기 (수 짝) */

    '02-01-02-01': function () {

    '02-01-02-02': function () {

    '02-01-03-01': function () {

      }

      var unit = (level >= 4 ? [a, b, c] : [a, b]).map(function (k) { return { n: k, h: shape('circle', COL[k], 36) }; });

  /* ---------- 한 장 만들기 ---------- */

      var inn = pg.querySelector('.inner'); inn.style.transform = ''; inn.style.width = ''; inn.style.minHeight = '';

    });
  }
  addEventListener('beforeprint', fit);
  addEventListener('load', function () { fit(); });
  function render() {
    var s0 = seed, qs = MAKE[id] ? MAKE[id]() : window.OKS_WS_GENERIC({ id: id, level: level, shuf: shuf, ri: ri, box: box, trace: trace, nMax: nMax, LESSONS: LESSONS });
    var html = pageHtml(qs, false);
    if (document.getElementById('withAns').checked) html += pageHtml(qs, true);
