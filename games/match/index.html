<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff7eb3">
<title>그림 짝 찾기 · 옥쌤의 즐거운 교실</title>
<link rel="manifest" href="../../manifest.json">
<link rel="icon" href="../../icons/ok-face-192.png">
<link rel="apple-touch-icon" href="../../icons/ok-face-180.png">
<link rel="stylesheet" href="../../core/oks-core.css">
<style>
/* 미술 감상 놀이 공용 머리 */
body.oks{background:#ffe6f0 url('../../art/scenes/town_spring_hd.webp') center/cover no-repeat fixed;overflow:hidden;}
body.oks::before{background:radial-gradient(ellipse at center,rgba(255,255,255,.3) 40%,rgba(25,18,45,.3));}
.oks-app{max-width:none;padding:10px 14px;height:100dvh;display:flex;flex-direction:column;box-sizing:border-box;}
.oks-top.compact{flex-wrap:nowrap;position:relative;}
.oks-top.compact .oks-title{flex:0 1 680px;margin:0 auto;min-width:0;background:rgba(255,253,248,.94);border-radius:999px;color:var(--ink);text-shadow:none;box-shadow:0 4px 14px rgba(30,20,50,.2);padding:8px 26px;}
.oks-top.compact > *:not(.oks-title):not(.oks-menu){flex-shrink:0;white-space:nowrap;}
.oks-more{font-size:28px;font-weight:800;color:var(--ink);line-height:1;}
.oks-menu{position:absolute;right:0;top:calc(100% + 8px);z-index:60;display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:22px;background:#fffdf7;box-shadow:0 14px 34px rgba(60,40,20,.28);min-width:240px;}
.oks-menu[hidden]{display:none!important;}
.oks-menu .eco-hud,.oks-menu .oks-level{justify-content:center;flex-wrap:wrap;}
.oks-menu .oks-dots{justify-content:center;box-shadow:none;}
@media (max-width:560px){.oks-top.compact .oks-title{display:none;} .oks-top.compact{justify-content:space-between;} .oks-top.compact .oks-pill > span{display:none;}}
.oks-ask{margin:8px auto 0;max-width:820px;width:100%;}
.oks-ask .oks-mascot{display:none;}
.oks-ask-bubble::before,.oks-ask-bubble::after{display:none!important;}
.oks-ask-bubble{font-size:22px;background:#fffdf8;box-shadow:0 6px 18px rgba(30,40,80,.22);border-radius:24px;display:flex;align-items:center;justify-content:center;gap:12px;min-height:52px;}

.oks-board.mt-board{flex:1;min-height:0;margin:10px auto 0;width:100%;max-width:1200px;padding:0;background:transparent;box-shadow:none;display:flex;flex-direction:column;}
.mt-stage{flex:1;min-height:0;position:relative;border-radius:30px;background:linear-gradient(180deg,#fff4dc,#ffe3b0);box-shadow:0 12px 30px rgba(60,40,20,.28),inset 0 0 0 5px #ffd98f;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.mt-grid{display:grid;gap:12px;}
.mt-card{position:relative;aspect-ratio:4/3;perspective:700px;cursor:pointer;border:0;background:none;padding:0;font:inherit;}
.mt-in{position:absolute;inset:0;transition:transform .45s;transform-style:preserve-3d;}
.mt-card.up .mt-in{transform:rotateY(180deg);}
.mt-f,.mt-b{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;box-shadow:0 5px 12px rgba(60,40,20,.3);}
.mt-b{background:repeating-linear-gradient(45deg,#ff8fbd 0 14px,#ff6fa6 14px 28px);display:flex;align-items:center;justify-content:center;font-size:44px;border:5px solid #fff;box-sizing:border-box;}
.mt-f{transform:rotateY(180deg);background:#fff;border:5px solid #fff;box-sizing:border-box;}
.mt-f img{width:100%;height:100%;object-fit:cover;display:block;border-radius:10px;}
.mt-card.ok .mt-f{border-color:#7ed957;}
.mt-card.ok{animation:mt-ok .5s ease;}
@keyframes mt-ok{40%{transform:scale(1.08)}}
.mt-card.oks-glow{animation:mt-glow .8s ease-in-out infinite;}
@keyframes mt-glow{50%{filter:drop-shadow(0 0 12px #ffd54f) drop-shadow(0 0 22px #ff9800)}}
.mt-hud{position:absolute;left:14px;top:12px;z-index:5;background:rgba(255,255,255,.95);border-radius:999px;padding:5px 14px;font-weight:900;font-size:18px;color:#5a3b00;box-shadow:0 3px 8px rgba(0,0,0,.15);}
.oks-start{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;background:rgba(60,20,60,.35);overflow:auto;}
.st-card{background:#fffdf8;border-radius:32px;padding:22px 26px;max-width:640px;width:calc(100% - 32px);text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.3);margin:16px 0;}
.st-card h1{margin:2px 0 6px;font-size:32px;font-weight:400;}
.st-card p{margin:0 0 10px;color:var(--ink-soft);font-size:17px;line-height:1.5;}
.st-lv{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0 0 12px;}
.st-lv button{border:3px solid #e6d7bb;background:#fff;border-radius:999px;padding:8px 14px;font:inherit;font-size:16px;cursor:pointer;color:var(--ink);}
.st-lv button.on{background:#ff6fa6;border-color:#ff6fa6;color:#fff;}
.st-go{font-size:24px!important;padding:14px 40px!important;}
</style>
</head>
<body class="oks">
<script src="../../core/oks-core.js"></script>
<script src="../../core/oks-eco.js"></script>
<script src="../../art/masters/masters.js"></script>
<script src="../puzzle/images.js"></script>
<script>
(function () {
  'use strict';
  var O = window.OKS, E = O.el, R = '../../';
  var LV = { 1: { pairs: 3, cols: 3 }, 2: { pairs: 4, cols: 4 }, 3: { pairs: 6, cols: 4 }, 4: { pairs: 8, cols: 4 }, 5: { pairs: 10, cols: 5 } };
  var LESSON = O.qs('lesson') || 'mini-match';
  var level = O.levelFor(LESSON);
  var BACK = O.qs('lesson') ? O.ret(O.ROOT + 'play/?id=' + LESSON) : O.ret(O.ROOT + 'index.html');
  var sh = O.shell({ compact: true, title: '그림 짝 찾기', back: BACK, backLabel: '돌아가기', level: level });
  if (O.eco) try { sh.menu.insertBefore(O.eco.hud(sh.menu), sh.levelBtn); } catch (e) {}
  var board = sh.board; board.className = 'oks-board mt-board';
  var stage = E('div', 'mt-stage'); board.appendChild(stage);
  var stats = null, cards = [], first = null, lock = false, found = 0, cfg = null, playing = false, hud = null;

  function layout() {
    var g = stage.querySelector('.mt-grid'); if (!g || !cfg) return;
    var n = cards.length, c = cfg.cols, r = Math.ceil(n / c), W = stage.clientWidth - 40, H = stage.clientHeight - 60, gap = 12;
    var cw = Math.min((W - gap * (c - 1)) / c, (H - gap * (r - 1)) / r * 4 / 3);
    g.style.gridTemplateColumns = 'repeat(' + c + ',' + Math.floor(cw) + 'px)'; g.style.marginTop = '34px';
  }
  function setTarget() {
    O.target({ get: function () {
      var open = cards.filter(function (c) { return c.up && !c.done; });
      if (open.length === 1) return cards.filter(function (c) { return !c.done && c !== open[0] && c.id === open[0].id; }).map(function (c) { return c.el; });
      var left = cards.filter(function (c) { return !c.done; }); if (!left.length) return [];
      return left.filter(function (c) { return c.id === left[0].id; }).map(function (c) { return c.el; });
    }, say: '같은 그림을 찾아요' }, level);
  }
  function begin() {
    cfg = LV[level]; var all = O.shuffle(window.OKS_ART.all().slice()), masters = all.filter(function (x) { return x[3]; });
    var pick = masters.slice(0, cfg.pairs); all.forEach(function (x) { if (pick.length < cfg.pairs && pick.indexOf(x) < 0) pick.push(x); });
    var deck = O.shuffle(pick.concat(pick).map(function (x) { return { id: pick.indexOf(x), d: x }; }));
    stage.innerHTML = '<div class="mt-hud">🎴 <b class="n">0</b> / ' + cfg.pairs + '</div><div class="mt-grid"></div>';
    hud = stage.querySelector('.n'); var g = stage.querySelector('.mt-grid');
    cards = deck.map(function (x) {
      var b = E('button', 'mt-card'); b.type = 'button'; b.setAttribute('aria-label', '카드');
      b.innerHTML = '<div class="mt-in"><div class="mt-b">🎨</div><div class="mt-f"><img src="' + R + x.d[1] + '" alt="" draggable="false"></div></div>';
      var c = { id: x.id, d: x.d, el: b, up: false, done: false }; b.onclick = function () { flip(c); }; g.appendChild(b); return c;
    });
    stats = O.newStats(); O.rememberLevel(LESSON, level); sh.setLevel(level); playing = true; found = 0; first = null; lock = false;
    sh.ask('같은 그림 두 장을 찾아요! (' + cfg.pairs + '쌍)'); layout(); setTarget();
  }
  async function flip(c) {
    if (!playing || lock || c.up || c.done) return;
    O.unlock(); O.clearPrompt(); c.up = true; c.el.classList.add('up'); c.el.classList.remove('oks-glow'); O.sfx('tick');
    if (!first) { first = c; setTarget(); return; }
    var a = first; first = null; lock = true;
    await O.wait(700);
    if (a.id === c.id) {
      a.done = c.done = true; a.el.classList.add('ok'); c.el.classList.add('ok'); found++; hud.textContent = found; O.sfx('ok'); O.praise();
      O.say(c.d[0] + (c.d[2] ? ', ' + c.d[2] : '')); await O.wait(900);
      if (found === cfg.pairs) { playing = false; done(); return; }
    } else {
      stats.mistakes++; O.sfx('no'); await O.wait(500); a.up = c.up = false; a.el.classList.remove('up'); c.el.classList.remove('up'); await O.wait(350);
    }
    lock = false; setTarget();
  }
  function done() {
    var entry = { at: new Date().toISOString(), lesson: LESSON, subject: 'art', school: 'elem', topic: '그림 짝 찾기', level: level, engine: 'match', rounds: cfg.pairs,
      mistakes: stats.mistakes, glow: stats.glow, hand: stats.hand, asked: stats.asked, sec: Math.round((Date.now() - stats.t0) / 1000) };
    var btns = [{ label: '🔁 한 번 더', color: 'green', onClick: function () { location.reload(); } }];
    if (level < 5) btns.push({ label: '다음 수준 (' + (level + 1) + ')', color: 'orange', onClick: function () { O.rememberLevel(LESSON, level + 1); location.href = '?' + (O.qs('lesson') ? 'lesson=' + LESSON + '&' : '') + 'level=' + (level + 1); } });
    btns.push({ label: O.qs('lesson') ? '차시로 돌아가기' : '🏠 돌아가기', color: 'blue', href: BACK });
    O.finish({ stats: stats, entry: entry, title: '짝을 다 찾았어요!', text: '그림 ' + cfg.pairs + '쌍 · ' + O.LEVELS[level - 1].name, mission: { lesson: 1 }, buttons: btns });
  }
  sh.levelBtn.onclick = function () { location.reload(); };
  addEventListener('resize', layout);
  function startScreen() {
    sh.askEl.style.visibility = 'hidden';
    var ov = E('div', 'oks-start');
    var lvBtns = O.LEVELS.map(function (L) { return '<button type="button" data-lv="' + L.n + '" class="' + (L.n === level ? 'on' : '') + '" title="' + O.esc(L.desc) + '">' + L.short + ' · ' + LV[L.n].pairs + '쌍</button>'; }).join('');
    ov.innerHTML = '<div class="st-card"><h1>🎴 그림 짝 찾기</h1><p>카드를 두 장씩 뒤집어서 <b>같은 그림</b>을 찾아요.<br>맞히면 그림 이름을 읽어 줘요.</p><div class="st-lv">' + lvBtns + '</div><button type="button" class="oks-btn green st-go">시작! ▶</button></div>';
    document.body.appendChild(ov);
    ov.querySelectorAll('.st-lv button').forEach(function (b) { b.onclick = function () { level = +b.dataset.lv; ov.querySelectorAll('.st-lv button').forEach(function (x) { x.classList.toggle('on', x === b); }); }; });
    ov.querySelector('.st-go').onclick = function () { O.unlock(); O.hush(); ov.remove(); sh.askEl.style.visibility = ''; begin(); };
  }
  if (O.qs('go')) begin(); else startScreen();
  window.MATCH_GAME = { cards: function () { return cards; }, get playing() { return playing; }, get found() { return found; } };
})();
</script>
</body>
</html>
