<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff7eb3">
<title>나를 만들어요 · 옥쌤의 즐거운 교실</title>
<link rel="manifest" href="../../manifest.json">
<link rel="icon" href="../../icons/ok-face-192.png">
<link rel="apple-touch-icon" href="../../icons/ok-face-180.png">
<link rel="stylesheet" href="../../core/oks-core.css">
<style>
/* 미술 감상 놀이 공용 머리 */
body.oks{background:#ffe6f0 url('../../art/scenes/town_spring_hd.webp') center/cover no-repeat fixed;overflow:hidden;}
body.oks::before{background:radial-gradient(ellipse at center,rgba(255,255,255,.3) 40%,rgba(25,18,45,.3));}
.oks-app{max-width:none;padding:10px 14px;height:100dvh;display:flex;flex-direction:column;box-sizing:border-box;}
.oks-top.compact{flex-wrap:nowrap;position:relative;}
.oks-top.compact .oks-title{flex:0 1 680px;margin:0 auto;min-width:0;background:rgba(255,253,248,.94);border-radius:999px;color:var(--ink);text-shadow:none;box-shadow:0 4px 14px rgba(30,20,50,.2);padding:8px 26px;}
.oks-top.compact > *:not(.oks-title):not(.oks-menu){flex-shrink:0;white-space:nowrap;}
.oks-more{font-size:28px;font-weight:800;color:var(--ink);line-height:1;}
.oks-menu{position:absolute;right:0;top:calc(100% + 8px);z-index:60;display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:22px;background:#fffdf7;box-shadow:0 14px 34px rgba(60,40,20,.28);min-width:240px;}
.oks-menu[hidden]{display:none!important;}
.oks-menu .eco-hud,.oks-menu .oks-level{justify-content:center;flex-wrap:wrap;}
.oks-menu .oks-dots{justify-content:center;box-shadow:none;}
@media (max-width:560px){.oks-top.compact .oks-title{display:none;} .oks-top.compact{justify-content:space-between;} .oks-top.compact .oks-pill > span{display:none;}}
.oks-ask{margin:8px auto 0;max-width:820px;width:100%;}
.oks-ask .oks-mascot{display:none;}
.oks-ask-bubble::before,.oks-ask-bubble::after{display:none!important;}
.oks-ask-bubble{font-size:22px;background:#fffdf8;box-shadow:0 6px 18px rgba(30,40,80,.22);border-radius:24px;display:flex;align-items:center;justify-content:center;gap:12px;min-height:52px;}

.oks-board.mf-board{flex:1;min-height:0;margin:10px auto 0;width:100%;max-width:1100px;padding:0;background:transparent;box-shadow:none;display:flex;flex-direction:column;}
.mf-stage{flex:1;min-height:0;position:relative;border-radius:30px;background:linear-gradient(180deg,#fff4dc,#ffe3b0);box-shadow:0 12px 30px rgba(60,40,20,.28),inset 0 0 0 5px #ffd98f;display:flex;gap:16px;padding:14px;overflow:hidden;}
.mf-view{flex:1 1 46%;min-width:0;display:flex;align-items:center;justify-content:center;}
.mf-view svg{aspect-ratio:1;height:auto;width:auto;max-height:100%;max-width:100%;border-radius:26px;box-shadow:0 0 0 7px #fff,0 0 0 10px #e7c98a,0 10px 22px rgba(80,50,10,.3);background:#fff;}
.mf-side{flex:1 1 54%;min-width:0;display:flex;flex-direction:column;gap:10px;min-height:0;}
.mf-tabs{display:flex;gap:8px;flex-wrap:wrap;}
.mf-tab{border:3px solid #f1e3c8;background:#fff;border-radius:999px;padding:8px 16px;font:inherit;font-size:19px;cursor:pointer;color:var(--ink);}
.mf-tab.on{background:#ff6fa6;border-color:#ff6fa6;color:#fff;}
.mf-tab.oks-glow{animation:mf-glow .8s ease-in-out infinite;} @keyframes mf-glow{50%{filter:drop-shadow(0 0 10px #ffd54f) drop-shadow(0 0 18px #ff9800)}}
.mf-rows{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:10px;}
.mf-row h4{margin:0 0 4px;font-size:16px;font-weight:400;color:#c2185b;}
.mf-opts{display:flex;flex-wrap:wrap;gap:8px;}
.mf-o{width:84px;height:84px;border:4px solid #f1e3c8;border-radius:18px;background:#fff;padding:2px;cursor:pointer;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.mf-o svg{width:100%;height:100%;display:block;}
.mf-o.on{border-color:#ff6fa6;background:#fff0f6;}
.mf-c{width:56px;height:56px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 2px #d9c7a6;cursor:pointer;padding:0;}
.mf-c.on{box-shadow:0 0 0 4px #ff6fa6;}
.mf-done{align-self:center;}
@media (max-width:820px),(max-aspect-ratio:1/1){.mf-stage{flex-direction:column;}.mf-view{flex:0 0 42%;}.mf-o{width:68px;height:68px;}}
.oks-start{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;background:rgba(60,20,60,.35);overflow:auto;}
.st-card{background:#fffdf8;border-radius:32px;padding:22px 26px;max-width:640px;width:calc(100% - 32px);text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.3);margin:16px 0;}
.st-card h1{margin:2px 0 6px;font-size:32px;font-weight:400;}
.st-card p{margin:0 0 10px;color:var(--ink-soft);font-size:17px;line-height:1.5;}
.st-lv{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0 0 12px;}
.st-lv button{border:3px solid #e6d7bb;background:#fff;border-radius:999px;padding:8px 14px;font:inherit;font-size:16px;cursor:pointer;color:var(--ink);}
.st-lv button.on{background:#ff6fa6;border-color:#ff6fa6;color:#fff;}
.st-go{font-size:24px!important;padding:14px 40px!important;}
</style>
</head>
<body class="oks">
<script src="../../core/oks-core.js"></script>
<script src="../../core/oks-eco.js"></script>
<script>
(function () {
  'use strict';
  var O = window.OKS, E = O.el;
  var LESSON = O.qs('lesson') || 'mini-myface';
  var level = O.levelFor(LESSON);
  var BACK = O.qs('lesson') ? O.ret(O.ROOT + 'play/?id=' + LESSON) : O.ret(O.ROOT + 'index.html');
  var sh = O.shell({ compact: true, title: '나를 만들어요', back: BACK, backLabel: '돌아가기', level: level });
  if (O.eco) try { sh.menu.insertBefore(O.eco.hud(sh.menu), sh.levelBtn); } catch (e) {}
  var board = sh.board; board.className = 'oks-board mf-board';
  var stage = E('div', 'mf-stage'); board.appendChild(stage);

  /* ---------- 부품 ---------- */
  var SKIN = ['#ffe0c2', '#f6c9a0', '#e8b28a', '#c68a5f', '#9a6240', '#6f4529'];
  var HAIRC = ['#2b2118', '#6b4423', '#c99a4a', '#b5452a', '#e86f9a', '#4f7fe0', '#9e9e9e'];
  var SHIRT = ['#ff7043', '#ffca28', '#66bb6a', '#42a5f5', '#ab47bc', '#ec407a'];
  var S = { face: 0, skin: 1, hair: 1, hairc: 0, eyes: 0, nose: 0, mouth: 0, acc: 0, cheeks: 1, shirt: 3 };
  var FACES = ['동그란 얼굴', '갸름한 얼굴', '네모난 얼굴'], HAIRS = ['짧은 머리', '긴 머리', '곱슬머리', '양갈래', '똥머리', '민머리'],
    EYES = ['동그란 눈', '웃는 눈', '반짝 눈', '졸린 눈', '윙크'], NOSES = ['점 코', '동글 코', '세모 코'], MOUTHS = ['방긋', '활짝', '오', '쭉', '메롱'], ACCS = ['없음', '안경', '리본', '왕관'];

  function darker(hex, k) { var n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255; return 'rgb(' + Math.round(r * k) + ',' + Math.round(g * k) + ',' + Math.round(b * k) + ')'; }
  function avatar(s, vb, id) {
    var skin = SKIN[s.skin], hc = HAIRC[s.hairc], sd = darker(skin, .82), out = '';
    var back = '', front = '';
    /* 머리(뒤) */
    if (s.hair === 1) back += '<path d="M48 150 Q40 40 150 38 Q260 40 252 150 L258 285 L42 285 Z" fill="' + hc + '"/>';
    if (s.hair === 3) back += '<circle cx="44" cy="190" r="34" fill="' + hc + '"/><circle cx="256" cy="190" r="34" fill="' + hc + '"/>';
    if (s.hair === 4) back += '<circle cx="150" cy="34" r="36" fill="' + hc + '"/><circle cx="150" cy="34" r="16" fill="' + darker(hc.length === 7 ? hc : '#000000', .75) + '"/>';
    if (s.hair === 2) { for (var a = 0; a < 11; a++) { var an = (-190 + a * 20) * Math.PI / 180; back += '<circle cx="' + (150 + Math.cos(an) * 90).toFixed(1) + '" cy="' + (150 + Math.sin(an) * 96).toFixed(1) + '" r="30" fill="' + hc + '"/>'; } }
    /* 머리(앞) */
    if (s.hair !== 5) front += '<path d="M60 150 C58 55 120 40 150 40 C180 40 242 55 240 150 C225 105 195 88 150 90 C105 88 75 105 60 150 Z" fill="' + hc + '"/>';
    if (s.hair === 3) front += '<rect x="30" y="170" width="28" height="12" rx="6" fill="#ff7aa8"/><rect x="242" y="170" width="28" height="12" rx="6" fill="#ff7aa8"/>';
    /* 얼굴 */
    var face = s.face === 0 ? '<ellipse cx="150" cy="155" rx="88" ry="92" fill="' + skin + '"/>' : s.face === 1 ? '<ellipse cx="150" cy="158" rx="78" ry="100" fill="' + skin + '"/>' : '<rect x="62" y="64" width="176" height="190" rx="58" fill="' + skin + '"/>';
    var ears = '<circle cx="64" cy="162" r="16" fill="' + skin + '"/><circle cx="236" cy="162" r="16" fill="' + skin + '"/>';
    var body = '<path d="M36 300 Q38 244 110 236 L190 236 Q262 244 264 300 Z" fill="' + SHIRT[s.shirt] + '"/><rect x="122" y="214" width="56" height="42" rx="12" fill="' + sd + '"/>';
    /* 눈 */
    var eyes = '', brow = '<path d="M96 120 Q112 110 128 120" stroke="' + hc + '" stroke-width="6" fill="none" stroke-linecap="round"/><path d="M172 120 Q188 110 204 120" stroke="' + hc + '" stroke-width="6" fill="none" stroke-linecap="round"/>';
    function ey(x, kind) {
      if (kind === 0) return '<circle cx="' + x + '" cy="146" r="12" fill="#222"/><circle cx="' + (x - 4) + '" cy="141" r="4.5" fill="#fff"/>';
      if (kind === 1) return '<path d="M' + (x - 14) + ' 150 Q' + x + ' 130 ' + (x + 14) + ' 150" stroke="#222" stroke-width="6" fill="none" stroke-linecap="round"/>';
      if (kind === 2) return '<ellipse cx="' + x + '" cy="146" rx="15" ry="18" fill="#fff" stroke="#222" stroke-width="3"/><circle cx="' + x + '" cy="148" r="11" fill="#5b3a1e"/><circle cx="' + x + '" cy="148" r="6" fill="#111"/><circle cx="' + (x - 4) + '" cy="142" r="4" fill="#fff"/><circle cx="' + (x + 4) + '" cy="154" r="2" fill="#fff"/>';
      return '<path d="M' + (x - 14) + ' 146 Q' + x + ' 156 ' + (x + 14) + ' 146" stroke="#222" stroke-width="6" fill="none" stroke-linecap="round"/><path d="M' + (x - 14) + ' 146 l-6 -4 M' + (x + 14) + ' 146 l6 -4" stroke="#222" stroke-width="3" stroke-linecap="round"/>';
    }
    if (s.eyes === 4) eyes = ey(112, 0) + ey(188, 1); else { var k = s.eyes === 3 ? 3 : s.eyes; eyes = ey(112, k) + ey(188, k); }
    /* 코 */
    var nose = s.nose === 0 ? '<circle cx="150" cy="174" r="4.5" fill="' + sd + '"/>' : s.nose === 1 ? '<ellipse cx="150" cy="174" rx="9" ry="7" fill="' + sd + '"/>' : '<path d="M150 160 L142 178 L158 178 Z" fill="none" stroke="' + sd + '" stroke-width="4" stroke-linejoin="round"/>';
    /* 입 */
    var mouth = ['<path d="M122 200 Q150 224 178 200" stroke="#c62828" stroke-width="6" fill="none" stroke-linecap="round"/>',
      '<path d="M118 196 Q150 246 182 196 Z" fill="#8b1e2d"/><path d="M126 198 Q150 206 174 198 L170 206 Q150 212 130 206 Z" fill="#fff"/>',
      '<ellipse cx="150" cy="206" rx="10" ry="13" fill="#8b1e2d"/>',
      '<path d="M128 208 L172 208" stroke="#c62828" stroke-width="6" stroke-linecap="round"/>',
      '<path d="M120 198 Q150 226 180 198 Z" fill="#8b1e2d"/><path d="M138 210 Q150 238 162 210 Z" fill="#ff6f8f"/>'][s.mouth];
    var cheeks = s.cheeks ? '<circle cx="88" cy="184" r="15" fill="rgba(255,90,120,.35)"/><circle cx="212" cy="184" r="15" fill="rgba(255,90,120,.35)"/>' : '';
    var acc = '';
    if (s.acc === 1) acc = '<g fill="rgba(255,255,255,.25)" stroke="#333" stroke-width="5"><circle cx="112" cy="146" r="27"/><circle cx="188" cy="146" r="27"/></g><path d="M139 146 Q150 138 161 146" stroke="#333" stroke-width="5" fill="none"/>';
    if (s.acc === 2) acc = '<g transform="translate(222 70) rotate(18)"><path d="M0 0 L-34 -22 L-34 22 Z M0 0 L34 -22 L34 22 Z" fill="#ff4f8b" stroke="#c2185b" stroke-width="3"/><circle r="9" fill="#ff80ab" stroke="#c2185b" stroke-width="3"/></g>';
    if (s.acc === 3) acc = '<path d="M92 76 L100 38 L125 62 L150 28 L175 62 L200 38 L208 76 Z" fill="#ffd54f" stroke="#c98a00" stroke-width="4" stroke-linejoin="round"/><circle cx="150" cy="52" r="6" fill="#e53935"/>';
    var bg = '<rect width="300" height="300" fill="#fff5e0"/><circle cx="150" cy="150" r="130" fill="#ffe8f1"/>';
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="' + (vb || '0 0 300 300') + '"' + (id ? ' id="' + id + '"' : '') + '>' + bg + body + back + ears + face + cheeks + nose + mouth + eyes + brow + front + acc + '</svg>';
  }

  /* ---------- 화면 ---------- */
  var VB = { full: '0 0 300 300', face: '30 20 240 260', eyes: '84 110 132 70', nose: '110 142 80 56', mouth: '96 172 108 66', acc: '30 10 240 250' };
  var TABS = [
    { n: '😀 얼굴', rows: [{ k: 'face', t: '얼굴 모양', list: FACES, vb: 'face' }, { k: 'skin', t: '피부색', colors: SKIN }] },
    { n: '💇 머리', rows: [{ k: 'hair', t: '머리 모양', list: HAIRS, vb: 'face' }, { k: 'hairc', t: '머리 색', colors: HAIRC }] },
    { n: '👀 눈', rows: [{ k: 'eyes', t: '눈 모양', list: EYES, vb: 'eyes' }] },
    { n: '👃 코', rows: [{ k: 'nose', t: '코 모양', list: NOSES, vb: 'nose' }] },
    { n: '👄 입', rows: [{ k: 'mouth', t: '입 모양', list: MOUTHS, vb: 'mouth' }] },
    { n: '🎀 꾸미기', rows: [{ k: 'acc', t: '꾸미기', list: ACCS, vb: 'acc' }, { k: 'cheeks', t: '볼터치', list: ['없음', '있음'], vb: 'face' }, { k: 'shirt', t: '옷 색', colors: SHIRT }] }
  ];
  var tabsUse = level <= 2 ? [0, 1, 2, 4] : [0, 1, 2, 3, 4, 5];
  var cur = 0, visited = {}, stats = null, view, rowsEl, tabEls = [], doneBtn;

  function drawMain() { view.innerHTML = avatar(S, VB.full, 'mfMain'); }
  function showTab(i) {
    cur = i; visited[i] = 1; tabEls.forEach(function (t, j) { t.classList.toggle('on', tabsUse[j] === i); }); O.clearPrompt();
    rowsEl.innerHTML = '';
    TABS[i].rows.forEach(function (r) {
      var row = E('div', 'mf-row', '<h4>' + r.t + '</h4>'), box = E('div', 'mf-opts');
      if (r.colors) r.colors.forEach(function (c, v) { var b = E('button', 'mf-c' + (S[r.k] === v ? ' on' : '')); b.type = 'button'; b.style.background = c; b.setAttribute('aria-label', r.t + ' ' + (v + 1)); b.onclick = function () { S[r.k] = v; O.sfx('pop'); drawMain(); showTab(cur); }; box.appendChild(b); });
      else r.list.forEach(function (name, v) {
        var tmp = {}; for (var q in S) tmp[q] = S[q]; tmp[r.k] = v;
        var b = E('button', 'mf-o' + (S[r.k] === v ? ' on' : ''), avatar(tmp, VB[r.vb])); b.type = 'button'; b.setAttribute('aria-label', name); b.title = name;
        b.onclick = function () { S[r.k] = v; O.sfx('pop'); O.say(name, { noRepeat: true }); drawMain(); showTab(cur); }; box.appendChild(b);
      });
      row.appendChild(box); rowsEl.appendChild(row);
    });
    nextTarget();
  }
  function nextTarget() {
    var remain = tabsUse.filter(function (i) { return !visited[i]; });
    O.target({ get: function () { if (remain.length) return [tabEls[tabsUse.indexOf(remain[0])]]; return [doneBtn]; }, say: remain.length ? '다음 모습을 골라 봐요' : '다 되었으면 완성을 눌러요' }, level);
  }
  function save() {
    var svg = avatar(S, '0 0 300 300').replace('<svg ', '<svg width="600" height="600" '), img = new Image();
    img.onload = function () {
      var c = E('canvas'); c.width = 600; c.height = 480; var x = c.getContext('2d'); x.fillStyle = '#fff5e0'; x.fillRect(0, 0, 600, 480); x.drawImage(img, 60, -60, 480, 600 * 0.8 * 1.25);
      try { var list = JSON.parse(localStorage.getItem('oks-class-gallery-v1') || '[]'); list.unshift({ id: 'art' + Date.now() + Math.floor(Math.random() * 1000), dataUrl: c.toDataURL('image/png'), theme: '나를 만들어요', liked: false, createdAt: Date.now() }); if (list.length > 24) list.length = 24; localStorage.setItem('oks-class-gallery-v1', JSON.stringify(list)); } catch (e) {}
    };
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  }
  function finish() {
    O.sfx('ok'); O.praise(); O.say('멋진 내 모습이 완성되었어요!'); save();
    var entry = { at: new Date().toISOString(), lesson: LESSON, subject: 'art', school: 'elem', topic: '나를 만들어요', level: level, engine: 'myface', mistakes: 0, glow: stats.glow, hand: stats.hand, asked: stats.asked, sec: Math.round((Date.now() - stats.t0) / 1000) };
    var btns = [{ label: '🔁 다시 만들기', color: 'green', onClick: function () { location.reload(); } }, { label: O.qs('lesson') ? '차시로 돌아가기' : '🏠 돌아가기', color: 'blue', href: BACK }];
    O.finish({ stats: stats, entry: entry, stars: 3, title: '내 얼굴 완성!', text: '작품 전시관에 저장했어요', mission: { lesson: 1 }, buttons: btns });
  }
  function begin() {
    stats = O.newStats(); O.rememberLevel(LESSON, level); sh.setLevel(level);
    stage.innerHTML = '<div class="mf-view"></div><div class="mf-side"><div class="mf-tabs"></div><div class="mf-rows"></div></div>';
    view = stage.querySelector('.mf-view'); rowsEl = stage.querySelector('.mf-rows'); var tb = stage.querySelector('.mf-tabs');
    tabEls = tabsUse.map(function (i) { var b = E('button', 'mf-tab', TABS[i].n); b.type = 'button'; b.onclick = function () { O.unlock(); showTab(i); }; tb.appendChild(b); return b; });
    doneBtn = E('button', 'oks-btn green mf-done', '✅ 완성!'); doneBtn.type = 'button'; doneBtn.onclick = function () { O.unlock(); finish(); };
    stage.querySelector('.mf-side').appendChild(doneBtn);
    sh.ask('내 모습을 만들어 봐요! 마음에 드는 것을 눌러요.'); drawMain(); showTab(tabsUse[0]);
  }
  sh.levelBtn.onclick = function () { location.reload(); };
  function startScreen() {
    sh.askEl.style.visibility = 'hidden';
    var ov = E('div', 'oks-start'), lvBtns = O.LEVELS.map(function (L) { return '<button type="button" data-lv="' + L.n + '" class="' + (L.n === level ? 'on' : '') + '" title="' + O.esc(L.desc) + '">' + L.short + '</button>'; }).join('');
    ov.innerHTML = '<div class="st-card"><h1>🙂 나를 만들어요</h1><p>얼굴, 머리, 눈, 코, 입을 골라서<br><b>나를 닮은 그림</b>을 만들어요. 완성하면 작품 전시관에 걸려요.</p><div class="st-lv">' + lvBtns + '</div><button type="button" class="oks-btn green st-go">시작! ▶</button></div>';
    document.body.appendChild(ov);
    ov.querySelectorAll('.st-lv button').forEach(function (b) { b.onclick = function () { level = +b.dataset.lv; tabsUse = level <= 2 ? [0, 1, 2, 4] : [0, 1, 2, 3, 4, 5]; ov.querySelectorAll('.st-lv button').forEach(function (x) { x.classList.toggle('on', x === b); }); }; });
    ov.querySelector('.st-go').onclick = function () { O.unlock(); O.hush(); ov.remove(); sh.askEl.style.visibility = ''; begin(); };
  }
  if (O.qs('go')) begin(); else startScreen();
  window.MYFACE = { S: S, finish: finish };
})();
</script>
</body>
</html>
