<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7cc8ff">
<title>풍선 터트리기 · 옥쌤의 즐거운 교실</title>
<link rel="manifest" href="../../manifest.json">
<link rel="icon" href="../../icons/ok-face-192.png">
<link rel="apple-touch-icon" href="../../icons/ok-face-180.png">
<link rel="stylesheet" href="../../core/oks-core.css">
<style>
/* 스크래치 '숫자 맞히기 슈팅'을 부드럽게 바꾼 것: 옥쌤 로켓이 별빛을 쏘아 알맞은 풍선을 터트려요
   놀이: 숫자 · 과일 · 낱말 · 색깔 · 색 섞기 · 악기 소리 · 높은 소리 낮은 소리 (과일·색깔은 영어로도) */
body.oks{background:#7cc8ff url('../birds/img/sky.webp') center/cover no-repeat fixed;overflow:hidden;}
body.oks::before{display:none;}
.oks-app{max-width:none;padding:10px 14px 0;height:100dvh;display:flex;flex-direction:column;box-sizing:border-box;}
.oks-top.compact{flex-wrap:nowrap;position:relative;}
.oks-top.compact .oks-title{flex:0 1 680px;margin:0 auto;min-width:0;background:rgba(255,253,248,.94);border-radius:999px;color:var(--ink);text-shadow:none;box-shadow:0 4px 14px rgba(30,20,50,.2);padding:8px 26px;}
.oks-top.compact > *:not(.oks-title):not(.oks-menu){flex-shrink:0;white-space:nowrap;}
.oks-more{font-size:28px;font-weight:800;color:var(--ink);line-height:1;}
.oks-menu{position:absolute;right:0;top:calc(100% + 8px);z-index:60;display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:22px;background:#fffdf7;box-shadow:0 14px 34px rgba(60,40,20,.28);min-width:240px;}
.oks-menu[hidden]{display:none!important;}
.oks-menu .eco-hud,.oks-menu .oks-level{justify-content:center;flex-wrap:wrap;}
.oks-menu .oks-dots{justify-content:center;box-shadow:none;}
@media (max-width:560px){.oks-top.compact .oks-title{display:none;} .oks-top.compact{justify-content:space-between;} .oks-top.compact .oks-pill > span{display:none;}}
.oks-ask{margin:8px auto 0;max-width:860px;width:100%;}
.oks-ask .oks-mascot{display:none;}
.oks-ask-bubble::before,.oks-ask-bubble::after{display:none!important;}
.oks-ask-bubble{font-size:25px;background:#fffdf8;box-shadow:0 6px 18px rgba(30,40,80,.22);border-radius:24px;display:flex;align-items:center;justify-content:center;gap:10px;min-height:64px;flex-wrap:wrap;}
.oks-ask-img{height:60px;width:auto;margin:-8px 0;}
.oks-ask-bubble .key{color:#e0457b;}
.oks-ask-bubble .sw{display:inline-block;width:30px;height:30px;border-radius:50%;vertical-align:middle;border:3px solid #fff;box-shadow:0 0 0 2px rgba(0,0,0,.15);margin:0 2px;}
.oks-ask-bubble .big{font-size:1.5em;line-height:1;}
.sky{flex:1;min-height:0;position:relative;margin:8px -14px 0;padding:0;border-radius:0;background:transparent;box-shadow:none;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;}
.sky .bal{position:absolute;left:0;top:0;pointer-events:none;will-change:transform;filter:drop-shadow(0 8px 8px rgba(20,40,80,.22));}
.sky .bal > img{width:100%;display:block;pointer-events:none;-webkit-user-drag:none;}
.sky .bal .lab{position:absolute;left:0;right:0;top:0;height:58%;display:flex;align-items:center;justify-content:center;pointer-events:auto;cursor:pointer;border-radius:50%;color:#fff;font-weight:400;text-shadow:0 2px 0 rgba(0,0,0,.25),0 0 8px rgba(0,0,0,.2);line-height:1;text-align:center;}
.sky .bal .lab img{width:64%;height:auto;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25));}
.sky .bal .lab .dots{display:flex;flex-wrap:wrap;justify-content:center;gap:3px;width:70%;margin-top:4px;}
.sky .bal .lab .dots i{width:10px;height:10px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);}
.sky .bal .lab .col{display:flex;flex-direction:column;align-items:center;}
.sky .bal .lab.word{color:#fff;}
.sky .bal.c-yellow .lab,.sky .bal.c-orange .lab{color:#5a2d0c;text-shadow:0 0 6px rgba(255,255,255,.9),0 1px 0 rgba(255,255,255,.8);}
.sky .bal.c-yellow .lab .dots i,.sky .bal.c-orange .lab .dots i{background:#5a2d0c;}
.sky .bal.oks-glow{animation:bal-glow .8s ease-in-out infinite;box-shadow:none;}
@keyframes bal-glow{50%{filter:drop-shadow(0 0 14px #ffe066) drop-shadow(0 0 24px #ffb300);}}
.sky .rocket{position:absolute;left:0;top:0;z-index:6;pointer-events:none;filter:drop-shadow(0 8px 10px rgba(20,40,80,.3));}
.sky .shot{position:absolute;left:0;top:0;z-index:5;width:34px;height:34px;pointer-events:none;}
.sky .boom{position:absolute;left:0;top:0;z-index:7;pointer-events:none;}
.sky .ok-mark{position:absolute;z-index:8;pointer-events:none;font-size:30px;}
.ctrl{position:absolute;z-index:8;right:14px;bottom:14px;display:flex;gap:10px;}
.ctrl button{min-width:66px;height:60px;border:none;border-radius:20px;font:inherit;font-size:24px;cursor:pointer;background:rgba(255,253,248,.95);color:var(--ink);box-shadow:0 5px 0 #c9cfd8,0 8px 16px rgba(0,0,0,.2);}
.ctrl button:active{transform:translateY(3px);box-shadow:0 2px 0 #c9cfd8;}
.ctrl .fire{min-width:110px;background:#9b6bff;color:#fff;box-shadow:0 5px 0 #6c43c9,0 8px 16px rgba(0,0,0,.2);font-size:22px;}
.cnt{position:absolute;z-index:8;left:14px;bottom:18px;min-width:56px;height:56px;padding:0 12px;border-radius:999px;background:#ff8a3d;color:#fff;border:4px solid #fff;display:flex;align-items:center;justify-content:center;gap:4px;font-size:24px;box-shadow:0 4px 12px rgba(0,0,0,.25);}
.cnt.pop{animation:cnt .5s ease;}
@keyframes cnt{50%{transform:scale(1.3)}}
.oks-start{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;background:rgba(20,40,90,.35);overflow:auto;}
.st-card{background:#fffdf8;border-radius:32px;padding:20px 22px;max-width:780px;width:calc(100% - 32px);text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.3);margin:16px 0;}
.st-card h1{margin:2px 0 6px;font-size:32px;font-weight:400;}
.st-card p{margin:0 0 12px;color:var(--ink-soft);font-size:17px;line-height:1.5;}
.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 14px;}
.mode{border:3px solid #ece3f8;border-radius:20px;padding:8px 4px;background:#fff;cursor:pointer;font:inherit;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:2px;}
.mode.on{border-color:#9b6bff;background:#f4eeff;box-shadow:0 0 0 3px rgba(155,107,255,.25);}
.mode .ic{height:46px;font-size:32px;display:flex;align-items:center;justify-content:center;gap:2px;}
.mode .ic img{height:100%;width:auto;}
.mode b{font-weight:400;font-size:17px;} .mode small{color:var(--ink-soft);font-size:12px;}
.st-lv{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0 0 14px;}
.st-lv button{border:3px solid #e1d8ee;background:#fff;border-radius:999px;padding:8px 14px;font:inherit;font-size:16px;cursor:pointer;color:var(--ink);}
.st-lv button.on{background:#9b6bff;border-color:#9b6bff;color:#fff;}
.st-go{font-size:24px!important;padding:14px 40px!important;}
.keys{font-size:14px;color:var(--ink-soft);margin-top:10px;}
@media (max-width:640px){
  .oks-ask-bubble{font-size:18px;min-height:50px;} .oks-ask-img{height:42px;}
  .modes{grid-template-columns:repeat(2,1fr);} .mode .ic{height:36px;font-size:26px;}
  .ctrl{right:8px;bottom:10px;} .ctrl button{min-width:54px;height:52px;font-size:20px;} .ctrl .fire{min-width:84px;font-size:18px;}
  .cnt{left:8px;bottom:12px;min-width:46px;height:46px;font-size:20px;}
  .sky .bal .lab .dots i{width:7px;height:7px;}
  .st-card h1{font-size:26px;}
}
body.calm .sky .bal{transition:none;}
body.oks.flying{background:linear-gradient(180deg,#3d9bf0 0%,#7cc4ff 55%,#c3e6ff 100%) fixed;}
.clouds{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
.clouds img{position:absolute;left:0;top:0;opacity:.95;will-change:transform;}
.sky .bal,.sky .rocket,.sky .shot,.sky .boom{z-index:2;} .sky .rocket{z-index:6;}
.st-move{display:flex;gap:8px;justify-content:center;margin:0 0 12px;flex-wrap:wrap;}
.st-move button{border:3px solid #e1d8ee;background:#fff;border-radius:18px;padding:8px 14px;font:inherit;font-size:16px;cursor:pointer;color:var(--ink);}
.st-move button.on{background:#e9f4ff;border-color:#2f7fe8;box-shadow:0 0 0 3px rgba(47,127,232,.2);}
</style>
</head>

  var INST = [

  /* 놀이 (교과 · 아이콘 · 수준) */

  }

  function tick(now) {
    var dt = Math.min(.05, (now - (tick.last || now)) / 1000); tick.last = now;
    if (FLY) clouds.forEach(function (c) {
      c.y += dt * (calm ? .12 : .45) * c.k; if (c.y > 1.1) { c.y = -.3; c.x = Math.random(); }
      var cw = U * .22 * c.k; c.el.style.width = cw + 'px'; c.el.style.opacity = .55 + c.k * .3;
      c.el.style.transform = 'translate(' + (c.x * (W + cw) - cw) + 'px,' + (c.y * H) + 'px)';
    });
    bals.forEach(function (b) {
      if (b.done) return;
      if (FLY && b.vy && !b.hold) {   /* 위에서 아래로. 끝까지 내려가면 다시 위에서 */
        b.y += b.vy * (b.el.classList.contains('oks-glow') ? .35 : 1) * dt;
        if (b.y > R.y + R.h * .2) b.y = -b.h - Math.random() * H * .3;
      }
      if (!b.hold && !calm) {
        var slow = b.el.classList.contains('oks-glow') ? .4 : 1;
        b.x += b.vx * slow * dt;
        var lo = b.minX != null ? b.minX : 8, hi = (b.maxX != null ? b.maxX : W - 8) - b.w; if (hi < lo) hi = lo;
        if (b.x < lo) { b.x = lo; b.vx = Math.abs(b.vx); } if (b.x > hi) { b.x = hi; b.vx = -Math.abs(b.vx); }
      }
      b.ph += dt * 1.4;
      var dy = calm ? 0 : Math.sin(b.ph) * 6;
      b.el.style.transform = 'translate(' + b.x + 'px,' + (b.y + dy) + 'px) rotate(' + (calm ? 0 : Math.sin(b.ph * .7) * 3) + 'deg)';
    });
    rocket.style.transform = 'translate(' + (R.x - R.w / 2) + 'px,' + (R.y + (calm ? 0 : Math.sin(now / 500) * 3)) + 'px)';
    requestAnimationFrame(tick);
  }
  function step(dir) { if (!playing || busy) return; moveTo(R.x + dir * Math.max(30, W * .06)); }
  ctrl.querySelector('.l').onclick = function () { step(-1); };
  ctrl.querySelector('.r').onclick = function () { step(1); };
  ctrl.querySelector('.fire').onclick = function () { fireUp(); };
  ctrl.addEventListener('pointerdown', function (e) { e.stopPropagation(); });
  /* 손가락으로 끌면 로켓이 따라오고, 빈 하늘을 짧게 톡 누르면 쏘아요 */
  var drag = null;
  sky.addEventListener('pointerdown', function (e) {
    if (!playing) return;
    var r = sky.getBoundingClientRect();
    drag = { id: e.pointerId, x0: e.clientX, t0: performance.now(), moved: false, left: r.left };
    try { sky.setPointerCapture(e.pointerId); } catch (er) {}
  });
  sky.addEventListener('pointermove', function (e) {
    if (!drag || drag.id !== e.pointerId || busy) return;
    if (Math.abs(e.clientX - drag.x0) > 10) drag.moved = true;
    if (drag.moved) R.x = clamp(e.clientX - drag.left, R.w / 2 + 8, W - R.w / 2 - 8);
  });
  function endDrag(e) {
    if (!drag || drag.id !== e.pointerId) return;
    var tap = !drag.moved && performance.now() - drag.t0 < 400; drag = null;
    if (tap) fireUp();
  }
  sky.addEventListener('pointerup', endDrag); sky.addEventListener('pointercancel', function () { drag = null; });
  addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft') { e.preventDefault(); step(-1); }
    if (e.key === 'ArrowRight') { e.preventDefault(); step(1); }
    if (e.key === ' ' || e.key === 'ArrowUp') { e.preventDefault(); fireUp(); }
  });

  /* ---------- 시작 화면 ---------- */
  function startScreen() {
    sh.askEl.style.visibility = 'hidden';
    var ov = E('div', 'oks-start');
    var cards = Object.keys(MODES).map(function (k) { var m = MODES[k]; return '<button type="button" class="mode" data-m="' + k + '"><div class="ic">' + m.icon + '</div><b>' + m.name + '</b><small>' + m.desc + '</small></button>'; }).join('');
    var lvBtns = O.LEVELS.map(function (L) { return '<button type="button" data-lv="' + L.n + '" class="' + (L.n === level ? 'on' : '') + '" title="' + O.esc(L.desc) + '">' + L.short + '</button>'; }).join('');
    ov.innerHTML = '<div class="st-card"><h1>🎈 ' + (EN ? 'Pop the Balloons!' : '풍선 터트리기') + '</h1><p>옥쌤 로켓이 <b>별빛</b>을 쏘아 풍선을 터트려요. 알맞은 풍선을 <b>톡</b> 누르세요!</p>' +
      (O.qs('mode') ? '<p><b>' + MODES[mode].name + (EN ? ' (영어)' : '') + '</b></p>' : '<div class="modes">' + cards + '</div>') + '<div class="st-move"><button type="button" data-fly="0">🎈 둥실둥실 (제자리)</button><button type="button" data-fly="1">✈️ 비행 (위에서 떨어져요)</button></div>' +
      '<div class="st-lv">' + lvBtns + '</div>' +
      '<button type="button" class="oks-btn green st-go">시작! ▶</button><div class="keys">◀ ▶ 로 로켓을 움직이고 ⭐ 쏘기 (키보드: ← → 스페이스)</div></div>';
    document.body.appendChild(ov);
    if (!mode) mode = 'number';
    ov.querySelectorAll('.mode').forEach(function (b) {
      b.classList.toggle('on', b.dataset.m === mode);
      b.onclick = function () { O.unlock(); mode = b.dataset.m; ov.querySelectorAll('.mode').forEach(function (x) { x.classList.toggle('on', x === b); }); O.say(MODES[mode].name); };
    });
    ov.querySelectorAll('.st-lv button').forEach(function (b) {
      b.onclick = function () { level = +b.dataset.lv; ov.querySelectorAll('.st-lv button').forEach(function (x) { x.classList.toggle('on', x === b); }); };
    });
    ov.querySelectorAll('.st-move button').forEach(function (b) {
      b.classList.toggle('on', (b.dataset.fly === '1') === FLY);
      b.onclick = function () { FLY = b.dataset.fly === '1'; O.jset('oks_balloon_fly', FLY); ov.querySelectorAll('.st-move button').forEach(function (x) { x.classList.toggle('on', x === b); }); };
    });
    ov.querySelector('.st-go').onclick = function () { O.unlock(); O.hush(); ov.remove(); begin(); };
  }
  function begin() {
    if (mode === 'pitch') FLY = false;   /* 높은·낮은 소리는 위·아래 자리가 뜻이 있어서 제자리 */
    document.body.classList.toggle('flying', FLY); makeClouds();
    sh.askEl.style.visibility = '';
    cfg = MODES[mode].lv[level]; O.rememberLevel(LESSON, level); sh.setLevel(level);
    document.title = '풍선 터트리기 · ' + MODES[mode].name;
    stats = O.newStats(); round = 0; task = {}; popped = 0;
    layout(); newRound();
  }
  sh.levelBtn.onclick = function () { location.reload(); };
  layout(); requestAnimationFrame(tick); startScreen();
  window.BALLOONS = { get mode() { return mode; }, get busy() { return busy; }, get playing() { return playing; }, targets: function () { return mode ? IMPL[mode].targets() : []; } };
})();
</script>
</body>
</html>
