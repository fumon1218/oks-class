<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff7eb3">
<title>그림 속 색 찾기 · 옥쌤의 즐거운 교실</title>
<link rel="manifest" href="../../manifest.json">
<link rel="icon" href="../../icons/ok-face-192.png">
<link rel="apple-touch-icon" href="../../icons/ok-face-180.png">
<link rel="stylesheet" href="../../core/oks-core.css">
<style>
/* 미술 감상 놀이 공용 머리 */
body.oks{background:#ffe6f0 url('../../art/scenes/town_spring_hd.webp') center/cover no-repeat fixed;overflow:hidden;}
body.oks::before{background:radial-gradient(ellipse at center,rgba(255,255,255,.3) 40%,rgba(25,18,45,.3));}
.oks-app{max-width:none;padding:10px 14px;height:100dvh;display:flex;flex-direction:column;box-sizing:border-box;}
.oks-top.compact{flex-wrap:nowrap;position:relative;}
.oks-top.compact .oks-title{flex:0 1 680px;margin:0 auto;min-width:0;background:rgba(255,253,248,.94);border-radius:999px;color:var(--ink);text-shadow:none;box-shadow:0 4px 14px rgba(30,20,50,.2);padding:8px 26px;}
.oks-top.compact > *:not(.oks-title):not(.oks-menu){flex-shrink:0;white-space:nowrap;}
.oks-more{font-size:28px;font-weight:800;color:var(--ink);line-height:1;}
.oks-menu{position:absolute;right:0;top:calc(100% + 8px);z-index:60;display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:22px;background:#fffdf7;box-shadow:0 14px 34px rgba(60,40,20,.28);min-width:240px;}
.oks-menu[hidden]{display:none!important;}
.oks-menu .eco-hud,.oks-menu .oks-level{justify-content:center;flex-wrap:wrap;}
.oks-menu .oks-dots{justify-content:center;box-shadow:none;}
@media (max-width:560px){.oks-top.compact .oks-title{display:none;} .oks-top.compact{justify-content:space-between;} .oks-top.compact .oks-pill > span{display:none;}}
.oks-ask{margin:8px auto 0;max-width:820px;width:100%;}
.oks-ask .oks-mascot{display:none;}
.oks-ask-bubble::before,.oks-ask-bubble::after{display:none!important;}
.oks-ask-bubble{font-size:22px;background:#fffdf8;box-shadow:0 6px 18px rgba(30,40,80,.22);border-radius:24px;display:flex;align-items:center;justify-content:center;gap:12px;min-height:52px;}

.oks-board.lk-board{flex:1;min-height:0;margin:10px auto 0;width:100%;max-width:1100px;padding:0;background:transparent;box-shadow:none;display:flex;flex-direction:column;}
.lk-stage{flex:1;min-height:0;position:relative;border-radius:30px;background:linear-gradient(180deg,#fff4dc,#ffe3b0);box-shadow:0 12px 30px rgba(60,40,20,.28),inset 0 0 0 5px #ffd98f;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;overflow:hidden;}
.lk-pic{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;width:100%;}
.lk-pic img{max-width:100%;max-height:100%;border-radius:14px;box-shadow:0 0 0 7px #fff,0 0 0 10px #e7c98a,0 10px 22px rgba(80,50,10,.3);object-fit:contain;}
.lk-name{font-size:17px;color:#c2185b;font-weight:700;}
.lk-opts{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;}
.lk-opt{min-width:130px;border:4px solid #fff;border-radius:22px;background:#fffdf8;padding:10px 16px;font:inherit;font-size:24px;cursor:pointer;color:var(--ink);box-shadow:0 6px 0 #d9c7a6,0 10px 18px rgba(0,0,0,.18);display:flex;flex-direction:column;align-items:center;gap:6px;}
.lk-opt i{display:block;width:64px;height:64px;border-radius:50%;box-shadow:inset 0 0 0 3px rgba(0,0,0,.15);}
.lk-opt.warm i{background:linear-gradient(135deg,#e53935,#fb8c00,#fdd835);} .lk-opt.cool i{background:linear-gradient(135deg,#1e88e5,#43a047,#8e24aa);}
.lk-opt:active{transform:translateY(4px);}
.lk-opt.no{animation:lk-no .5s;} @keyframes lk-no{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.lk-opt.good{background:#e6ffe0;border-color:#7ed957;}
.lk-opt.oks-glow{animation:lk-glow .8s ease-in-out infinite;} @keyframes lk-glow{50%{filter:drop-shadow(0 0 12px #ffd54f) drop-shadow(0 0 22px #ff9800)}}
.lk-hud{position:absolute;left:14px;top:12px;z-index:5;background:rgba(255,255,255,.95);border-radius:999px;padding:5px 14px;font-weight:900;font-size:18px;color:#5a3b00;box-shadow:0 3px 8px rgba(0,0,0,.15);}
.oks-start{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;background:rgba(60,20,60,.35);overflow:auto;}
.st-card{background:#fffdf8;border-radius:32px;padding:22px 26px;max-width:640px;width:calc(100% - 32px);text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.3);margin:16px 0;}
.st-card h1{margin:2px 0 6px;font-size:32px;font-weight:400;}
.st-card p{margin:0 0 10px;color:var(--ink-soft);font-size:17px;line-height:1.5;}
.st-lv{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0 0 12px;}
.st-lv button{border:3px solid #e6d7bb;background:#fff;border-radius:999px;padding:8px 14px;font:inherit;font-size:16px;cursor:pointer;color:var(--ink);}
.st-lv button.on{background:#ff6fa6;border-color:#ff6fa6;color:#fff;}
.st-go{font-size:24px!important;padding:14px 40px!important;}
</style>
</head>
<body class="oks">
<script src="../../core/oks-core.js"></script>
<script src="../../core/oks-eco.js"></script>
<script src="../../art/masters/masters.js"></script>
<script src="../puzzle/images.js"></script>
<script>
(function () {
  'use strict';
  var O = window.OKS, E = O.el, R = '../../';
  /* 수준: 문제 수 · 보기 수 · 따뜻한/차가운 색 문제(3수준부터) */
  var LV = { 1: { rounds: 3, opts: 2, warm: false }, 2: { rounds: 4, opts: 2, warm: false }, 3: { rounds: 4, opts: 3, warm: true }, 4: { rounds: 5, opts: 3, warm: true }, 5: { rounds: 5, opts: 4, warm: true } };
  var COL = { '빨강': '#e53935', '주황': '#fb8c00', '노랑': '#fdd835', '초록': '#43a047', '파랑': '#1e88e5', '보라': '#8e24aa', '분홍': '#f06292', '갈색': '#8d6e63', '하양': '#fafafa', '검정': '#212121' };
  var WARM = { '빨강': 1, '주황': 1, '노랑': 1, '분홍': 1, '갈색': 1 };
  var LESSON = O.qs('lesson') || 'mini-look';
  var level = O.levelFor(LESSON);
  var BACK = O.qs('lesson') ? O.ret(O.ROOT + 'play/?id=' + LESSON) : O.ret(O.ROOT + 'index.html');
  function josa(w, a, b) { var c = w.charCodeAt(w.length - 1) - 0xAC00; return (c >= 0 && c % 28) ? a : b; }
  var sh = O.shell({ compact: true, title: '그림 속 색 찾기', back: BACK, backLabel: '돌아가기', level: level });
  if (O.eco) try { sh.menu.insertBefore(O.eco.hud(sh.menu), sh.levelBtn); } catch (e) {}
  var board = sh.board; board.className = 'oks-board lk-board';
  var stage = E('div', 'lk-stage'); board.appendChild(stage);
  var stats = null, cfg = null, round = 0, used = [], busy = false, cur = null, optEls = [];

  /* 그림 속 색 세기: 작게 줄여 픽셀마다 색 이름 칸에 넣고, 가장 많은 색을 찾아요 */
  function bucket(r, g, b) {
    var mx = Math.max(r, g, b), mn = Math.min(r, g, b), v = mx / 255, d = mx - mn, s = mx ? d / mx : 0, h = 0;
    if (d) { if (mx === r) h = ((g - b) / d) % 6; else if (mx === g) h = (b - r) / d + 2; else h = (r - g) / d + 4; h *= 60; if (h < 0) h += 360; }
    if (v < .2) return '검정';
    if (s < .12) return v > .86 ? '하양' : null;
    if (s < .2 && v < .55) return null;
    if (h < 15 || h >= 345) return (s < .5 && v > .8) ? '분홍' : (v < .5 ? '갈색' : '빨강');
    if (h < 40) return v < .62 ? '갈색' : '주황';
    if (h < 70) return v < .5 ? '갈색' : '노랑';
    if (h < 165) return '초록';
    if (h < 255) return '파랑';
    if (h < 300) return '보라';
    return '분홍';
  }
  function analyze(im) {
    var c = E('canvas'); c.width = 64; c.height = 36; var x = c.getContext('2d'); x.drawImage(im, 0, 0, 64, 36);
    var d = x.getImageData(0, 0, 64, 36).data, n = {}, tot = 0;
    for (var i = 0; i < d.length; i += 4) { var k = bucket(d[i], d[i + 1], d[i + 2]); if (k) { n[k] = (n[k] || 0) + 1; tot++; } }
    var arr = Object.keys(n).map(function (k) { return [k, n[k] / (64 * 36)]; }).sort(function (a, b) { return b[1] - a[1]; });
    var warm = 0, cool = 0; arr.forEach(function (a) { if (a[0] === '하양' || a[0] === '검정') return; if (WARM[a[0]]) warm += a[1]; else cool += a[1]; });
    return { top: arr, warm: warm, cool: cool };
  }
  function loadImg(src) { return new Promise(function (res, rej) { var im = new Image(); im.onload = function () { res(im); }; im.onerror = rej; im.src = R + src; }); }

  async function nextQ() {
    busy = true; stage.querySelector('.lk-opts') && (stage.querySelector('.lk-opts').style.visibility = 'hidden');
    var q = null, tries = 0, all = window.OKS_ART.all(), pool;
    while (!q && tries++ < 12) {
      pool = O.shuffle(all.filter(function (a) { return used.indexOf(a[1]) < 0; })); if (!pool.length) { used = []; pool = O.shuffle(all.slice()); }
      var it = pool[0]; used.push(it[1]); var im;
      try { im = await loadImg(it[1]); } catch (e) { continue; }
      var an = analyze(im), wantWarm = cfg.warm && round % 2 === 1;
      if (wantWarm) {
        if (Math.abs(an.warm - an.cool) < .12) continue;
        q = { it: it, kind: 'warm', ask: '이 그림에는 어떤 색이 더 많아요?', right: an.warm > an.cool ? '따뜻한 색' : '차가운 색', opts: ['따뜻한 색', '차가운 색'], expl: an.warm > an.cool ? '빨강·주황·노랑 같은 따뜻한 색이 더 많이 보여요.' : '파랑·초록·보라 같은 차가운 색이 더 많이 보여요.' };
      } else {
        var t = an.top; if (t.length < 2 || t[0][1] < .12 || t[0][1] < t[1][1] * 1.3) continue;
        var others = t.slice(1).filter(function (a) { return a[1] < t[0][1] * .6; }).map(function (a) { return a[0]; });
        Object.keys(COL).forEach(function (k) { if (k !== t[0][0] && others.indexOf(k) < 0 && (!t.some(function (a) { return a[0] === k && a[1] > t[0][1] * .6; }))) others.push(k); });
        var wrong = O.shuffle(others.slice(0, Math.max(3, cfg.opts))).slice(0, cfg.opts - 1);
        q = { it: it, kind: 'color', ask: '이 그림에서 가장 많이 보이는 색은 무엇일까요?', right: t[0][0], opts: O.shuffle([t[0][0]].concat(wrong)), expl: t[0][0] + josa(t[0][0], '이', '가') + ' 가장 많이 보여요.' };
      }
      q.im = im;
    }
    if (!q) { return finish(); }
    cur = q; render(q); busy = false;
  }
  function render(q) {
    stage.innerHTML = '<div class="lk-hud">🎨 <b>' + (round + 1) + '</b> / ' + cfg.rounds + '</div><div class="lk-pic"><img alt="" src="' + R + q.it[1] + '"></div><div class="lk-name">🖼️ ' + O.esc(q.it[0]) + (q.it[2] ? ' · ' + O.esc(q.it[2]) : '') + '</div><div class="lk-opts"></div>';
    var box = stage.querySelector('.lk-opts'); optEls = [];
    q.opts.forEach(function (o) {
      var b = E('button', 'lk-opt' + (q.kind === 'warm' ? (o === '따뜻한 색' ? ' warm' : ' cool') : '')); b.type = 'button';
      b.innerHTML = (q.kind === 'color' ? '<i style="background:' + COL[o] + '"></i>' : '<i></i>') + '<span>' + o + '</span>';
      b.onclick = function () { answer(b, o); }; b._o = o; box.appendChild(b); optEls.push(b);
    });
    sh.ask(q.ask); O.say(q.ask, { noRepeat: true });
    O.target({ get: function () { return optEls.filter(function (b) { return b._o === cur.right && !b._done; }); }, say: '반짝이는 곳을 눌러요' }, level);
  }
  async function answer(b, o) {
    if (busy) return; O.unlock();
    if (o !== cur.right) { stats.mistakes++; O.sfx('no'); b.classList.add('no'); setTimeout(function () { b.classList.remove('no'); }, 600); O.say('다시 한 번 그림을 잘 보아요.'); return; }
    busy = true; b._done = true; b.classList.add('good'); O.clearPrompt(); O.sfx('ok'); O.praise(); O.say(cur.expl); await O.wait(2200);
    round++; if (round >= cfg.rounds) return finish(); nextQ();
  }
  function finish() {
    var entry = { at: new Date().toISOString(), lesson: LESSON, subject: 'art', school: 'elem', topic: '그림 속 색 찾기', level: level, engine: 'look', rounds: cfg.rounds,
      mistakes: stats.mistakes, glow: stats.glow, hand: stats.hand, asked: stats.asked, sec: Math.round((Date.now() - stats.t0) / 1000) };
    var btns = [{ label: '🔁 한 번 더', color: 'green', onClick: function () { location.reload(); } }];
    if (level < 5) btns.push({ label: '다음 수준 (' + (level + 1) + ')', color: 'orange', onClick: function () { O.rememberLevel(LESSON, level + 1); location.href = '?' + (O.qs('lesson') ? 'lesson=' + LESSON + '&' : '') + 'level=' + (level + 1); } });
    btns.push({ label: O.qs('lesson') ? '차시로 돌아가기' : '🏠 돌아가기', color: 'blue', href: BACK });
    O.finish({ stats: stats, entry: entry, title: '그림 감상 끝!', text: '색 찾기 ' + cfg.rounds + '문제 · ' + O.LEVELS[level - 1].name, mission: { lesson: 1 }, buttons: btns });
  }
  function begin() { cfg = LV[level]; stats = O.newStats(); round = 0; used = []; O.rememberLevel(LESSON, level); sh.setLevel(level); nextQ(); }
  sh.levelBtn.onclick = function () { location.reload(); };
  function startScreen() {
    sh.askEl.style.visibility = 'hidden';
    var ov = E('div', 'oks-start');
    var lvBtns = O.LEVELS.map(function (L) { return '<button type="button" data-lv="' + L.n + '" class="' + (L.n === level ? 'on' : '') + '" title="' + O.esc(L.desc) + '">' + L.short + '</button>'; }).join('');
    ov.innerHTML = '<div class="st-card"><h1>🎨 그림 속 색 찾기</h1><p>그림을 잘 보고 <b>어떤 색이 가장 많은지</b> 골라요.<br>그림을 보며 색 이름과 느낌을 이야기해 봐요.</p><div class="st-lv">' + lvBtns + '</div><button type="button" class="oks-btn green st-go">시작! ▶</button></div>';
    document.body.appendChild(ov);
    ov.querySelectorAll('.st-lv button').forEach(function (b) { b.onclick = function () { level = +b.dataset.lv; ov.querySelectorAll('.st-lv button').forEach(function (x) { x.classList.toggle('on', x === b); }); }; });
    ov.querySelector('.st-go').onclick = function () { O.unlock(); O.hush(); ov.remove(); sh.askEl.style.visibility = ''; begin(); };
  }
  if (O.qs('go')) begin(); else startScreen();
  window.LOOK_GAME = { q: function () { return cur; }, get round() { return round; }, answer: function (o) { var b = optEls.filter(function (x) { return x._o === o; })[0]; if (b) b.click(); } };
})();
</script>
</body>
</html>
