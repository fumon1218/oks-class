<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff7eb3">
<title>체험 놀이 · 옥쌤의 즐거운 교실</title>
<link rel="manifest" href="../../manifest.json">
<link rel="icon" href="../../icons/ok-face-192.png">
<link rel="apple-touch-icon" href="../../icons/ok-face-180.png">
<link rel="stylesheet" href="../../core/oks-core.css">
<style>
/* 미술 감상 놀이 공용 머리 */
body.oks{background:#ffe6f0 url('../../art/scenes/town_spring_hd.webp') center/cover no-repeat fixed;overflow:hidden;}
body.oks::before{background:radial-gradient(ellipse at center,rgba(255,255,255,.3) 40%,rgba(25,18,45,.3));}
.oks-app{max-width:none;padding:10px 14px;height:100dvh;display:flex;flex-direction:column;box-sizing:border-box;}
.oks-top.compact{flex-wrap:nowrap;position:relative;}
.oks-top.compact .oks-title{flex:0 1 680px;margin:0 auto;min-width:0;background:rgba(255,253,248,.94);border-radius:999px;color:var(--ink);text-shadow:none;box-shadow:0 4px 14px rgba(30,20,50,.2);padding:8px 26px;}
.oks-top.compact > *:not(.oks-title):not(.oks-menu){flex-shrink:0;white-space:nowrap;}
.oks-more{font-size:28px;font-weight:800;color:var(--ink);line-height:1;}
.oks-menu{position:absolute;right:0;top:calc(100% + 8px);z-index:60;display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:22px;background:#fffdf7;box-shadow:0 14px 34px rgba(60,40,20,.28);min-width:240px;}
.oks-menu[hidden]{display:none!important;}
.oks-menu .eco-hud,.oks-menu .oks-level{justify-content:center;flex-wrap:wrap;}
.oks-menu .oks-dots{justify-content:center;box-shadow:none;}
@media (max-width:560px){.oks-top.compact .oks-title{display:none;} .oks-top.compact{justify-content:space-between;} .oks-top.compact .oks-pill > span{display:none;}}
.oks-ask{margin:8px auto 0;max-width:820px;width:100%;}
.oks-ask .oks-mascot{display:none;}
.oks-ask-bubble::before,.oks-ask-bubble::after{display:none!important;}
.oks-ask-bubble{font-size:22px;background:#fffdf8;box-shadow:0 6px 18px rgba(30,40,80,.22);border-radius:24px;display:flex;align-items:center;justify-content:center;gap:12px;min-height:52px;}

.oks-board.sn-board{flex:1;min-height:0;margin:10px auto 0;width:100%;max-width:1000px;padding:0;background:transparent;box-shadow:none;display:flex;flex-direction:column;}
.sn-stage{flex:1;min-height:0;position:relative;border-radius:30px;background:linear-gradient(180deg,#fff4dc,#ffe3b0);box-shadow:0 12px 30px rgba(60,40,20,.28),inset 0 0 0 5px #ffd98f;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:16px;overflow:hidden;}
.sn-hud{position:absolute;left:14px;top:12px;z-index:5;background:rgba(255,255,255,.95);border-radius:999px;padding:5px 14px;font-weight:900;font-size:18px;color:#5a3b00;box-shadow:0 3px 8px rgba(0,0,0,.15);}
.sn-big{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;}
.sn-card{background:#fff;border-radius:28px;box-shadow:0 0 0 7px #fff,0 0 0 10px #e7c98a,0 10px 22px rgba(80,50,10,.3);min-width:260px;padding:14px 40px;text-align:center;}
.sn-card .em{font-size:clamp(90px,22vh,170px);line-height:1.1;}
.sn-card .tx{font-size:clamp(40px,9vh,64px);color:#e0457b;font-weight:700;padding:20px 30px;}
.sn-sign{display:inline-block;border-radius:22px;padding:6px 26px;}
.sn-opts{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;}
.sn-opt{min-width:150px;border:4px solid #fff;border-radius:22px;background:#fffdf8;padding:12px 22px;font:inherit;font-size:30px;cursor:pointer;color:var(--ink);box-shadow:0 6px 0 #d9c7a6,0 10px 18px rgba(0,0,0,.18);}
.sn-opt.em{font-size:clamp(56px,12vh,92px);padding:8px 20px;line-height:1.1;}
.sn-opt:active{transform:translateY(4px);}
.sn-opt.no{animation:sn-no .5s;} @keyframes sn-no{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.sn-opt.good{background:#e6ffe0;border-color:#7ed957;}
.sn-opt.oks-glow{animation:sn-glow .8s ease-in-out infinite;} @keyframes sn-glow{50%{filter:drop-shadow(0 0 12px #ffd54f) drop-shadow(0 0 22px #ff9800)}}
.sn-modes{display:flex;gap:14px;justify-content:center;margin:0 0 12px;flex-wrap:wrap;}
.sn-modes button{flex:1 1 220px;max-width:280px;border:4px solid #f1e3c8;border-radius:22px;background:#fff;padding:14px 10px;font:inherit;font-size:20px;color:var(--ink);cursor:pointer;}
.sn-modes button b{display:block;font-size:44px;font-weight:400;} .sn-modes button.on{border-color:#ff6fa6;background:#fff0f6;}
.oks-start{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;background:rgba(60,20,60,.35);overflow:auto;}
.st-card{background:#fffdf8;border-radius:32px;padding:22px 26px;max-width:640px;width:calc(100% - 32px);text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.3);margin:16px 0;}
.st-card h1{margin:2px 0 6px;font-size:32px;font-weight:400;}
.st-card p{margin:0 0 10px;color:var(--ink-soft);font-size:17px;line-height:1.5;}
.st-lv{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0 0 12px;}
.st-lv button{border:3px solid #e6d7bb;background:#fff;border-radius:999px;padding:8px 14px;font:inherit;font-size:16px;cursor:pointer;color:var(--ink);}
.st-lv button.on{background:#ff6fa6;border-color:#ff6fa6;color:#fff;}
.st-go{font-size:24px!important;padding:14px 40px!important;}
</style>
</head>
<body class="oks">
<script src="../../core/oks-core.js"></script>
<script src="../../core/oks-eco.js"></script>
<script>
(function () {
  'use strict';
  var O = window.OKS, E = O.el;
  var LV = { 1: { rounds: 4, opts: 2, rev: false }, 2: { rounds: 5, opts: 2, rev: false }, 3: { rounds: 5, opts: 3, rev: true }, 4: { rounds: 6, opts: 3, rev: true }, 5: { rounds: 6, opts: 4, rev: true } };
  /* 촉감: [그림, 이름, 느낌] */
  var TOUCH = [
    ['🧸', '곰 인형', '보들보들'], ['☁️', '솜', '보들보들'], ['🐰', '토끼', '보들보들'],
    ['🥥', '코코넛', '까끌까끌'], ['🧱', '벽돌', '까끌까끌'], ['🪵', '나무껍질', '까끌까끌'],
    ['🍮', '푸딩', '말랑말랑'], ['🍡', '찰떡', '말랑말랑'], ['🧽', '스펀지', '말랑말랑'],
    ['🧊', '얼음', '차가워요'], ['⛄', '눈사람', '차가워요'], ['🍦', '아이스크림', '차가워요'],
    ['🪨', '돌멩이', '딱딱해요'], ['🔩', '쇠 나사', '딱딱해요'], ['🥚', '달걀', '딱딱해요'],
    ['🌵', '선인장', '따끔따끔'], ['🦔', '고슴도치', '따끔따끔'], ['🍍', '파인애플', '따끔따끔'],
    ['🧼', '비누', '미끌미끌'], ['🐟', '물고기', '미끌미끌'], ['🫧', '비눗방울', '미끌미끌']
  ];
  /* 그림문자: [그림, 뜻, 바탕색] */
  var SIGN = [
    ['🚻', '화장실', '#42a5f5'], ['🏃', '비상구', '#43a047'], ['🚭', '담배 금지', '#e53935'], ['🅿️', '주차장', '#1e88e5'], ['🚦', '신호등', '#455a64'],
    ['🛗', '엘리베이터', '#78909c'], ['🚮', '쓰레기통', '#43a047'], ['♿', '장애인 배려', '#1e88e5'], ['🚸', '어린이 조심', '#fbc02d'], ['🚫', '하지 마요', '#546e7a'],
    ['⚠️', '조심해요', '#fbc02d'], ['🔥', '불 조심', '#e53935'], ['♻️', '재활용', '#43a047'], ['🚰', '마시는 물', '#29b6f6'], ['🧯', '소화기', '#e53935'], ['📵', '휴대폰 금지', '#e53935']
  ];
  var MODES = { touch: { title: '느낌 짝짓기', emoji: '🖐️', desc: '그림을 보고 어떤 느낌인지 골라요', bank: TOUCH }, sign: { title: '생활 그림문자', emoji: '🚻', desc: '우리 주변 표시의 뜻을 알아봐요', bank: SIGN } };
  var mode = O.qs('mode') === 'sign' ? 'sign' : 'touch';
  var LESSON = O.qs('lesson') || 'mini-senses';
  var level = O.levelFor(LESSON);
  var BACK = O.qs('lesson') ? O.ret(O.ROOT + 'play/?id=' + LESSON) : O.ret(O.ROOT + 'index.html');
  function josa(w, a, b) { var c = w.charCodeAt(w.length - 1) - 0xAC00; return (c >= 0 && c % 28) ? a : b; }
  var sh = O.shell({ compact: true, title: MODES[mode].title, back: BACK, backLabel: '돌아가기', level: level });
  if (O.eco) try { sh.menu.insertBefore(O.eco.hud(sh.menu), sh.levelBtn); } catch (e) {}
  var board = sh.board; board.className = 'oks-board sn-board';
  var stage = E('div', 'sn-stage'); board.appendChild(stage);
  var stats = null, cfg = null, round = 0, cur = null, optEls = [], busy = false, used = [];

  function itemHtml(it) { return mode === 'sign' ? '<span class="sn-sign" style="background:' + it[2] + '"><span class="em">' + it[0] + '</span></span>' : '<span class="em">' + it[0] + '</span>'; }
  function optLabel(it) { return mode === 'sign' ? it[1] : it[2]; }
  function make() {
    var bank = MODES[mode].bank, rev = cfg.rev && round % 2 === 1, pool = O.shuffle(bank.filter(function (b) { return used.indexOf(b) < 0; }));
    if (!pool.length) { used = []; pool = O.shuffle(bank.slice()); }
    var it = pool[0]; used.push(it), key = optLabel(it);
    var others = O.shuffle(bank.filter(function (b) { return optLabel(b) !== key; }));
    var uniq = [], seen = {}; others.forEach(function (b) { var l = optLabel(b); if (!seen[l]) { seen[l] = 1; uniq.push(b); } });
    var wrong = uniq.slice(0, cfg.opts - 1);
    if (!rev) return { rev: false, it: it, ask: mode === 'sign' ? '이 그림은 무슨 뜻일까요?' : it[1] + josa(it[1], '은', '는') + ' 어떤 느낌일까요?', right: key, opts: O.shuffle([key].concat(wrong.map(optLabel))), say: mode === 'sign' ? '이 표시는 ' + it[1] + '이라는 뜻이에요.'.replace('이라는', josa(it[1], '이라는', '라는')) : it[1] + josa(it[1], '은', '는') + ' ' + key + ' 해요.' };
    var picks = O.shuffle([it].concat(wrong));
    return { rev: true, it: it, ask: mode === 'sign' ? '"' + it[1] + '" 표시는 어느 것일까요?' : (({ '차가워요': '차가운', '딱딱해요': '딱딱한' })[key] || key + '한') + ' 것은 무엇일까요?', right: it, opts: picks, say: mode === 'sign' ? it[1] + ' 표시예요.' : it[1] + josa(it[1], '은', '는') + ' ' + key + ' 해요.' };
  }
  var key;
  function nextQ() {
    busy = false; cur = make();
    stage.innerHTML = '<div class="sn-hud">' + MODES[mode].emoji + ' <b>' + (round + 1) + '</b> / ' + cfg.rounds + '</div><div class="sn-big"><div class="sn-card">' + (cur.rev ? '<div class="tx">' + O.esc(mode === 'sign' ? cur.it[1] : optLabel(cur.it)) + '</div>' : itemHtml(cur.it)) + '</div></div><div class="sn-opts"></div>';
    var box = stage.querySelector('.sn-opts'); optEls = [];
    cur.opts.forEach(function (o) {
      var b = E('button', 'sn-opt' + (cur.rev ? ' em' : '')); b.type = 'button';
      b.innerHTML = cur.rev ? itemHtml(o) : O.esc(o); if (cur.rev && mode === 'sign') b.querySelector('.sn-sign').style.padding = '2px 14px';
      b._o = o; b.onclick = function () { answer(b, o); }; box.appendChild(b); optEls.push(b);
    });
    sh.ask(cur.ask); O.say(cur.ask, { noRepeat: true });
    O.target({ get: function () { return optEls.filter(function (b) { return isRight(b._o) && !b._done; }); }, say: '반짝이는 곳을 눌러요' }, level);
  }
  function isRight(o) { return cur.rev ? o === cur.it : o === cur.right; }
  async function answer(b, o) {
    if (busy) return; O.unlock();
    if (!isRight(o)) { stats.mistakes++; O.sfx('no'); b.classList.add('no'); setTimeout(function () { b.classList.remove('no'); }, 600); O.say('다시 한 번 생각해 봐요.'); return; }
    busy = true; b._done = true; b.classList.add('good'); O.clearPrompt(); O.sfx('ok'); O.praise(); O.say(cur.say); await O.wait(2300);
    round++; if (round >= cfg.rounds) return done(); nextQ();
  }
  function done() {
    var entry = { at: new Date().toISOString(), lesson: LESSON, subject: 'art', school: 'elem', topic: MODES[mode].title, level: level, engine: 'senses-' + mode, rounds: cfg.rounds, mistakes: stats.mistakes, glow: stats.glow, hand: stats.hand, asked: stats.asked, sec: Math.round((Date.now() - stats.t0) / 1000) };
    var btns = [{ label: '🔁 한 번 더', color: 'green', onClick: function () { location.reload(); } }];
    if (level < 5) btns.push({ label: '다음 수준 (' + (level + 1) + ')', color: 'orange', onClick: function () { O.rememberLevel(LESSON, level + 1); location.href = '?mode=' + mode + '&' + (O.qs('lesson') ? 'lesson=' + LESSON + '&' : '') + 'level=' + (level + 1); } });
    btns.push({ label: O.qs('lesson') ? '차시로 돌아가기' : '🏠 돌아가기', color: 'blue', href: BACK });
    O.finish({ stats: stats, entry: entry, title: '잘 알았어요!', text: MODES[mode].title + ' ' + cfg.rounds + '문제 · ' + O.LEVELS[level - 1].name, mission: { lesson: 1 }, buttons: btns });
  }
  function begin() { cfg = LV[level]; stats = O.newStats(); round = 0; used = []; O.rememberLevel(LESSON, level); sh.setLevel(level); sh.title && 0; nextQ(); }
  sh.levelBtn.onclick = function () { location.reload(); };
  function startScreen() {
    sh.askEl.style.visibility = 'hidden';
    var ov = E('div', 'oks-start'), lvBtns = O.LEVELS.map(function (L) { return '<button type="button" data-lv="' + L.n + '" class="' + (L.n === level ? 'on' : '') + '" title="' + O.esc(L.desc) + '">' + L.short + '</button>'; }).join('');
    var modeBtns = Object.keys(MODES).map(function (k) { return '<button type="button" data-m="' + k + '" class="' + (k === mode ? 'on' : '') + '"><b>' + MODES[k].emoji + '</b>' + MODES[k].title + '<br><small>' + MODES[k].desc + '</small></button>'; }).join('');
    ov.innerHTML = '<div class="st-card"><h1>🔍 체험 놀이</h1><div class="sn-modes">' + modeBtns + '</div><div class="st-lv">' + lvBtns + '</div><button type="button" class="oks-btn green st-go">시작! ▶</button></div>';
    document.body.appendChild(ov);
    ov.querySelectorAll('.st-lv button').forEach(function (b) { b.onclick = function () { level = +b.dataset.lv; ov.querySelectorAll('.st-lv button').forEach(function (x) { x.classList.toggle('on', x === b); }); }; });
    ov.querySelectorAll('.sn-modes button').forEach(function (b) { b.onclick = function () { mode = b.dataset.m; ov.querySelectorAll('.sn-modes button').forEach(function (x) { x.classList.toggle('on', x === b); }); }; });
    ov.querySelector('.st-go').onclick = function () { O.unlock(); O.hush(); ov.remove(); sh.askEl.style.visibility = ''; var t = document.querySelector('.oks-title'); if (t) t.textContent = MODES[mode].title; begin(); };
  }
  if (O.qs('go') || O.qs('mode')) begin(); else startScreen();
  window.SENSES = { q: function () { return cur; }, get round() { return round; }, answer: function () { var b = optEls.filter(function (x) { return isRight(x._o); })[0]; if (b) b.click(); } };
})();
</script>
</body>
</html>
